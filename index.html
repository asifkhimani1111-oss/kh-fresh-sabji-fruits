<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K H Fresh - Shop Online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --meesho: #9F2089; --meesho-bg: #fdf3f9; }
    body { background: #f8f9fa; font-family: 'Segoe UI', Tahoma, sans-serif; }
    .meesho-bg { background-color: var(--meesho) !important; color: white; }
    .cat-bar { display: flex; overflow-x: auto; white-space: nowrap; background: #fff; padding: 10px; border-bottom: 1px solid #eee; }
    .cat-item { padding: 6px 14px; margin-right: 8px; background: var(--meesho-bg); color: var(--meesho); border-radius: 20px; font-weight: 600; cursor: pointer; border: 1px solid #f3c2e7; }
    .product-card { border: none; border-radius: 12px; transition: 0.2s; background: #fff; height: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .product-card img { height: 160px; object-fit: cover; border-top-left-radius: 12px; border-top-right-radius: 12px; }
    .btn-meesho { background-color: var(--meesho); color: white; border-radius: 6px; font-weight: 600; }
    .btn-meesho:hover { background-color: #80186e; color: white; }
    .badge-policy { background: #ffe6f7; color: var(--meesho); font-size: 11px; padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark meesho-bg sticky-top shadow-sm">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand fw-bold fs-4" href="#">K H Fresh</a>
      <span class="badge bg-warning text-dark align-self-center">⏰ ઓર્ડર સમય: સવારે 9 થી સાંજે 6</span>
    </div>
  </nav>

  <!-- Notice Bar -->
  <div class="bg-dark text-white text-center py-1" style="font-size: 13px;">
    ⚠️ નિયમ: શાકભાજી/ફળ (૨૦૦ ગ્રામ થી ૨ કિલો) | કરિયાણું (મિનિમમ ₹૫૦૦) | નો એક્સચેન્જ / નો કેન્સલેશન
  </div>

  <!-- Meesho Category Bar -->
  <div class="cat-bar container-fluid shadow-sm">
    <div class="cat-item">🥦 ફળ અને શાકભાજી</div>
    <div class="cat-item">🌾 કરિયાણું (Grocery)</div>
    <div class="cat-item">👗 ફેશન અને કપડાં</div>
    <div class="cat-item">📱 ઇલેક્ટ્રોનિક્સ</div>
  </div>

  <!-- Products Live Dynamic Grid -->
  <div class="container my-4">
    <h5 class="fw-bold mb-3" style="color: var(--meesho);">લાઇવ પ્રોડક્ટ્સ (દુકાનદારો દ્વારા ઉમેરાયેલ)</h5>
    <div class="row g-3" id="liveProductGrid">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">પ્રોડક્ટ્સ લોડ થઈ રહી છે...</p>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAwTd8T70ycHDhf2tGQa8sK7Kmxa5Rbr58",
      authDomain: "kh-fresh-sabji-fruits-74b81.firebaseapp.com",
      projectId: "kh-fresh-sabji-fruits-74b81",
      storageBucket: "kh-fresh-sabji-fruits-74b81.firebasestorage.app",
      messagingSenderId: "798281515398",
      appId: "1:798281515398:web:d356b619b69a3cef43ac07"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function isStoreOpen() {
      const hours = new Date().getHours();
      return hours >= 9 && hours < 18;
    }

    async function loadProducts() {
      const grid = document.getElementById('liveProductGrid');
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        if(querySnapshot.empty) {
          grid.innerHTML = `<div class="col-12 text-center text-muted py-4">હજી સુધી કોઈ પ્રોડક્ટ ઉમેરાઈ નથી.</div>`;
          return;
        }
        grid.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const p = doc.data();
          grid.innerHTML += `
            <div class="col-6 col-md-3">
              <div class="product-card card p-2">
                <img src="${p.image || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=300'}" class="card-img-top">
                <div class="card-body p-2 d-flex flex-column justify-content-between">
                  <div>
                    <span class="badge badge-policy">${p.category}</span>
                    <h6 class="fw-bold mt-1 mb-1">${p.name}</h6>
                    <div class="text-danger fw-bold">₹${p.price} / ${p.unit}</div>
                    <small class="text-muted d-block mt-1">સાઇઝ/કલર: ${p.variant || 'સામાન્ય'}</small>
                  </div>
                  <div class="mt-2">
                    <button class="btn btn-meesho btn-sm w-100" onclick="placeOrder('${p.name}', ${p.price}, '${p.category}')">ઓર્ડર કરો</button>
                  </div>
                </div>
              </div>
            </div>`;
        });
      } catch (e) {
        console.error(e);
      }
    }

    window.placeOrder = function(name, price, category) {
      if (!isStoreOpen()) {
        alert("⚠️ દિલગીર છીએ! ઓર્ડરનો સમય સવારે 9:00 થી સાંજે 6:00 સુધીનો જ છે.");
        return;
      }
      if(category.includes("શાકભાજી") || category.includes("ફળ")) {
        let qty = prompt(`'${name}' માટે વજન દાખલ કરો (કિલોમાં, મિનિમમ 0.2 kg થી મહત્તમ 2 kg):`, "0.5");
        qty = parseFloat(qty);
        if (isNaN(qty) || qty < 0.2 || qty > 2.0) {
          alert("❌ નિયમ ભૂલ: ફળ અને શાકભાજીમાં લઘુત્તમ 200 ગ્રામ (0.2 kg) અને મહત્તમ 2 કિલો સુધી જ ઓર્ડર માન્ય ગણાશે!");
          return;
        }
        alert(`✅ ઓર્ડર સફળ! કુલ રકમ: ₹${qty * price}`);
      } else if(category.includes("કરિયાણું")) {
        let totalAmt = prompt(`'${name}' ની કુલ રકમ અથવા જથ્થો નાખો (કરિયાણામાં મિનિમમ ઓર્ડર ₹500 હોવો જરૂરી છે):`, "500");
        totalAmt = parseFloat(totalAmt);
        if(totalAmt < 500) {
          alert("❌ નિયમ ભૂલ: કરિયાણામાં ઓછામાં ઓછો ₹500 નો ઓર્ડર હોવો ફરજિયાત છે!");
          return;
        }
        alert(`✅ કરિયાણાનો ઓર્ડર સ્વીકારાયો! રકમ: ₹${totalAmt}`);
      } else {
        alert(`✅ ઓર્ડર સફળ! પ્રોડક્ટ: ${name} | પ્રાઈઝ: ₹${price}`);
      }
    }

    loadProducts();
  </script>
</body>
</html>
