<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh & Fashion — Smart Multi-Vendor App</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f4faf4;color:#203326;font-family:Arial,sans-serif}
main{max-width:700px;margin:auto}
section{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
h2,h3{color:#168343;margin-top:0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#168343;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.products-grid {display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;}
.product-card{border:1px solid #ddd;border-radius:8px;padding:10px;background:#fafafa;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.product-card img{width:100%;height:110px;object-fit:cover;border-radius:6px;margin-bottom:8px}
.product-info{flex:1;display:flex;flex-direction:column}
.qty-row{display:flex;align-items:center;gap:4px;margin-top:8px}
.qty-row button{width:32px;height:32px;padding:0;font-size:16px;background:#168343;border-radius:6px}
.badge{display:inline-block;padding:3px 6px;background:#e8f5e9;color:#168343;border-radius:6px;font-size:11px;font-weight:bold;margin-bottom:4px;align-self:flex-start}
.cat-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin:10px 0}
@media(max-width:500px){.cat-grid{grid-template-columns:repeat(2, 1fr);}}
.cat-card{background:#e2f0e6;border:2px solid transparent;border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:0.2s}
.cat-card.active{background:#168343;color:white;border-color:#0d4d25}
.cat-card span{display:block;font-size:13px;font-weight:bold;color:#168343;}
.cat-card.active span{color:white;}
.brand-banner{text-align:center;background:linear-gradient(135deg, #e8f5e9, #c8e6c9);padding:24px 16px;border-radius:12px;margin-bottom:14px;border:1px solid #a5d6a7;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.brand-logo{width:110px;height:110px;object-fit:cover;border-radius:50%;border:3px solid #168343;box-shadow:0 4px 10px rgba(0,0,0,0.15);margin-bottom:10px}
.red-alert{background:#ffebee;color:#b3261e;padding:12px;border-radius:8px;border:1px solid #ef9a9a;margin:10px 0;font-weight:bold;text-align:center}
.modal{display:none;position:fixed;z-index:100;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center}
.modal-content{background:white;padding:20px;border-radius:12px;max-width:400px;width:90%;text-align:center}
.modal-content img{width:120px;height:120px;object-fit:cover;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<main>
<div class="brand-banner">
  <h2 style="color:#168343;margin:5px 0 2px 0;">K.H Fresh & Fashion</h2>
  <p style="color:#2e7d32;margin:0;">તાજા ફળ, શાકભાજી, આઈસ્ક્રીમ, મીઠાઈ, ફરસાણ અને ફેશન!</p>
</div>
<section>
<h3>📂 કેટેગરી પસંદ કરો</h3>
<div class="cat-grid" id="catGrid">
  <div class="cat-card active" data-cat="બધી વસ્તુઓ"><span>બધી વસ્તુઓ</span></div>
  <div class="cat-card" data-cat="શાકભાજી"><span>શાકભાજી</span></div>
  <div class="cat-card" data-cat="ફળો"><span>ફળો</span></div>
  <div class="cat-card" data-cat="Ice Cream & Cold Drink"><span>Ice Cream & Cold Drink</span></div>
  <div class="cat-card" data-cat="Mithai & Namkeen"><span>Mithai & Namkeen</span></div>
  <div class="cat-card" data-cat="Women / Ladies"><span>Women / Ladies</span></div>
  <div class="cat-card" data-cat="Men / Gents"><span>Men / Gents</span></div>
  <div class="cat-card" data-cat="કરિયાણું"><span>કરિયાણું</span></div>
  <div class="cat-card" data-cat="જનરલ સ્ટોર"><span>જનરલ સ્ટોર</span></div>
</div>
<p id="shopMeta" style="margin-top:8px; color:#168343; font-weight:bold; font-size:14px;"></p>
</section>
<section>
<h3>🛍️ વસ્તુઓ</h3>
<div id="productsList" class="products-grid">લોડ થઈ રહ્યું છે...</div>
</section>
<section>
<h3>🛒 તમારો ઓર્ડર</h3>
<div id="cartList">હજી કોઈ વસ્તુ પસંદ કરી નથી.</div>
</section>
<section>
<h3>📋 ગ્રાહકની માહિતી</h3>
<label>તમારું નામ</label><input id="custName" placeholder="તમારું નામ લખો" required>
<label>મોબાઈલ નંબર</label><input id="custPhone" type="tel" placeholder="10 અંકનો મોબાઈલ નંબર" required>
<label>પૂરું સરનામું</label><input id="custAddress" placeholder="સોસાયટીનું નામ, મકાન નંબર, વિસ્તાર" required>
</section>
</main>
<div id="productModal" class="modal">
  <div class="modal-content">
    <img id="modalImg" src="" alt="">
    <h3 id="modalTitle" style="margin:5px 0;"></h3>
    <p id="modalPrice" style="color:#168343; font-weight:bold;"></p>
    <button id="closeModal" style="background:#d32f2f; margin-top:10px;">બંધ કરો</button>
  </div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore, collection, onSnapshot, getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",projectId:"kh-fresh-sabji-fruits",storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",messagingSenderId:"815611229461",appId:"1:815611229461:web:ca713dc978e0997930251c",measurementId:"G-HBL4EVF1MN"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let allShops = [], allProducts = [], cart = {}, activeCategory = "બધી વસ્તુઓ";
async function init() {
 const shopSnap = await getDocs(collection(db, "shops"));
 allShops = shopSnap.docs.map(d => ({id: d.id, ...d.data()}));
 onSnapshot(collection(db, "products"), snap => {
  allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
  renderProducts();
 });
 document.querySelectorAll(".cat-card").forEach(card => {
  card.onclick = () => {
   document.querySelectorAll(".cat-card").forEach(c => c.classList.remove("active"));
   card.classList.add("active");
   activeCategory = card.dataset.cat;
   renderProducts();
  };
 });
 $("closeModal").onclick = () => { $("productModal").style.display = "none"; };
 updateMetaText();
}
function updateMetaText() {
 $("shopMeta").textContent = activeCategory === "બધી વસ્તુઓ" ? "બધી દુકાનો અને કેટેગરીઝ ઉપલબ્ધ છે." : `પસંદ કરેલી કેટેગરી: ${activeCategory}`;
}
function renderProducts() {
 const host = $("productsList");
 host.replaceChildren();
 const filtered = allProducts.filter(p => {
  if(p.active === false) return false;
  if(activeCategory !== "બધી વસ્તુઓ" && p.category !== activeCategory) return false;
  return true;
 });
 if(filtered.length === 0) { host.textContent = "આ કેટેગરીમાં હજી કોઈ વસ્તુ ઉપલબ્ધ નથી."; return; }
 filtered.forEach(p => {
  const card = document.createElement("div");
  card.className = "product-card";
  const shopObj = allShops.find(s => s.id === p.shopId);
  card.onclick = (e) => {
   if(e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;
   $("modalImg").src = p.imageUrl || "https://via.placeholder.com/120";
   $("modalTitle").textContent = p.name;
   $("modalPrice").textContent = `₹${p.price} / ${p.unit || 'નંગ'}`;
   $("productModal").style.display = "flex";
  };
  const img = document.createElement("img");
  img.src = p.imageUrl || "https://via.placeholder.com/80";
  const info = document.createElement("div");
  info.className = "product-info";
  const unitType = p.unit || "નંગ";
  info.innerHTML = `<span class="badge">${p.category || 'સામાન્ય'}</span><strong style="font-size:14px;">${p.name}</strong><span style="color:#168343;font-weight:bold;font-size:13px;">₹${p.price} / ${unitType}</span>`;
  const qtyRow = document.createElement("div");
  qtyRow.className = "qty-row";
  const minusBtn = document.createElement("button"); minusBtn.textContent = "-";
  const countSpan = document.createElement("span"); countSpan.style.cssText = "font-weight:bold; font-size:14px; min-width:24px; text-align:center;";
  const cartKey = p.id;
  const currentQty = cart[cartKey] ? cart[cartKey].qty : 0;
  countSpan.textContent = currentQty;
  const plusBtn = document.createElement("button"); plusBtn.textContent = "+";
  minusBtn.onclick = (e) => {
   e.stopPropagation();
   if(!cart[cartKey]) return;
   cart[cartKey].qty -= 1;
   if(cart[cartKey].qty <= 0) delete cart[cartKey];
   countSpan.textContent = cart[cartKey] ? cart[cartKey].qty : 0;
   updateCart();
  };
  plusBtn.onclick = (e) => {
   e.stopPropagation();
   if(!cart[cartKey]) {
    cart[cartKey] = { id: p.id, name: p.name, price: p.price, unit: unitType, qty: 0, shopId: p.shopId || "default" };
   }
   cart[cartKey].qty += 1;
   countSpan.textContent = cart[cartKey].qty;
   updateCart();
  };
  qtyRow.append(minusBtn, countSpan, plusBtn);
  info.append(qtyRow);
  card.append(img, info);
  host.append(card);
 });
}
function updateCart() {
 const host = $("cartList");
 host.replaceChildren();
 const keys = Object.keys(cart);
 if(keys.length === 0) { host.textContent = "હજી કોઈ વસ્તુ પસંદ કરી નથી."; return; }
 const shopsMap = {};
 keys.forEach(k => {
  const item = cart[k];
  const sId = item.shopId || "default";
  if(!shopsMap[sId]) shopsMap[sId] = [];
  shopsMap[sId].push(item);
 });
 Object.keys(shopsMap).forEach(sId => {
  const shopObj = allShops.find(s => s.id === sId) || { name: "મુખ્ય દુકાન", whatsapp: "919876543210" };
  const items = shopsMap[sId];
  const shopBox = document.createElement("div");
  shopBox.style.cssText = "border:1px solid #c8e6c9; background:#f9fbf9; padding:10px; margin:10px 0; border-radius:8px;";
  const shopTitle = document.createElement("h4");
  shopTitle.style.cssText = "margin:0 0 6px 0; color:#168343;";
  shopTitle.textContent = `🏪 દુકાન: ${shopObj.name}`;
  shopBox.append(shopTitle);
  let shopTotal = 0;
  items.forEach(item => {
   let itemTotal = item.price * item.qty;
   shopTotal += itemTotal;
   const row = document.createElement("div");
   row.style.cssText = "display:flex; justify-content:space-between; font-size:14px; margin:3px 0;";
   row.innerHTML = `<span>${item.name} (${item.qty} ${item.unit})</span> <strong>₹${itemTotal.toFixed(2)}</strong>`;
   shopBox.append(row);
  });
  const totalRow = document.createElement("div");
  totalRow.style.cssText = "margin-top:6px; font-weight:bold; font-size:15px;";
  totalRow.textContent = `દુકાનનું કુલ બિલ: ₹${shopTotal.toFixed(2)}`;
  shopBox.append(totalRow);
  const waBtn = document.createElement("button");
  waBtn.style.cssText = "background:#25d366; margin-top:8px;";
  waBtn.textContent = `${shopObj.name} ના WhatsApp પર ઓર્ડર મોકલો`;
  waBtn.onclick = () => {
   const name = $("custName").value.trim();
   const phone = $("custPhone").value.trim();
   const address = $("custAddress").value.trim();
   if(!name || !phone || !address) { alert("કૃપા કરીને તમારું નામ, મોબાઈલ નંબર અને સરનામું ભરો!"); return; }
   let msg = `🛒 *નવો ઓર્ડર - ${shopObj.name}*\n\n👤 નામ: ${name}\n📞 નંબર: ${phone}\n📍 સરનામું: ${address}\n\n*વસ્તુઓ:*`;
   items.forEach(i => { msg += `\n- ${i.name}: ${i.qty} ${i.unit} = ₹${(i.price * i.qty).toFixed(2)}`; });
   msg += `\n\n*કુલ બિલ: ₹${shopTotal.toFixed(2)}*`;
   window.open(`https://wa.me/${shopObj.whatsapp || "919876543210"}?text=` + encodeURIComponent(msg), "_blank");
  };
  shopBox.append(waBtn);
  host.append(shopBox);
 });
}
init();
</script>
</body>
</html>
