
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh Sabji & Fruits</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4faf4;color:#203326}
header{background:#168343;color:white;padding:20px 12px;text-align:center}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0}
.notice{text-align:center;padding:12px;color:#168343}
.filters{text-align:center;padding:10px}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:15px}
.filters button{background:#dcefe0;margin:3px}
.filters button.active{background:#168343;color:white}
#products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px;max-width:900px;margin:auto}
.product{background:white;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 7px #0001}
.product img{width:100%;height:105px;object-fit:contain}
.pic{font-size:55px;height:105px;display:flex;align-items:center;justify-content:center}
.product h3{margin:8px 0}
.price{color:#168343;font-size:19px;font-weight:bold}
.qty{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px}
.qty button{background:#168343;color:white;font-size:18px;min-width:36px}
#order{max-width:600px;margin:15px auto;background:white;padding:16px;border-radius:12px;box-shadow:0 2px 7px #0001}
#order h2{text-align:center;color:#168343}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
.total{font-size:22px;text-align:center;font-weight:bold;margin:15px}
.send{width:100%;background:#168343;color:white;font-size:18px;padding:14px}
footer{text-align:center;padding:20px;color:#666}
.error{padding:16px;text-align:center;color:#b42318}
@media(min-width:650px){#products{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <h1>🥬 K.H Fresh Sabji & Fruits 🍉</h1>
  <p>તાજા શાકભાજી અને ફળો તમારા ઘરે</p>
</header>

<div class="notice">તમારી પસંદગીની વસ્તુ પસંદ કરો અને WhatsApp પર ઓર્ડર આપો.</div>

<div class="filters">
  <button class="active" onclick="setCategory('બધા',this)">બધા</button>
  <button onclick="setCategory('શાકભાજી',this)">🥬 શાકભાજી</button>
  <button onclick="setCategory('ફળો',this)">🍎 ફળો</button>
</div>

<div id="status" class="notice">પ્રોડક્ટ લોડ થઈ રહી છે...</div>
<div id="products"></div>

<section id="order">
  <h2>🛒 તમારો ઓર્ડર</h2>
  <input id="customer" placeholder="તમારું નામ" required>
  <input id="mobile" type="tel" placeholder="મોબાઇલ નંબર" required>
  <textarea id="address" placeholder="તમારું પૂરું સરનામું" rows="3" required></textarea>
  <div id="cartItems">હજુ કોઈ વસ્તુ પસંદ કરી નથી.</div>
  <div class="total">કુલ: ₹<span id="total">0</span></div>
  <button class="send" onclick="sendOrder()">WhatsApp પર ઓર્ડર આપો</button>
</section>

<footer>K.H Fresh Sabji & Fruits | આભાર 🙏</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getFirestore, collection, onSnapshot }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
  authDomain: "kh-fresh-sabji-fruits.firebaseapp.com",
  projectId: "kh-fresh-sabji-fruits",
  storageBucket: "kh-fresh-sabji-fruits.firebasestorage.app",
  messagingSenderId: "815611229461",
  appId: "1:815611229461:web:ca713dc978e0997930251c",
  measurementId: "G-HBL4EVF1MN"
};

const SHOP_NUMBER = "919426852334";
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let cart = {};
let category = "બધા";

window.setCategory = (cat, btn) => {
  category = cat;
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderProducts();
};

function money(n){return Number(n||0).toLocaleString("en-IN");}

function renderProducts(){
  const box = document.getElementById("products");
  const list = products.filter(p =>
    p.active !== false && (category==="બધા" || p.category===category)
  );

  box.innerHTML = "";
  if(!list.length){
    box.innerHTML = '<p style="grid-column:1/-1;text-align:center">આ કેટેગરીમાં હમણાં પ્રોડક્ટ નથી.</p>';
    return;
  }

  list.forEach(p=>{
    const id = p.id;
    const qty = cart[id]?.qty || 0;
    const image = p.imageUrl
      ? `<img src="${p.imageUrl}" alt="${p.name}" onerror="this.style.display='none'">`
      : `<div class="pic">${p.icon || "🥬"}</div>`;

    const card = document.createElement("div");
    card.className = "product";
    card.innerHTML = `
      ${image}
      <h3></h3>
      <div class="price">₹${money(p.price)} / ${p.unit || "કિલો"}</div>
      <div class="qty">
        <button class="minus">−</button>
        <strong>${qty}</strong>
        <button class="plus">+</button>
      </div>`;
    card.querySelector("h3").textContent = p.name || "પ્રોડક્ટ";
    card.querySelector(".minus").onclick = ()=>changeQty(id,-1);
    card.querySelector(".plus").onclick = ()=>changeQty(id,1);
    box.appendChild(card);
  });
  renderCart();
}

function changeQty(id, change){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const next = (cart[id]?.qty || 0) + change;
  if(next<=0) delete cart[id];
  else cart[id] = {qty:next, name:p.name, price:Number(p.price)||0, unit:p.unit||"કિલો"};
  renderProducts();
}

function renderCart(){
  const chosen = Object.entries(cart);
  document.getElementById("cartItems").innerHTML = chosen.length
    ? chosen.map(([id,x])=>`<div>${x.name} — ${x.qty} ${x.unit} = ₹${money(x.qty*x.price)}</div>`).join("")
    : "હજુ કોઈ વસ્તુ પસંદ કરી નથી.";
  document.getElementById("total").textContent =
    money(chosen.reduce((sum,[id,x])=>sum+x.qty*x.price,0));
}

window.sendOrder = ()=>{
  const name = document.getElementById("customer").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const address = document.getElementById("address").value.trim();
  const chosen = Object.values(cart);

  if(!name || !mobile || !address){
    alert("ભાઈ, નામ, મોબાઇલ નંબર અને સરનામું ભરો.");
    return;
  }
  if(!chosen.length){
    alert("પહેલાં ઓછામાં ઓછી એક વસ્તુ પસંદ કરો.");
    return;
  }

  const total = chosen.reduce((sum,x)=>sum+x.qty*x.price,0);
  let msg = "K.H Fresh Sabji & Fruits - નવો ઓર્ડર\n";
  msg += "નામ: "+name+"\nમોબાઇલ: "+mobile+"\nસરનામું: "+address+"\n\n";
  chosen.forEach(x=>{
    msg += x.name+": "+x.qty+" "+x.unit+" - ₹"+(x.qty*x.price)+"\n";
  });
  msg += "\nકુલ: ₹"+total+"\nડિલિવરી ચાર્જ અલગ હોઈ શકે.";
  window.open("https://wa.me/"+SHOP_NUMBER+"?text="+encodeURIComponent(msg),"_blank");
};

onSnapshot(collection(db,"products"), snapshot=>{
  products = snapshot.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById("status").textContent =
    products.length ? "તાજા ભાવ સાથે પ્રોડક્ટ ઉપલબ્ધ છે." :
    "હજુ પ્રોડક્ટ ઉમેરવામાં આવી નથી.";
  renderProducts();
}, error=>{
  document.getElementById("status").textContent =
    "Firebase માંથી પ્રોડક્ટ લોડ થઈ શકી નથી. Firestore Rules તપાસો.";
  console.error(error);
});
</script>
</body>
</html>
