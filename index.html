
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>K.H – New Experience</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  min-height: 100vh;
  transition: 0.4s;
}

body.light {
  background: #f1f5f9;
  color: #172033;
}

header {
  padding: 25px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 3px;
}

.subtitle {
  font-size: 11px;
  opacity: .65;
  letter-spacing: 2px;
}

.round {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: 1px solid #64748b;
  background: transparent;
  color: inherit;
  font-size: 20px;
}

.hero {
  margin: 10px 18px 22px;
  padding: 28px 20px;
  border-radius: 25px;
  background: linear-gradient(135deg,#163c70,#542a83,#126b80);
  text-align: center;
  box-shadow: 0 12px 35px #0005;
}

.orb {
  width: 115px;
  height: 115px;
  margin: 5px auto 20px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 25%,
    #ffffff, #71dfff 18%, #6c54dc 50%, #141c50 80%);
  box-shadow: 0 0 35px #6c8dff, 0 0 75px #348bff66;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-9px) scale(1.04); }
}

.hero h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.hero p {
  font-size: 13px;
  opacity: .85;
}

.clock {
  font-size: 23px;
  font-weight: bold;
  margin-top: 17px;
}

.section-title {
  margin: 25px 20px 15px;
  font-size: 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 13px;
  padding: 0 18px;
}

.tile {
  padding: 20px 13px;
  min-height: 125px;
  border-radius: 20px;
  background: #202e43;
  border: 1px solid #ffffff13;
  color: white;
  text-align: left;
  cursor: pointer;
  transition: .25s;
}

.light .tile {
  background: white;
  color: #172033;
  border-color: #dbe3ed;
}

.tile:active {
  transform: scale(.95);
}

.tile .emoji {
  font-size: 29px;
  display: block;
  margin-bottom: 12px;
}

.tile strong {
  font-size: 15px;
}

.tile small {
  display: block;
  margin-top: 5px;
  opacity: .65;
  font-size: 11px;
}

.voice {
  margin: 22px 18px;
  width: calc(100% - 36px);
  padding: 17px;
  border: none;
  border-radius: 17px;
  background: linear-gradient(100deg,#6556e8,#168bc1);
  color: white;
  font-size: 17px;
  font-weight: bold;
}

#message {
  margin: 10px 20px;
  padding: 15px;
  border-radius: 14px;
  background: #25364e;
  text-align: center;
  font-size: 13px;
  min-height: 45px;
}

.light #message {
  background: #e0eaf6;
}

footer {
  text-align: center;
  padding: 30px 10px;
  opacity: .5;
  font-size: 11px;
}

input[type=file] {
  display: none;
}

#preview {
  display: none;
  width: calc(100% - 36px);
  max-height: 250px;
  object-fit: contain;
  margin: 15px 18px;
  border-radius: 18px;
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">K.H</div>
    <div class="subtitle">A NEW EXPERIENCE</div>
  </div>
  <button class="round" onclick="changeTheme()" id="themeButton">☀️</button>
</header>

<section class="hero">
  <div class="orb"></div>
  <h1>તમારી નવી દુનિયામાં સ્વાગત છે</h1>
  <p>Explore • Experience • Enjoy</p>
  <div class="clock" id="clock">00:00</div>
  <p id="date"></p>
</section>

<h2 class="section-title">તમારી દુનિયા</h2>

<section class="grid">

  <button class="tile" onclick="speakWelcome()">
    <span class="emoji">🎙️</span>
    <strong>ગુજરાતી સહાયક</strong>
    <small>અવાજથી વાત કરો</small>
  </button>

  <button class="tile" onclick="openCamera()">
    <span class="emoji">📸</span>
    <strong>કેમેરા</strong>
    <small>ફોટો લો</small>
  </button>

  <button class="tile" onclick="openGallery()">
    <span class="emoji">🖼️</span>
    <strong>ગેલેરી</strong>
    <small>તમારા ફોટા જુઓ</small>
  </button>

  <button class="tile" onclick="changeTheme()">
    <span class="emoji">🎨</span>
    <strong>થીમ</strong>
    <small>તમારી પસંદગી</small>
  </button>

  <button class="tile" onclick="playSound()">
    <span class="emoji">🔊</span>
    <strong>સાઉન્ડ</strong>
    <small>સાઉન્ડ અનુભવ</small>
  </button>

  <button class="tile" onclick="showInfo()">
    <span class="emoji">✨</span>
    <strong>નવી દુનિયા</strong>
    <small>વધુ અનુભવો</small>
  </button>

</section>

<button class="voice" onclick="startVoice()">
  🎤 K.H સાથે વાત કરો
</button>

<div id="message">
  K.H તૈયાર છે. તમારો અનુભવ શરૂ કરો!
</div>

<img id="preview" alt="તમારો પસંદ કરેલો ફોટો">

<input id="cameraInput" type="file"
accept="image/*" capture="environment"
onchange="showPhoto(this)">

<input id="galleryInput" type="file"
accept="image/*"
onchange="showPhoto(this)">

<footer>
  K.H – A NEW MOBILE EXPERIENCE
  <br><br>
  Made with creativity ❤️
</footer>

<script>
const message = document.getElementById("message");

function updateClock() {
  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-IN", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("gu-IN", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
}

updateClock();
setInterval(updateClock, 1000);

function say(text) {
  if (!("speechSynthesis" in window)) {
    message.textContent = "આ ફોનમાં વોઇસ સપોર્ટ ઉપલબ્ધ નથી.";
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "gu-IN";
  speech.rate = 0.9;

  speechSynthesis.speak(speech);
}

function speakWelcome() {
  message.textContent = "K.H તમને આવકારે છે!";
  say("નમસ્તે! K.H માં તમારું સ્વાગત છે.");
}

function changeTheme() {
  document.body.classList.toggle("light");

  const light =
    document.body.classList.contains("light");

  document.getElementById("themeButton").textContent =
    light ? "🌙" : "☀️";

  localStorage.setItem("kh-theme", light ? "light" : "dark");

  message.textContent =
    light ? "લાઇટ થીમ ચાલુ થઈ." : "ડાર્ક થીમ ચાલુ થઈ.";
}

if (localStorage.getItem("kh-theme") === "light") {
  document.body.classList.add("light");
  document.getElementById("themeButton").textContent = "🌙";
}

function openCamera() {
  document.getElementById("cameraInput").click();
}

function openGallery() {
  document.getElementById("galleryInput").click();
}

function showPhoto(input) {
  if (!input.files || !input.files[0]) return;

  const file = input.files[0];

  if (!file.type.startsWith("image/")) {
    message.textContent = "કૃપા કરીને ફોટો પસંદ કરો.";
    return;
  }

  const url = URL.createObjectURL(file);
  const preview = document.getElementById("preview");

  preview.src = url;
  preview.style.display = "block";

  message.textContent = "તમારો ફોટો પસંદ થયો!";
}

function playSound() {
  try {
    const AudioContext =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContext) {
      message.textContent = "સાઉન્ડ સપોર્ટ ઉપલબ્ધ નથી.";
      return;
    }

    const ctx = new AudioContext();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.frequency.value = 520;
    gain.gain.value = 0.08;

    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.25);

    message.textContent = "K.H સાઉન્ડ ચાલુ થયો!";
    oscillator.onended = () => ctx.close();

  } catch (error) {
    message.textContent = "સાઉન્ડ ચાલુ થઈ શક્યો નહીં.";
  }
}

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    message.textContent =
      "આ બ્રાઉઝરમાં વોઇસ ઓળખવાની સુવિધા ઉપલબ્ધ નથી.";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "gu-IN";
  recognition.interimResults = false;

  message.textContent = "હવે બોલો...";

  recognition.onresult = function(event) {
    const result =
      event.results[0][0].transcript;

    message.textContent = "તમે કહ્યું: " + result;

    say("તમે કહ્યું: " + result);
  };

  recognition.onerror = function() {
    message.textContent =
      "વોઇસ ઓળખી શકાયો નથી. ફરી પ્રયાસ કરો.";
  };

  recognition.start();
}

function showInfo() {
  message.textContent =
    "K.H માં નવી સુવિધાઓ ધીમે ધીમે ઉમેરાશે!";
}
</script>

</body>
</html>
