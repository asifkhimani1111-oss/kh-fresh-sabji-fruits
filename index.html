<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.H Fresh</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f8f4;color:#173b28}
header{background:#13834b;color:white;padding:18px}
main{max-width:1000px;margin:auto;padding:15px}
button{background:#13834b;color:white;border:0;padding:12px;border-radius:8px;margin:4px}
input,select{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}
.card{background:white;padding:14px;margin:10px 0;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
img{max-width:100%;height:130px;object-fit:cover}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>🥬 K.H Fresh</h1>
<p>એક એપ – અનેક દુકાનો – અનેક પ્રોડક્ટ્સ</p>
</header>
<main>
<h3>તમારી મનપસંદ કેટેગરી પસંદ કરો</h3>
<select id="category">
<option>બધી કેટેગરી</option>
<option>શાકભાજી</option>
<option>ફળો</option>
<option>કપડાં</option>
<option>ફૂટવેર</option>
<option>મોબાઇલ અને ઇલેક્ટ્રોનિક્સ</option>
<option>ઘરવખરી</option>
<option>બ્યુટી</option>
<option>કરિયાણું</option>
<option>ફર્નિચર</option>
<option>રમકડાં</option>
<option>જ્વેલરી</option>
<option>હાર્ડવેર</option>
</select>

<input id="search" placeholder="પ્રોડક્ટ શોધો">

<div class="card">
<h2>🏪 દુકાનદાર રજિસ્ટ્રેશન</h2>
<input id="shop" placeholder="દુકાનનું નામ">
<input id="phone" placeholder="WhatsApp નંબર">
<button onclick="saveShop()">દુકાન ઉમેરો</button>
</div>

<div class="card">
<h2>📦 નવી પ્રોડક્ટ ઉમેરો</h2>
<input id="name" placeholder="પ્રોડક્ટનું નામ">
<input id="price" type="number" placeholder="ભાવ ₹">

<label>કેટેગરી</label>
<input id="cat" list="cats" placeholder="કેટેગરી પસંદ કરો">
<datalist id="cats">
<option>શાકભાજી</option><option>ફળો</option>
<option>કપડાં</option><option>ફૂટવેર</option>
<option>કરિયાણું</option><option>ઘરવખરી</option>
</datalist>

<label>માપ / વજન</label>
<select id="unit">
<option>kg</option><option>g</option>
<option>mg</option><option>Liter</option>
<option>ml</option><option>Meter</option>
<option>cm</option><option>Piece</option>
<option>Packet</option><option>Box</option>
<option>Pair</option>
</select>

<input id="size" placeholder="સાઇઝ S M L XL">
<input id="color" placeholder="રંગ">
<input id="design" placeholder="ડિઝાઇન / મોડેલ">

<label>Galleryમાંથી ફોટા પસંદ કરો</label>
<input id="photo" type="file" accept="image/*" multiple>

<button onclick="addProduct()">પ્રોડક્ટ ઉમેરો</button>
</div>

<h2>🛍️ બધી પ્રોડક્ટ્સ</h2>
<div id="products" class="grid"></div>
<h2>🛒 કાર્ટ</h2>
<div id="cart"></div>
<h3 id="total">કુલ ₹0</h3>
<button onclick="order()">WhatsApp ઓર્ડર</button>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getFirestore,collection,addDoc,getDocs,serverTimestamp}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",
projectId:"kh-fresh-sabji-fruits",
storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",
messagingSenderId:"815611229461",
appId:"1:815611229461:web:ca713dc978e0997930251c",
measurementId:"G-HBL4EVF1MN"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
let user=null,shopId=null,items=[],cart=[];

onAuthStateChanged(auth,u=>{user=u;loadProducts()});

window.saveShop=async()=>{
if(!user)return alert("પહેલાં Login કરો");
try{
const r=await addDoc(collection(db,"shops"),{
name:shop.value,whatsapp:phone.value,
ownerUid:user.uid,createdAt:serverTimestamp()
});
shopId=r.id;
alert("દુકાન ઉમેરાઈ ગઈ");
}catch(e){alert(e.message)}
};

window.addProduct=async()=>{
if(!user)return alert("પહેલાં Login કરો");
if(!shopId)return alert("પહેલાં દુકાન ઉમેરો");
try{
await addDoc(collection(db,"products"),{
name:name.value,
price:Number(price.value),
category:cat.value,
unit:unit.value,
sizes:size.value,
colors:color.value,
design:design.value,
imageUrl:"",
shopId:shopId,
ownerUid:user.uid,
active:true,
createdAt:serverTimestamp()
});
alert("પ્રોડક્ટ ઉમેરાઈ");
loadProducts();
}catch(e){alert(e.message)}
};

async function loadProducts(){
try{
const s=await getDocs(collection(db,"products"));
items=s.docs.map(d=>({id:d.id,...d.data()}));
showProducts();
}catch(e){console.log(e)}
}

function showProducts(){
products.innerHTML="";
items.filter(p=>p.active!==false).forEach(p=>{
products.innerHTML+=`
<div class="card">
<h3>${p.name}</h3>
<p>${p.category}</p>
<h3>₹${p.price}/${p.unit}</h3>
<p>${p.colors||""} ${p.sizes||""}</p>
<button onclick="addCart('${p.id}')">કાર્ટમાં ઉમેરો</button>
</div>`;
});
}

window.addCart=id=>{
const p=items.find(x=>x.id===id);
cart.push(p);
showCart();
};

function showCart(){
let total=cart.reduce((s,p)=>s+Number(p.price),0);
document.getElementById("cart").innerHTML=
cart.map(p=>p.name+" ₹"+p.price).join("<br>");
document.getElementById("total").innerText="કુલ ₹"+total;
}

window.order=()=>{
if(!cart.length)return alert("કાર્ટ ખાલી છે");
let total=cart.reduce((s,p)=>s+Number(p.price),0);
let produce=cart.filter(p=>["શાકભાજી","ફળો"].includes(p.category));
let other=cart.filter(p=>!["શાકભાજી","ફળો"].includes(p.category));

let now=new Date();
let minutes=now.getHours()*60+now.getMinutes();

if(produce.length&&(minutes<360||minutes>=540))
return alert("શાકભાજી અને ફળોના ઓર્ડર સવારે 6 થી 9 જ.");

let kg=produce.reduce((s,p)=>s+(p.unit==="kg"?1:p.unit==="g"?0.001:0),0);
if(produce.length&&kg<2)
return alert("ઓછામાં ઓછા 2 કિલો જરૂરી છે");

let otherTotal=other.reduce((s,p)=>s+Number(p.price),0);
if(other.length&&otherTotal<500)
return alert("બીજી વસ્તુઓનો મિનિમમ ઓર્ડર ₹500 છે");

let message=cart.map(p=>p.name+" ₹"+p.price).join("\n");
message+="\nકુલ ₹"+total;
window.open("https://wa.me/?text="+encodeURIComponent(message));
};
</script>
</body>
</html>
