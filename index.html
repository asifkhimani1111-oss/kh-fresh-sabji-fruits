<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh & Fashion — Meesho Style</title>

<!-- ગ્રાહક એપ માટે લોગો સેટિંગ -->
<link rel="icon" type="image/jpeg" href="logo-fresh.jpg">
<link rel="apple-touch-icon" href="logo-fresh.jpg">
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22K.H%20Fresh%20%26%20Fashion%22%2C%22short_name%22%3A%22K.H%20Fresh%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4faf4%22%2C%22theme_color%22%3A%22%23168343%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22logo-fresh.jpg%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fjpeg%22%7D%5D%7D">

<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f4faf4;color:#203326;font-family:Arial,sans-serif}
main{max-width:700px;margin:auto}
section{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
h2,h3{color:#168343;margin-top:0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#168343;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.product-card{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0;background:#fafafa;display:flex;align-items:center;gap:12px;cursor:pointer}
.product-card img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.product-info{flex:1}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty-row button{width:36px;height:36px;padding:0;font-size:18px;background:#168343;border-radius:6px}
.badge{display:inline-block;padding:4px 8px;background:#e8f5e9;color:#168343;border-radius:6px;font-size:12px;font-weight:bold;margin-bottom:6px}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.cat-chip{padding:8px 14px;background:#e2f0e6;border:0;border-radius:20px;font-weight:bold;cursor:pointer;color:#168343;font-size:14px;width:auto}
.cat-chip.active{background:#168343;color:white}
.brand-banner{text-align:center;background:linear-gradient(135deg, #e8f5e9, #c8e6c9);padding:20px;border-radius:12px;margin-bottom:14px;border:1px solid #a5d6a7;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.brand-logo{width:90px;height:90px;object-fit:cover;border-radius:50%;border:3px solid #168343;box-shadow:0 4px 10px rgba(0,0,0,0.15);margin:10px 0 8px 0}
.brand-video{width:100%;max-height:200px;object-fit:cover;border-radius:8px;border:2px solid #168343;}
.brand-title{color:#168343;font-size:24px;margin:5px 0 2px 0;font-weight:bold}
.brand-sub{color:#2e7d32;font-size:14px;margin:0}
.red-alert{background:#ffebee;color:#b3261e;padding:12px;border-radius:8px;border:1px solid #ef9a9a;margin:10px 0;font-weight:bold;text-align:center}
/* Modal Popup */
.modal{display:none;position:fixed;z-index:100;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center}
.modal-content{background:white;padding:20px;border-radius:12px;max-width:400px;width:90%;text-align:center}
.modal-content img{width:120px;height:120px;object-fit:cover;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<main>
<div class="brand-banner">
  <!-- ફેમિલી શોપિંગ વિડીયો (મૂંગો / અવાજ વગર ઓટો-પ્લે) -->
  <video autoplay muted loop playsinline class="brand-video">
    <source src="http://googleusercontent.com/generated_video_content/7024002624783015127" type="video/mp4">
    તમારું બ્રાઉઝર વિડીયો સપોર્ટ કરતું નથી.
  </video>

  <!-- ગોળ લોગો -->
  <img src="logo-fresh.jpg" alt="K.H Fresh Logo" class="brand-logo">
  <h2 class="brand-title">K.H Fresh & Fashion</h2>
  <p class="brand-sub">તાજા ફળો, શાકભાજી અને ફેશન વેર (Women, Men, Kids)!</p>
</div>

<div style="background: #e8f5e9; color: #1b5e20; padding: 10px 14px; margin: 10px 0; border-radius: 8px; text-align: center; font-weight: bold; border: 1px solid #c8e6c9;">
  🕒 સમય: સવારના ૯:૦૦ થી સાંજના ૬:૦૦ | 🚴 ડિલિવરી સુવિધા ઉપલબ્ધ
</div>

<section>
<h3>📂 કેટેગરી પસંદ કરો</h3>
<div class="cat-chips" id="catChips">
  <button class="cat-chip active" data-cat="બધી વસ્તુઓ">બધી વસ્તુઓ</button>
  <button class="cat-chip" data-cat="શાકભાજી">શાકભાજી</button>
  <button class="cat-chip" data-cat="ફળો">ફળો</button>
  <button class="cat-chip" data-cat="Women / Ladies">Women / Ladies</button>
  <button class="cat-chip" data-cat="Men / Gents">Men / Gents</button>
  <button class="cat-chip" data-cat="Big Boy">Big Boy</button>
  <button class="cat-chip" data-cat="Big Girl">Big Girl</button>
  <button class="cat-chip" data-cat="Children">Children</button>
  <button class="cat-chip" data-cat="Baby Boy">Baby Boy</button>
  <button class="cat-chip" data-cat="Baby Girl">Baby Girl</button>
  <button class="cat-chip" data-cat="કરિયાણું">કરિયાણું</button>
  <button class="cat-chip" data-cat="જનરલ સ્ટોર">જનરલ સ્ટોર</button>
</div>
<p id="shopMeta" style="margin-top:8px; color:#168343; font-weight:bold; font-size:14px;"></p>
</section>

<section>
<h3>🛍️ વસ્તુઓ (વિગત જોવા ક્લિક કરો)</h3>
<div id="productsList">કેટેગરી પસંદ કરો...</div>
</section>

<section>
<h3>🛒 તમારો ઓર્ડર (દુકાનવાર અલગ)</h3>
<div id="cartList">હજી કોઈ વસ્તુ પસંદ કરી નથી.</div>
<div id="cartActions"></div>
</section>

<section>
<h3>📋 ગ્રાહકની માહિતી</h3>
<label>તમારું નામ</label>
<input id="custName" placeholder="તમારું નામ લખો" required>
<label>મોબાઈલ નંબર</label>
<input id="custPhone" type="tel" placeholder="૧૦ અંકનો મોબાઈલ નંબર" required>
<label>પૂરો પત્તો (સરનામું)</label>
<input id="custAddress" placeholder="સોસાયટીનું નામ, મકાન નંબર, વિસ્તાર" required>
</section>
</main>

<!-- Product Detail Modal -->
<div id="productModal" class="modal">
  <div class="modal-content">
    <img id="modalImg" src="" alt="">
    <h3 id="modalTitle" style="margin:5px 0;"></h3>
    <p id="modalPrice" style="color:#168343; font-weight:bold;"></p>
    <p id="modalDesc" style="font-size:13px; color:#555;"></p>
    <button id="closeModal" style="background:#d32f2f; margin-top:10px;">બંધ કરો</button>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore, collection, onSnapshot, getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",
 projectId:"kh-fresh-sabji-fruits",
 storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId:"815611229461",
 appId:"1:815611229461:web:ca713dc978e0997930251c",
 measurementId:"G-HBL4EVF1MN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let allShops = [];
let allProducts = [];
let cart = {};
let activeCategory = "બધી વસ્તુઓ";

async function init() {
 const shopSnap = await getDocs(collection(db, "shops"));
 allShops = shopSnap.docs.map(d => ({id: d.id, ...d.data()}));

 onSnapshot(collection(db, "products"), snap => {
  allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
  renderProducts();
 });

 document.querySelectorAll(".cat-chip").forEach(btn => {
  btn.onclick = () => {
   document.querySelectorAll(".cat-chip").forEach(b => b.classList.remove("active"));
   btn.classList.add("active");
   activeCategory = btn.dataset.cat;
   renderProducts();
  };
 });

 $("closeModal").onclick = () => { $("productModal").style.display = "none"; };
 updateMetaText();
}

function updateMetaText() {
 if(activeCategory === "બધી વસ્તુઓ") {
  $("shopMeta").textContent = "બધી દુકાનો અને ફેશન આઇટમ્સ અહીં ઉપલબ્ધ છે.";
 } else {
  $("shopMeta").textContent = `સિલેક્ટ કરેલી કેટેગરી: ${activeCategory}`;
 }
}

function renderProducts() {
 updateMetaText();
 const host = $("productsList");
 host.replaceChildren();

 const filtered = allProducts.filter(p => {
  if(p.active === false) return false;
  if(activeCategory !== "બધી વસ્તુઓ" && p.category !== activeCategory) return false;
  return true;
 });

 if(filtered.length === 0) {
  host.textContent = "આ કેટેગરીમાં હજી કોઈ વસ્તુ ઉપલબ્ધ નથી.";
  return;
 }

 filtered.forEach(p => {
  const card = document.createElement("div");
  card.className = "product-card";

  const shopObj = allShops.find(s => s.id === p.shopId);

  card.onclick = (e) => {
   if(e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;
   $("modalImg").src = p.imageUrl || "https://via.placeholder.com/120";
   $("modalTitle").textContent = p.name;
   $("modalPrice").textContent = `₹${p.price} / ${p.unit || 'નંગ'}`;
   $("modalDesc").textContent = `કેટેગરી: ${p.category || 'સામાન્ય'} | દુકાન: ${shopObj ? shopObj.name : 'મૂળ દુકાન'}`;
   $("productModal").style.display = "flex";
  };

  const img = document.createElement("img");
  img.src = p.imageUrl || "https://via.placeholder.com/80";
  img.alt = p.name;

  const info = document.createElement("div");
  info.className = "product-info";

  const unitType = p.unit || "નંગ (Piece)";
  
  let optionsHtml = "";
  if(p.colors) {
   const colorsArr = p.colors.split(",").map(c => c.trim());
   optionsHtml += `<br><select class="sel-color" data-id="${p.id}" style="font-size:12px; padding:4px;">`;
   colorsArr.forEach(c => optionsHtml += `<option value="${c}">${c}</option>`);
   optionsHtml += `</select>`;
  }

  if(p.sizes) {
   const sizesArr = p.sizes.split(",").map(s => s.trim());
   optionsHtml += `<br><select class="sel-size" data-id="${p.id}" style="font-size:12px; padding:4px; margin-top:2px;">`;
   sizesArr.forEach(s => optionsHtml += `<option value="${s}">${s}</option>`);
   optionsHtml += `</select>`;
  }

  info.innerHTML = `
   <span class="badge">${p.category || 'સામાન્ય'}</span>
   <span style="font-size:11px; color:#666; display:block; margin-bottom:2px;">🏪 દુકાન: ${shopObj ? shopObj.name : 'મૂળ દુકાન'}</span>
   <strong style="display:block;font-size:16px;">${p.name}</strong>
   <span style="color:#168343;font-weight:bold;">₹${p.price} / ${unitType}</span>
   ${optionsHtml}
  `;

  const qtyRow = document.createElement("div");
  qtyRow.className = "qty-row";

  const minusBtn = document.createElement("button");
  minusBtn.textContent = "-";
  
  const countSpan = document.createElement("span");
  countSpan.style.fontWeight = "bold";
  countSpan.style.minWidth = "30px";
  countSpan.style.textAlign = "center";
  
  const cartKey = p.id;
  const currentQty = cart[cartKey] ? cart[cartKey].qty : 0;
  countSpan.textContent = unitType.includes("કિલો") ? currentQty.toFixed(3) : currentQty;

  const plusBtn = document.createElement("button");
  plusBtn.textContent = "+";

  let stepVal = 1;
  if(unitType.includes("કિલો")) stepVal = 0.250;
  else if(unitType.includes("ગ્રામ")) stepVal = 100;
  else if(unitType.includes("મીટર")) stepVal = 1;
  else stepVal = 1;

  minusBtn.onclick = (e) => {
   e.stopPropagation();
   if(!cart[cartKey]) return;
   cart[cartKey].qty -= stepVal;
   if(cart[cartKey].qty <= 0) delete cart[cartKey];
   countSpan.textContent = cart[cartKey] ? (unitType.includes("કિલો") ? cart[cartKey].qty.toFixed(3) : cart[cartKey].qty) : (unitType.includes("કિલો") ? "0.000" : "0");
   updateCart();
  };

  plusBtn.onclick = (e) => {
   e.stopPropagation();
   let selectedColor = "";
   let selectedSize = "";
   const colorSel = card.querySelector(".sel-color");
   const sizeSel = card.querySelector(".sel-size");
   if(colorSel) selectedColor = colorSel.value;
   if(sizeSel) selectedSize = sizeSel.value;

   if(!cart[cartKey]) {
    cart[cartKey] = {
     id: p.id,
     name: p.name, 
     price: p.price, 
     unit: unitType, 
     qty: 0, 
     category: p.category,
     color: selectedColor,
     size: selectedSize,
     shopId: p.shopId || "default"
    };
   }
   cart[cartKey].qty += stepVal;
   cart[cartKey].color = selectedColor;
   cart[cartKey].size = selectedSize;

   countSpan.textContent = unitType.includes("કિલો") ? cart[cartKey].qty.toFixed(3) : cart[cartKey].qty;
   updateCart();
  };

  qtyRow.append(minusBtn, countSpan, plusBtn);
  info.append(qtyRow);
  card.append(img, info);
  host.append(card);
 });
}

function updateCart() {
 const host = $("cartList");
 host.replaceChildren();
 const actionsHost = $("cartActions");
 actionsHost.replaceChildren();

 const keys = Object.keys(cart);
 if(keys.length === 0) {
  host.textContent = "હજી કોઈ વસ્તુ પસંદ કરી નથી.";
  return;
 }

 const shopsMap = {};
 keys.forEach(k => {
  const item = cart[k];
  const sId = item.shopId || "default";
  if(!shopsMap[sId]) shopsMap[sId] = [];
  shopsMap[sId].push(item);
 });

 Object.keys(shopsMap).forEach(sId => {
  const shopObj = allShops.find(s => s.id === sId) || { name: "મુખ્ય દુકાન", whatsapp: "919876543210" };
  const items = shopsMap[sId];

  const shopBox = document.createElement("div");
  shopBox.style.cssText = "border:1px solid #c8e6c9; background:#f9fbf9; padding:10px; margin:10px 0; border-radius:8px;";

  const shopTitle = document.createElement("h4");
  shopTitle.style.cssText = "margin:0 0 6px 0; color:#168343;";
  shopTitle.textContent = `🏪 દુકાન: ${shopObj.name}`;
  shopBox.append(shopTitle);

  let shopTotal = 0;
  let shopProduceWeightKg = 0;
  let hasProduceOrVeg = false;
  let hasGeneralItems = false;

  items.forEach(item => {
   let itemTotal = item.price * item.qty;
   shopTotal += itemTotal;

   if(item.category === "શાકભાજી" || item.category === "ફળો") {
    hasProduceOrVeg = true;
    if(item.unit.includes("કિલો")) shopProduceWeightKg += item.qty;
    else if(item.unit.includes("ગ્રામ")) shopProduceWeightKg += (item.qty / 1000);
   } else {
    hasGeneralItems = true;
   }

   const row = document.createElement("div");
   row.style.cssText = "display:flex; justify-content:space-between; font-size:14px; margin:3px 0;";
   let details = `${item.unit.includes("કિલો") ? item.qty.toFixed(3) : item.qty} ${item.unit}`;
   if(item.color) details += ` | ${item.color}`;
   if(item.size) details += ` | ${item.size}`;
   row.innerHTML = `<span>${item.name} (${details})</span> <strong>₹${itemTotal.toFixed(2)}</strong>`;
   shopBox.append(row);
  });

  const totalRow = document.createElement("div");
  totalRow.style.cssText = "margin-top:6px; font-weight:bold; font-size:15px;";
  totalRow.textContent = `દુકાનનું કુલ બિલ: ₹${shopTotal.toFixed(2)}`;
  shopBox.append(totalRow);

  let shopError = "";
  if(hasProduceOrVeg && shopProduceWeightKg < 1.0) {
   shopError = `⚠️ નિયમ એરર્ટ (${shopObj.name}): ફળ/શાકભાજીનું કુલ વજન ૧ કિલોથી ઓછું છે!`;
  }
  if(!hasProduceOrVeg && hasGeneralItems && shopTotal < 500) {
   shopError = `⚠️ નિયમ એરર્ટ (${shopObj.name}): ઓછામાં ઓછો ₹૫૦૦ નો ઓર્ડર જરૂરી છે!`;
  }

  if(shopError) {
   const errDiv = document.createElement("div");
   errDiv.className = "red-alert";
   errDiv.textContent = shopError;
   shopBox.append(errDiv);
  }

  const waBtn = document.createElement("button");
  waBtn.style.cssText = "background:#25d366; margin-top:8px;";
  waBtn.textContent = `${shopObj.name} ના WhatsApp પર ઓર્ડર મોકલો`;
  if(shopError) waBtn.disabled = true;

  waBtn.onclick = () => {
   sendShopWhatsAppOrder(shopObj, items, shopTotal);
  };

  shopBox.append(waBtn);
  host.append(shopBox);
 });
}

function sendShopWhatsAppOrder(shopObj, items, total) {
 const name = $("custName").value.trim();
 const phone = $("custPhone").value.trim();
 const address = $("custAddress").value.trim();

 if(!name || !phone || !address) {
  alert("કૃપા કરીને તમારું નામ, મોબાઈલ નંબર અને સરનામું ભરો!");
  return;
 }

 let msg = `🛒 *નવો ઓર્ડર - ${shopObj.name}*\n\n👤 નામ: ${name}\n📞 નંબર: ${phone}\n📍 સરનામું: ${address}\n\n*વસ્તુઓ:*`;
 
 items.items?.forEach?.(i => {}); // safety
 items.forEach(i => {
  const t = i.price * i.qty;
  let d = `${i.unit.includes("કિલો") ? i.qty.toFixed(3) : i.qty} ${i.unit}`;
  if(i.color) d += ` (${i.color})`;
  if(i.size) d += ` (${i.size})`;
  msg += `\n- ${i.name}: ${d} = ₹${t.toFixed(2)}`;
 });

 msg += `\n\n*દુકાનનું કુલ બિલ: ₹${total.toFixed(2)}*\n*(નોંધ: ઓર્ડર કેન્સલ થઈ શકશે નહીં)*`;

 const waNumber = shopObj.whatsapp || "919876543210";
 const url = `https://wa.me/${waNumber}?text=` + encodeURIComponent(msg);
 window.open(url, "_blank");
}

init();
</script>
</body>
</html>
