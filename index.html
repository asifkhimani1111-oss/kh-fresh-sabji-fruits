<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.H Fresh - Online Ordering</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f2;font-family:Arial;color:#233}
header{background:#087b43;color:white;padding:15px;text-align:center}
main{max-width:800px;margin:auto;padding:10px}
.shop-card{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.05);display:flex;justify-content:space-between;align-items:center}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.card{background:white;padding:12px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.05);text-align:center}
.card img{width:100px;height:100px;object-fit:cover;border-radius:8px}
button{background:#087b43;color:white;border:0;padding:10px;border-radius:6px;width:100%;font-weight:bold;cursor:pointer;margin-top:8px}
.back-btn{background:#555;width:auto;padding:8px 15px;margin-bottom:10px}
</style>
</head>
<body>
<header>
<h2 id="appTitle">K.H Fresh</h2>
<p>સમાય: સવારે 9 થી સાંજે 6 (શાકભાજી/ફળો: 2 કિલો મિનિમમ)</p>
</header>
<main>
<div id="shopListView">
<h3>દુકાનોની યાદી</h3>
<div id="shopsList"></div>
</div>

<div id="shopDetailView" style="display:none;">
<button class="back-btn" id="backBtn">← પાછા જાઓ</button>
<h2 id="shopNameTitle"></h2>
<div class="product-grid" id="productList"></div>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,getDocs,query,where,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",
 projectId:"kh-fresh-sabji-fruits",
 storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId:"815611229461",
 appId:"1:815611229461:web:ca713dc978e0997930251c",
 measurementId:"G-HBL4EVF1MN"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

async function loadShops(){
 const snap=await getDocs(collection(db,"shops"));
 const list=$("shopsList");
 list.innerHTML="";
 snap.forEach(d=>{
  const s=d.data();
  if(!s.planActive)return; // Jeni plan ON hase te j dukan dekhase
  const div=document.createElement("div");
  div.className="shop-card";
  div.innerHTML=`<div><b>${s.name}</b><br><small>WhatsApp: ${s.whatsapp}</small></div>`;
  const btn=document.createElement("button");
  btn.textContent="મુલાકાત લો";
  btn.style.width="auto";
  btn.onclick=()=>openShop(d.id,s.name,s.whatsapp);
  div.append(btn);
  list.append(div);
 });
}
loadShops();

let currentShopWhatsApp="";

async function openShop(shopId,shopName,whatsapp){
 currentShopWhatsApp=whatsapp;
 $("shopListView").style.display="none";
 $("shopDetailView").style.display="block";
 $("shopNameTitle").textContent=shopName;
 
 const snap=await getDocs(query(collection(db,"products"),where("shopId","==",shopId)));
 const grid=$("productList");
 grid.innerHTML="";
 
 if(snap.empty){
  grid.innerHTML="<p>આ દુકાનમાં હજી કોઈ પ્રોડક્ટ નથી.</p>";
  return;
 }

 snap.forEach(d=>{
  const p=d.data();
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
   ${p.imageUrl?`<img src="${p.imageUrl}">`:''}
   <h4>${p.name}</h4>
   <p>₹${p.price} / ${p.unit}</p>
   <small>${p.category||""} ${p.sizes?`| સાઈઝ: ${p.sizes}`:""} ${p.colors?`| કલર: ${p.colors}`:""}</small>
  `;
  const ordBtn=document.createElement("button");
  ordBtn.textContent="WhatsApp પર ઓર્ડર";
  ordBtn.onclick=()=>orderWhatsApp(currentShopWhatsApp,p.name,p.category,p.price,p.unit);
  card.append(ordBtn);
  grid.append(card);
 });
}

$("backBtn").onclick=()=>{
 $("shopDetailView").style.display="none";
 $("shopListView").style.display="block";
};

window.orderWhatsApp=function(whatsapp,name,category,price,unit){
 const hour=new Date().getHours();
 if(hour<9||hour>=18){
  alert("માફ કરશો! ઓર્ડરનો સમય સવારે 9:00 થી સાંજે 6:00 વાગ્યા સુધીનો છે.");
  return;
 }

 // Jo product shakbhaji ke falo hase tyaj 2 kilo ni shart lagse, baki badha mate yogya unit puchhase
 if(category.includes("શાકભાજી") || category.includes("ફળો") || category.includes("કેળા") || category.includes("શાકફળ")){
  const qty=prompt(name+" માટે કેટલું વજન જોઈએ છે? (શાકભાજી/ફળો માટે ઓછામાં ઓછું 2 કિલો અથવા વધુ લખੋ, દા.ત. 2 Kg, 2.5 Kg):","2 Kg");
  if(!qty)return;
  const num=parseFloat(qty);
  if(isNaN(num)||num<2){
   alert("નિયમ મુજબ શાકભાજી અને ફળો માટે ઓછામાં ઓછું 2 કિલો ઓર્ડર કરવો જરૂરી છે.");
   return;
  }
  window.open(`https://wa.me/91${whatsapp}?text=મારે ઓર્ડર કરવો છે:%0Aપ્રોડક્ટ: ${encodeURIComponent(name)}%0Aજથ્થો: ${encodeURIComponent(qty)}%0Aકિંમત: ₹${price}/${unit}`);
 } else {
  const qty=prompt(name+" કેટલા "+unit+" / જથ્થો જોઈએ છે? (સાઇઝ કે કલર હોય તો તે પણ લખો):","1 "+unit);
  if(!qty)return;
  window.open(`https://wa.me/91${whatsapp}?text=મારે ઓર્ડર કરવો છે:%0Aપ્રોડક્ટ: ${encodeURIComponent(name)}%0Aજથ્થો/સાઇઝ: ${encodeURIComponent(qty)}%0Aકિંમત: ₹${price}/${unit}`);
 }
};
</script>
</body>
</html>
