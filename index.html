<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gujarat Bazaar - Size & Color Portal</title>
    <style>
        :root { 
            --primary: #ff3366; 
            --primary-gradient: linear-gradient(135deg, #ff3366 0%, #ff6b6b 100%);
            --whatsapp: #25d366;
            --bg: #f8fafc; 
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 90px; }
        
        header { 
            background: var(--primary-gradient); 
            color: white; 
            padding: 16px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 4px 20px rgba(255, 51, 102, 0.25);
        }
        header h2 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        
        .container { padding: 16px; max-width: 600px; margin: auto; }
        
        .banner { 
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%); 
            color: #be123c; 
            padding: 12px 16px; 
            border-radius: 14px; 
            font-size: 13px; 
            margin-bottom: 20px; 
            text-align: center; 
            font-weight: 700; 
            border: 1px dashed #fda4af;
        }
        
        .store-card { 
            background: var(--card-bg); 
            border-radius: 18px; 
            overflow: hidden; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.04); 
            margin-bottom: 16px; 
            cursor: pointer; 
            border: 1px solid var(--border);
            transition: transform 0.2s ease;
        }
        .store-card:hover { transform: translateY(-3px); }
        .store-card img { width: 100%; height: 170px; object-fit: cover; background: #f1f5f9; }
        .store-info { padding: 16px; }
        .store-info h3 { font-size: 18px; margin-bottom: 6px; color: #0f172a; font-weight: 700; }
        .store-info p { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
        .map-link { color: #2563eb; font-size: 13px; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 12px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            border: 1px solid var(--border);
        }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; background: #f8fafc; }
        .card h3 { font-size: 14px; margin: 8px 0 4px; font-weight: 700; color: #1e293b; }
        .spec-text { font-size: 11px; color: #475569; background: #f1f5f9; padding: 4px 8px; border-radius: 6px; margin-bottom: 6px; display: inline-block; font-weight: 600; }
        .price { color: var(--primary); font-weight: 800; font-size: 15px; margin-bottom: 6px; }
        
        /* Variant selectors for Fashion/Shoes */
        .variant-box { margin-bottom: 8px; }
        .variant-box label { font-size: 10px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 2px; text-transform: uppercase; }
        .variant-select { width: 100%; padding: 6px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; outline: none; }

        .qty-control { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); margin-top: 6px; }
        .qty-control button { background: #f1f5f9; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; font-size: 15px; width: auto; color: #1e293b; }
        .qty-control span { font-size: 12px; font-weight: 700; color: #0f172a; text-align: center; }
        
        button.main-btn { background: var(--primary-gradient); color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: 700; font-size: 14px; box-shadow: 0 4px 15px rgba(255, 51, 102, 0.25); }
        
        .cart-badge { background: rgba(255,255,255,0.25); padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 700; backdrop-filter: blur(5px); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: white; width: 92%; max-width: 450px; padding: 24px; border-radius: 22px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 30px -5px rgba(0,0,0,0.15); }
        .modal-content h3 { font-size: 20px; margin-bottom: 16px; color: #0f172a; font-weight: 800; }
        
        input, select { width: 100%; padding: 12px 14px; margin: 6px 0 14px 0; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; outline: none; background: #f8fafc; }
        
        .back-btn { background: #334155; color: white; width: auto; padding: 8px 16px; margin-bottom: 14px; display: inline-block; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; border: none; }
    </style>
</head>
<body>

    <header>
        <h2>🛍️ Gujarat Bazaar</h2>
        <div class="cart-badge" onclick="openCart()">
            🛒 Cart (<span id="cartCount">0</span>)
        </div>
    </header>

    <div class="container">
        <div class="banner">🕒 Order Time: Savar na 9 thi Sanj na 6</div>

        <div id="storeView">
            <h3 style="margin-bottom: 6px; font-size: 18px; font-weight: 800;">Gujaratni Badhi Dukano</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Jevi dukan ma jvu hoy teana par click karo:</p>
            <div id="storesContainer"></div>
        </div>

        <div id="productView" style="display: none;">
            <button class="back-btn" onclick="goBackToStores()">⬅️ Badhi Dukano Par Jao</button>
            <h3 id="currentStoreTitle" style="margin-bottom: 16px; font-size: 18px; font-weight: 800;">Products</h3>
            <div class="grid" id="productGrid"></div>
        </div>
    </div>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <h3>Tamaru Smart Cart</h3>
            <div id="cartItemsList" style="margin: 15px 0; max-height: 200px; overflow-y: auto;"></div>
            
            <div style="border-top: 1px solid var(--border); padding-top: 14px;">
                <p style="margin-bottom: 4px;">Total Amount: <b id="cartTotal" style="color: var(--primary);">₹0</b></p>
                
                <input type="text" id="custName" placeholder="Tamaru Naam">
                <input type="text" id="custPhone" placeholder="Mobile Number">
                <input type="text" id="custAddress" placeholder="Puro Address (Village/City)">
                <label style="font-size: 12px; display:block; margin: 8px 0; color: #475569; font-weight: 600;"><input type="checkbox" id="longDist"> 2 Kilometer thi vadare dur chhe? (+ Delivery Charge)</label>
                
                <div style="font-size: 11px; color: #64748b; margin-top: 12px; background: #f8fafc; padding: 12px; border-radius: 12px; border: 1px solid var(--border); line-height: 1.5;">
                    ⚠️ <b>Niyamo:</b><br>
                    - Minimum total order value ₹500 hovi jaruri chhe.<br>
                    - Order cancel ya exchange nahi thase.
                </div>

                <button class="main-btn" onclick="checkoutWhatsApp()" style="background: var(--whatsapp); margin-top: 16px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);">WhatsApp Par Order Moklo 📲</button>
                <button class="main-btn" onclick="closeCart()" style="background: #94a3b8; margin-top: 8px; box-shadow: none;">Bandh Karo</button>
            </div>
        </div>
    </div>

    <script>
        let stores = JSON.parse(localStorage.getItem('stores')) || [];
        let products = JSON.parse(localStorage.getItem('products')) || [];

        let cart = [];
        let activeStoreId = null;

        function renderStores() {
            let container = document.getElementById('storesContainer');
            container.innerHTML = '';

            if(stores.length === 0) {
                container.innerHTML = `<p style="color:#64748b; text-align:center; padding: 30px; font-style: italic;">Haji koi dukan add thai nathi.</p>`;
                return;
            }

            stores.forEach(s => {
                container.innerHTML += `
                    <div class="store-card" onclick="openStore(${s.id}, '${s.name}')">
                        <img src="${s.img}" alt="Store Photo">
                        <div class="store-info">
                            <h3>${s.name}</h3>
                            <p>📱 WhatsApp: ${s.whatsapp || 'Nathi'}</p>
                            <a href="${s.mapLink}" target="_blank" class="map-link" onclick="event.stopPropagation()">Google Map Location Jueo 🗺️</a>
                            <button class="main-btn" style="padding: 10px; font-size: 13px;">Dukan Andar Jao ➡️</button>
                        </div>
                    </div>
                `;
            });
        }

        function openStore(storeId, storeName) {
            activeStoreId = storeId;
            document.getElementById('storeView').style.display = 'none';
            document.getElementById('productView').style.display = 'block';
            document.getElementById('currentStoreTitle').innerText = storeName + " - Products";
            renderProducts();
        }

        function goBackToStores() {
            document.getElementById('productView').style.display = 'none';
            document.getElementById('storeView').style.display = 'block';
            activeStoreId = null;
        }

        function renderProducts() {
            let grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            let storeProducts = products.filter(p => p.storeId === activeStoreId);

            if(storeProducts.length === 0) {
                grid.innerHTML = `<p style="grid-column: span 2; text-align: center; color: #64748b; padding: 30px; font-style: italic;">Aa dukan ma haji koi vastu nathi.</p>`;
                return;
            }

            storeProducts.forEach(p => {
                let cartItem = cart.find(i => i.id === p.id);
                let qty = cartItem ? cartItem.qty : 0;
                let specText = p.spec ? `📏 ${p.spec}` : '';
                
                let unitLower = (p.unit || 'kg').toLowerCase();
                let displayQtyText = "";
                if(unitLower.includes('kg') || unitLower.includes('litre') || unitLower.includes('ltr')) {
                    if(qty < 1 && qty > 0) {
                        displayQtyText = (qty * 1000).toFixed(0) + " gm";
                    } else {
                        displayQtyText = qty + " " + p.unit;
                    }
                } else {
                    displayQtyText = qty + " " + p.unit;
                }

                // Jo category fashion ya shoes hoy to size/color dropdown batavsu
                let isFashion = p.category === 'fashion' || p.category === 'shoes';
                let variantHTML = '';
                if(isFashion) {
                    variantHTML = `
                        <div class="variant-box">
                            <label>Size / Color:</label>
                            <select class="variant-select" id="var_${p.id}">
                                <option value="Standard/Default">Standard</option>
                                <option value="S / Red">S (Red)</option>
                                <option value="M / Blue">M (Blue)</option>
                                <option value="L / Black">L (Black)</option>
                                <option value="XL / White">XL (White)</option>
                                <option value="Size 7">Size 7</option>
                                <option value="Size 8">Size 8</option>
                                <option value="Size 9">Size 9</option>
                            </select>
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.img || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=300'}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        ${p.spec ? `<div class="spec-text">${specText}</div>` : ''}
                        <div class="price">₹${p.price} / ${p.unit}</div>
                        ${variantHTML}
                        
                        <div class="qty-control">
                            <button onclick="changeQty(${p.id}, -1)">-</button>
                            <span>${displayQtyText || '0 ' + p.unit}</span>
                            <button onclick="changeQty(${p.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function changeQty(id, change) {
            let p = products.find(item => item.id === id);
            let existing = cart.find(item => item.id === id);
            
            let unitLower = (p.unit || 'kg').toLowerCase();
            let step = 1;

            if(unitLower.includes('kg') || unitLower.includes('litre') || unitLower.includes('ltr')) {
                step = 0.05; // 50 gram step
            } else {
                step = 1; 
            }

            // Selected variant (Size/Color) get karvu
            let selectedVariant = "Standard";
            let varElem = document.getElementById(`var_${id}`);
            if(varElem) {
                selectedVariant = varElem.value;
            }

            if(existing) {
                existing.qty = parseFloat((existing.qty + (change * step)).toFixed(3));
                existing.variant = selectedVariant; // Update variant if changed
                if(existing.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            } else if(change > 0) {
                cart.push({ ...p, qty: step, variant: selectedVariant });
            }
            updateCartUI();
            renderProducts();
        }

        function updateCartUI() {
            let totalCount = cart.reduce((sum, item) => sum + 1, 0);
            document.getElementById('cartCount').innerText = totalCount;
        }

        function openCart() {
            let list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            let total = 0;

            if(cart.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#64748b; padding: 20px; font-style: italic;">Tamaru cart khali chhe.</p>`;
            }

            cart.forEach((item) => {
                let sub = item.price * item.qty;
                total += sub;

                let unitLower = (item.unit || 'kg').toLowerCase();
                let qtyFormatted = "";
                if((unitLower.includes('kg') || unitLower.includes('litre')) && item.qty < 1) {
                    qtyFormatted = (item.qty * 1000).toFixed(0) + " gm";
                } else {
                    qtyFormatted = item.qty + " " + item.unit;
                }

                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:13px; border-bottom:1px solid var(--border); padding-bottom:8px;">
                        <span><b>${item.name}</b> <span style="color:#2563eb; font-weight:600;">[${item.variant || 'Standard'}]</span><br><span style="color:var(--text-muted);">${qtyFormatted}</span></span>
                        <span style="font-weight:800; color:var(--primary);">₹${sub.toFixed(0)}</span>
                    </div>
                `;
            });

            document.getElementById('cartTotal').innerText = '₹' + total.toFixed(0);
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function checkTime() {
            let hour = new Date().getHours();
            return hour >= 9 && hour < 18;
        }

        function checkoutWhatsApp() {
            if(!checkTime()) {
                alert("Order accept કરવાનો સમય સવારે 9:00 થી સાંજે 6:00 સુધીનો જ છે!");
                return;
            }

            let totalAmt = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            if(totalAmt < 500) {
                alert("Krupaya minimum total order value ₹500 thi vadhu rakho!");
                return;
            }

            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let address = document.getElementById('custAddress').value;
            let isLong = document.getElementById('longDist').checked;

            if(!name || !phone || !address) {
                alert("Krupaya tamaru naam, mobile number ane address lakho.");
                return;
            }

            let currentStore = stores.find(s => s.id === activeStoreId);
            if(!currentStore || !currentStore.whatsapp) {
                alert("Aa dukan no WhatsApp number malto nathi!");
                return;
            }

            let msg = `*New Order*%0ANaam: ${name}%0APhone: ${phone}%0AAddress: ${address}%0A%0A*Items:*%0A`;
            cart.forEach(i => {
                let unitLower = (i.unit || 'kg').toLowerCase();
                let qtyStr = ((unitLower.includes('kg') || unitLower.includes('litre')) && i.qty < 1) ? (i.qty * 1000).toFixed(0) + " gm" : i.qty + " " + i.unit;
                msg += `- ${i.name} (${i.variant || 'Standard'}) - ${qtyStr} = ₹${(i.price * i.qty).toFixed(0)}%0A`;
            });
            if(isLong) msg += `*Delivery:* 2km thi vadare (Extra Charge Lagse)%0A`;
            msg += `*Total Amount:* ₹${totalAmt.toFixed(0)}%0A%0A_Note: Order cancel ya exchange nahi thase._`;

            window.open(`https://wa.me/${currentStore.whatsapp}?text=${msg}`, '_blank');
        }

        renderStores();
    </script>
</body>
</html>
