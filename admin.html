<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh & Fashion — Admin & Seller Panel</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f8f2;margin:0;padding:15px;color:#203326}
main{max-width:600px;margin:auto}
section{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
h2,h3{color:#168343}
input,select,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#168343;color:white;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#555}
.danger{background:#d32f2f !important}
#appPanel{display:none}
.note{font-size:14px;color:#555}
.product-item{border:1px solid #ddd; padding:10px; border-radius:8px; margin:8px 0; background:#fafafa; display:flex; justify-content:space-between; align-items:center;}
.bill-box{background:#e8f5e9; border:1px solid #a5d6a7; padding:12px; border-radius:8px; margin:10px 0; font-weight:bold; color:#1b5e20;}
</style>
</head>
<body>
<main>
<section>
<h2>K.H Fresh & Fashion</h2>
<h3>👑 એડમિન / દુકાનદાર Login & Registration</h3>

<input id="email" type="email" placeholder="Email લખો">
<input id="password" type="password" placeholder="Password (ઓછામાં ઓછા 6 અક્ષર)">

<button id="registerBtn">નવું એકાઉન્ટ બનાવો</button>
<button id="loginBtn" class="secondary">Login કરો</button>
<button id="logoutBtn" class="secondary" style="display:none">Logout</button>
<p id="status" class="note">Login અથવા નવું એકાઉન્ટ બનાવો.</p>
</section>

<div id="appPanel">
<section>
<h3>🏪 મારી દુકાન (Edit / Update)</h3>
<input id="shopName" placeholder="દુકાનનું નામ">
<input id="shopWhatsApp" placeholder="WhatsApp નંબર (દા.ત. 919876543210)">
<button id="saveShopBtn">દુકાન સેવ / અપડેટ કરો</button>
<p id="shopStatus" class="note"></p>
</section>

<!-- Hisab / Subscription Box -->
<section id="billingSection" style="display:none">
<h3>📊 માસિક સબ્સ્ક્રિપ્શન અને હિસાબ</h3>
<div id="billDetails" class="bill-box">હિસાબ ગણાઈ રહ્યો છે...</div>
</section>

<section>
<h3>📦 નવી વસ્તુ ઉમેરો</h3>
<input id="productName" placeholder="વસ્તુનું નામ">
<select id="category">
<option value="શાકભાજી">શાકભાજી (મિનિમમ 1 કિલો નિયમ)</option>
<option value="ફળો">ફળો (મિનિમમ 1 કિલો નિયમ)</option>
<option value="Ice Cream & Cold Drink">Ice Cream & Cold Drink</option>
<option value="Mithai & Namkeen">Mithai & Namkeen</option>
<option value="Women / Ladies">Women / Ladies</option>
<option value="Men / Gents">Men / Gents</option>
<option value="Children">Children</option>
<option value="Baby Boy">Baby Boy</option>
<option value="Baby Girl">Baby Girl</option>
<option value="કરિયાણું">કરિયાણું</option>
<option value="જનરલ સ્ટોર">જનરલ સ્ટોર</option>
<option value="Footwear">Footwear</option>
<option value="Cosmetics">Cosmetics</option>
</select>
<input id="price" type="number" min="0" step="0.01" placeholder="ભાવ ₹">
<input id="unit" placeholder="એકમ: નંગ, કિલો, ગ્રામ વગેરે">

<label style="font-size:14px; font-weight:bold; color:#555; display:block; margin-top:5px;">ફોટો પસંદ કરો (ગેલેરીમાંથી):</label>
<input id="imageFile" type="file" accept="image/*" style="background:#f9f9f9;">

<input id="sizes" placeholder="સાઇઝ (વૈકલ્પિક): S, M, L, XL">
<input id="colors" placeholder="કલર (વૈકલ્પિક): Red, Blue, Black">
<button id="addProductBtn">પ્રોડક્ટ ઉમેરો</button>
<p id="productStatus" class="note"></p>
</section>

<section>
<h3>મારી દુકાનની વસ્તુઓની યાદી (Edit / Delete)</h3>
<div id="myProducts">લોડ થઈ રહ્યું છે...</div>
</section>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, doc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
 apiKey: "AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain: "kh-fresh-sabji-fruits.firebaseapp.com",
 projectId: "kh-fresh-sabji-fruits",
 storageBucket: "kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId: "815611229461",
 appId: "1:815611229461:web:ca713dc978e0997930251c",
 measurementId: "G-HBL4EVF1MN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const $ = id => document.getElementById(id);

let currentUser = null;
let currentShop = null;

function status(id, msg) { $(id).textContent = msg; }
async function runSafely(action) { try { await action(); } catch (e) { alert("Error: " + e.message); } }

$("registerBtn").onclick = () => runSafely(async () => {
 const email = $("email").value.trim();
 const password = $("password").value;
 if (!email || password.length < 6) { alert("Email ભરો અને 6 અક્ષરનો Password આપો."); return; }
 await createUserWithEmailAndPassword(auth, email, password);
 status("status", "એકાઉન્ટ બની ગયું.");
});

$("loginBtn").onclick = () => runSafely(async () => {
 await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
 status("status", "Login સફળ થયું.");
});

$("logoutBtn").onclick = () => runSafely(async () => { await signOut(auth); });

onAuthStateChanged(auth, async user => {
 currentUser = user;
 $("appPanel").style.display = user ? "block" : "none";
 $("logoutBtn").style.display = user ? "block" : "none";
 status("status", user ? "Login: " + user.email : "હજુ Login નથી.");
 currentShop = null;
 if (user) await loadMyShop();
});

async function loadMyShop() {
 const q = query(collection(db, "shops"), where("ownerUid", "==", currentUser.uid));
 const snap = await getDocs(q);
 if (!snap.empty) {
  const s = snap.docs[0];
  currentShop = {id: s.id, ...s.data()};
  $("shopName").value = currentShop.name || "";
  $("shopWhatsApp").value = currentShop.whatsapp || "";
  status("shopStatus", "દુકાનની માહિતી મળી ગઈ.");
  await loadMyProducts();
 } else {
  status("shopStatus", "હજુ દુકાન નથી. નામ અને WhatsApp નંબર નાખીને સેવ કરો.");
  $("myProducts").textContent = "દુકાન બનાવ્યા પછી વસ્તુઓ ઉમેરી શકશો.";
  $("billingSection").style.display = "none";
 }
}

$("saveShopBtn").onclick = () => runSafely(async () => {
 if (!currentUser) throw new Error("પહેલાં Login કરો.");
 const name = $("shopName").value.trim();
 const whatsapp = $("shopWhatsApp").value.trim();
 if (!name || !whatsapp) { alert("દુકાનનું નામ અને WhatsApp નંબર ભરો."); return; }

 if (currentShop) {
  await setDoc(doc(db, "shops", currentShop.id), {
   name, whatsapp, ownerUid: currentUser.uid, updatedAt: serverTimestamp()
  }, {merge:true});
  currentShop.name = name;
  currentShop.whatsapp = whatsapp;
 } else {
  const ref = doc(collection(db, "shops"));
  await setDoc(ref, {
   name, whatsapp, ownerUid: currentUser.uid, createdAt: serverTimestamp()
  });
  currentShop = {id: ref.id, name, whatsapp};
 }
 status("shopStatus", "દુકાન સફળતાપૂર્વક સેવ/અપડેટ થઈ ગઈ!");
 await loadMyProducts();
});

$("addProductBtn").onclick = () => runSafely(async () => {
 if (!currentUser) throw new Error("પહેલાં Login કરો.");
 if (!currentShop) throw new Error("પહેલાં તમારી દુકાન બનાવો.");

 const name = $("productName").value.trim();
 const price = Number($("price").value);
 const unit = $("unit").value.trim();
 const fileInput = $("imageFile");

 if (!name || !unit || $("price").value === "" || price < 0) {
  alert("માહિતી અધૂરી છે.");
  return;
 }

 status("productStatus", "ફોટો અપલોડ થઈ રહ્યો છે, રાહ જુઓ...");

 let imageUrl = "https://via.placeholder.com/120";
 try {
  if (fileInput.files && fileInput.files[0]) {
   const file = fileInput.files[0];
   const storageRef = ref(storage, `products/${Date.now()}_${file.name}`);
   const snapshot = await uploadBytes(storageRef, file);
   imageUrl = await getDownloadURL(snapshot.ref);
  }
 } catch (err) {
  console.log("Image upload failed, proceeding without image:", err);
 }

 await addDoc(collection(db, "products"), {
  name,
  price,
  unit,
  category: $("category").value,
  imageUrl: imageUrl,
  sizes: $("sizes").value.trim(),
  colors: $("colors").value.trim(),
  shopId: currentShop.id,
  ownerUid: currentUser.uid,
  active: true,
  createdAt: serverTimestamp()
 });

 status("productStatus", "પ્રોડક્ટ સફળતાપૂર્વક ઉમેરાઈ ગઈ!");
 $("productName").value = "";
 $("price").value = "";
 $("unit").value = "";
 $("imageFile").value = "";
 $("sizes").value = "";
 $("colors").value = "";
 await loadMyProducts();
});

async function loadMyProducts() {
 if (!currentUser || !currentShop) return;
 const q = query(collection(db, "products"), where("shopId", "==", currentShop.id));
 const snap = await getDocs(q);
 const host = $("myProducts");
 host.replaceChildren();

 let totalProducts = snap.size;
 
 let monthlyCharge = 300;
 if (totalProducts > 30) {
  monthlyCharge += (totalProducts - 30) * 10;
 }

 $("billingSection").style.display = "block";
 $("billDetails").innerHTML = `
  📦 કુલ પ્રોડક્ટ્સ: <b>${totalProducts}</b><br>
  💰 માસિક સબ્સ્ક્રિપ્શન ચાર્જ: <b>₹${monthlyCharge}</b> <span style="font-size:12px; font-weight:normal;">(પ્રથમ 30 ના ₹300 + વધારાની પ્રતિ પ્રોડક્ટ ₹10)</span>
 `;

 if (totalProducts === 0) {
  host.textContent = "હજી કોઈ વસ્તુ ઉમેરાઈ નથી.";
  return;
 }

 snap.forEach(d => {
  const p = d.data();
  const pId = d.id;

  const itemDiv = document.createElement("div");
  itemDiv.className = "product-item";

  const infoSpan = document.createElement("span");
  infoSpan.style.fontSize = "14px";
  infoSpan.innerHTML = `<b>${p.name}</b> — ₹${p.price} / ${p.unit} <br><small style="color:#666;">(${p.category})</small>`;

  const btnDiv = document.createElement("div");
  btnDiv.style.display = "flex";
  btnDiv.style.gap = "5px";

  const editBtn = document.createElement("button");
  editBtn.textContent = "Edit";
  editBtn.style.padding = "6px 10px";
  editBtn.style.fontSize = "13px";
  editBtn.onclick = async () => {
   const newName = prompt("નવું નામ લખો:", p.name);
   if(newName === null) return;
   const newPrice = prompt("નવો ભાવ લખો:", p.price);
   if(newPrice === null) return;

   await setDoc(doc(db, "products", pId), {
    name: newName.trim(),
    price: Number(newPrice)
   }, {merge: true});
   
   alert("પ્રોડક્ટ અપડેટ થઈ ગઈ!");
   loadMyProducts();
  };

  const delBtn = document.createElement("button");
  delBtn.textContent = "Delete";
  delBtn.className = "danger";
  delBtn.style.padding = "6px 10px";
  delBtn.style.fontSize = "13px";
  delBtn.onclick = async () => {
   if(confirm(`શું તમે "${p.name}" ડિલીટ કરવા માંગો છો?`)) {
    await deleteDoc(doc(db, "products", pId));
    alert("પ્રોડક્ટ ડિલીટ થઈ ગઈ!");
    loadMyProducts();
   }
  };

  btnDiv.append(editBtn, delBtn);
  itemDiv.append(infoSpan, btnDiv);
  host.append(itemDiv);
 });
}
</script>
</body>
</html>
