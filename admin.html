<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - K.H Fresh</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 mt-6">
        <div class="flex items-center justify-between border-b pb-4 mb-4">
            <div>
                <h1 class="text-xl font-bold text-emerald-800">⚙️ K.H Fresh એડમિન</h1>
                <p class="text-xs text-gray-500">રોજબરોજના ભાવ અહીંથી બદલો</p>
            </div>
            <span class="text-2xl">🥦🍎</span>
        </div>

        <div id="admin-product-list" class="space-y-3 mb-6 max-h-[60vh] overflow-y-auto pr-1">
            <!-- Products loaded dynamically -->
        </div>

        <button onclick="savePrices()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold shadow transition">
            💾 ભાવ સેવ કરો
        </button>
        
        <p id="save-msg" class="text-center text-xs text-emerald-600 font-semibold mt-3 hidden">✅ ભાવ સફળતાપૂર્વક અપડેટ થઈ ગયા!</p>
    </div>

    <script>
        // Same products database (Keep this synchronized with your main app or backend storage)
        let products = [
            { id: 1, name: "બટેટા (Potato)", price: 40, icon: "🥔" },
            { id: 2, name: "ડુંગળી (Onion)", price: 50, icon: "🧅" },
            { id: 3, name: "ટમેટા (Tomato)", price: 60, icon: "🍅" },
            { id: 4, name: "લીલા મરચાં (Green Chilli)", price: 80, icon: "🌶️" },
            { id: 5, name: "લીંબુ (Lemon)", price: 100, icon: "🍋" },
            { id: 6, name: "કેળા (Banana)", price: 60, icon: "🍌" },
            { id: 7, name: "સફરજન (Apple)", price: 140, icon: "🍎" },
            { id: 8, name: "દાડમ (Pomegranate)", price: 160, icon: "🍑" }
        ];

        function loadAdminProducts() {
            const list = document.getElementById('admin-product-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border">
                        <span class="text-sm font-medium">${p.icon} ${p.name}</span>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs text-gray-500">₹</span>
                            <input type="number" id="price-${p.id}" value="${p.price}" class="w-20 px-2 py-1.5 border rounded-lg text-sm font-bold text-emerald-700 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <span class="text-xs text-gray-500">/કિલો</span>
                        </div>
                    </div>
                `;
            });
        }

        function savePrices() {
            products.forEach(p => {
                let input = document.getElementById(`price-${p.id}`);
                if (input && input.value > 0) {
                    p.price = Number(input.value);
                }
            });
            const msg = document.getElementById('save-msg');
            msg.classList.remove('hidden');
            setTimeout(() => {
                msg.classList.add('hidden');
            }, 2500);
        }

        loadAdminProducts();
    </script>
</body>
</html>
