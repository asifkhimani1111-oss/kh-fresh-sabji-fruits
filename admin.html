<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.H Fresh Admin Panel - Free URL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f2;font-family:Arial,sans-serif;color:#233}
header{background:#087b43;color:white;padding:18px;text-align:center}
main{max-width:700px;margin:auto;padding:12px}
section{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 5px #0001}
h3{color:#087b43}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{background:#087b43;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.red{background:#c62828}
.blue{background:#1976d2}
.card{border:1px solid #ddd;padding:12px;border-radius:9px;margin:9px 0}
.note{font-size:13px;color:#666}
.green{background:#e8f5e9;padding:10px;border-radius:8px}
img.productImage, img.shopImage{width:100px;height:100px;object-fit:cover;border-radius:8px;margin-top:5px}
.message{padding:11px;border-radius:8px;margin:8px 0;display:none;overflow-wrap:anywhere}
.ok{display:block;background:#e8f5e9;color:#087b43}
.err{display:block;background:#ffebee;color:#b71c1c}
</style>
</head>
<body>
<header>
<h2>K.H Fresh – Admin Panel</h2>
<p>ફ્રી URL (લિંક) આધારિત ફોટો સિસ્ટમ</p>
</header>

<main>

<section>
<h3>🔐 Admin Login</h3>
<input id="adminEmail" type="email" placeholder="Admin Email">
<input id="adminPassword" type="password" placeholder="Password">
<button id="loginBtn">Admin Login</button>
<button id="logoutBtn" class="red" style="display:none">Logout</button>
<p id="loginMsg" class="note"></p>
</section>

<div id="adminArea" style="display:none">

<section>
<h3>🏪 નવી દુકાન ઉમેરો (ફોટો લિંક સાથે)</h3>
<input id="shopName" placeholder="દુકાનનું નામ (દા.ત. ગણેશ નમકીન)">
<input id="shopWhatsApp" placeholder="WhatsApp નંબર (91 સાથે)">
<input id="shopImageUrl" placeholder="દુકાનના ફોટાની લિંક (Image URL પેસ્ટ કરો)">
<button id="saveShop">દુકાન ઉમેરો</button>
<p id="shopMsg" class="note"></p>
</section>

<section>
<h3>દુકાન પસંદ કરો</h3>
<select id="shopSelect"></select>
<div id="shopInfo"></div>
</section>

<section>
<h3>➕ નવી પ્રોડક્ટ ઉમેરો (ફોટો લિંક સાથે)</h3>
<input id="productName" placeholder="પ્રોડક્ટનું નામ">
<input id="price" type="number" min="0" step="0.01" placeholder="ભાવ ₹">

<select id="unit">
<option>કિલો (Kg)</option>
<option>ગ્રામ (Gram)</option>
<option>નંગ (Pcs)</option>
<option>ડઝન (Dozen)</option>
<option>લિટર</option>
<option>મિલીલીટર</option>
<option>પેકેટ</option>
<option>બોક્સ</option>
<option>જોડી</option>
<option>મીટર</option>
<option>સેટ</option>
<option>બીજું</option>
</select>

<input id="category" list="categoryList" placeholder="કેટેગરી">
<datalist id="categoryList">
<option value="શાકભાજી">
<option value="ફળો">
<option value="નમકીન / ફાસ્ફુડ">
<option value="કપડાં - લેડીઝ">
<option value="કપડાં - જેન્ટ્સ">
<option value="ફૂટવેਰ">
<option value="મોબાઇલ">
<option value="ઇલેક્ટ્રોનિક્સ">
<option value="કરિયાણું">
<option value="કટલરી">
<option value="અન્ય">
</datalist>

<input id="sizes" placeholder="સાઇઝ">
<input id="colors" placeholder="કલર">
<input id="design" placeholder="ડિઝાઇન / મોડેલ">
<input id="imageUrl" placeholder="પ્રોડક્ટ ફોટાની લિંક (Image URL અહીં પેસ્ટ કરો)">

<div id="productMsg" class="message"></div>
<button id="addProduct">પ્રોડક્ટ ઉમેરો</button>
</section>

<section>
<h3>📦 દુકાનની પ્રોડક્ટ અને હિસાબ</h3>
<div id="products"></div>
</section>

<section>
<h3>💰 માસિક પ્લાન અને રોકડ પેમેન્ટ</h3>
<div id="billing" class="green">દુકાન પસંદ કરો.</div>
<br>
<label>
<input id="cashReceived" type="checkbox" style="width:auto">
રોકડ પેમેન્ટ મળી ગયું છે.
</label>
<button id="activatePlan" class="blue">OK – પ્લાન 30 દિવસ માટે ON કરો</button>
<button id="deactivatePlan" class="red">દુકાન OFF કરો</button>
<p id="planMsg" class="note"></p>
</section>

</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getFirestore,collection,addDoc,getDocs,query,where,
 doc,updateDoc,deleteDoc,serverTimestamp,Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",
 projectId:"kh-fresh-sabji-fruits",
 storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId:"815611229461",
 appId:"1:815611229461:web:ca713dc978e0997930251c",
 measurementId:"G-HBL4EVF1MN"
};

const ADMIN_UID="bzMpXfz6ltVVB7GcWHWh0ok7XbO2";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const $=id=>document.getElementById(id);

let shops=[];
let selectedShop=null;

function msg(id,text,type="ok"){
 const el=$(id);
 el.textContent=text;
 el.className="message "+type;
}

function requireAdmin(){
 if(!auth.currentUser||auth.currentUser.uid!==ADMIN_UID){
  throw new Error("આ સુવિધા ફક્ત Admin માટે છે.");
 }
}

onAuthStateChanged(auth,user=>{
 const allowed=!!user&&user.uid===ADMIN_UID;
 $("adminArea").style.display=allowed?"block":"none";
 $("loginBtn").style.display=allowed?"none":"block";
 $("logoutBtn").style.display=allowed?"block":"none";

 if(user&&!allowed){
  $("loginMsg").textContent="આ એકાઉન્ટ Admin નથી.";
  signOut(auth);
  return;
 }

 if(allowed){
  $("loginMsg").textContent="Admin Login સફળ થયું.";
  loadShops();
 }
});

$("loginBtn").onclick=async()=>{
 try{
  const email=$("adminEmail").value.trim();
  const password=$("adminPassword").value;
  if(!email||!password)throw new Error("Email અને Password ભરો.");
  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){
  $("loginMsg").textContent="Login Error: "+e.message;
 }
};

$("logoutBtn").onclick=async()=>{
 await signOut(auth);
};

async function loadShops(){
 try{
  requireAdmin();
  const snap=await getDocs(collection(db,"shops"));
  shops=snap.docs.map(d=>({id:d.id,...d.data()}));

  $("shopSelect").innerHTML="";
  shops.forEach(s=>{
   const op=document.createElement("option");
   op.value=s.id;
   op.textContent=(s.name||"દુકાન")+" ("+(s.planActive?"ON":"OFF")+")";
   $("shopSelect").append(op);
  });

  if(!shops.length){
   selectedShop=null;
   $("shopInfo").textContent="હજી દુકાન નથી.";
   $("products").textContent="";
   $("billing").textContent="દુકાન ઉમેરો.";
   return;
  }

  const oldId=selectedShop?.id;
  $("shopSelect").value=shops.some(s=>s.id===oldId)?oldId:shops[0].id;
  await selectShop();

 }catch(e){
  console.error(e);
  $("shopMsg").textContent=e.message;
 }
}

$("shopSelect").onchange=selectShop;

async function selectShop(){
 requireAdmin();
 const id=$("shopSelect").value;
 selectedShop=shops.find(s=>s.id===id)||null;
 if(selectedShop)await loadProducts();
}

$("saveShop").onclick=async()=>{
 try{
  requireAdmin();
  const name=$("shopName").value.trim();
  const whatsapp=$("shopWhatsApp").value.trim().replace(/\D/g,"");
  const shopImageUrl=$("shopImageUrl").value.trim();

  if(!name||!whatsapp)throw new Error("દુકાનનું નામ અને WhatsApp નંબર ભરો.");

  await addDoc(collection(db,"shops"),{
   name,whatsapp,
   shopImageUrl,
   planActive:false,
   registrationFeePaid:false,
   createdAt:serverTimestamp(),
   updatedAt:serverTimestamp()
  });

  $("shopName").value="";
  $("shopWhatsApp").value="";
  $("shopImageUrl").value="";
  $("shopMsg").textContent="દુકાન સફળતાપૂર્વક ઉમેરાઈ ગઈ!";
  await loadShops();

 }catch(e){
  $("shopMsg").textContent="Error: "+e.message;
 }
};

$("addProduct").onclick=async()=>{
 try{
  requireAdmin();
  if(!selectedShop)throw new Error("પહેલાં દુકાન પસંદ કરો.");

  const name=$("productName").value.trim();
  const price=Number($("price").value);
  const category=$("category").value.trim();
  const unit=$("unit").value;
  const imageUrl=$("imageUrl").value.trim();

  if(!name||!category||$("price").value===""||!Number.isFinite(price)||price<0)
   throw new Error("પ્રોડક્ટનું નામ, કેટેગરી અને યોગ્ય ભાવ ભરો.");

  await addDoc(collection(db,"products"),{
   name,price,unit,category,
   imageUrl,
   sizes:$("sizes").value.trim(),
   colors:$("colors").value.trim(),
   design:$("design").value.trim(),
   shopId:selectedShop.id,
   active:true,
   createdAt:serverTimestamp()
  });

  $("productName").value="";
  $("price").value="";
  $("category").value="";
  $("sizes").value="";
  $("colors").value="";
  $("design").value="";
  $("imageUrl").value="";

  msg("productMsg","✅ પ્રોડક્ટ સફળતાપૂર્વક ઉમેરાઈ ગઈ!");
  await loadProducts();

 }catch(e){
  msg("productMsg","ભૂલ: "+e.message,"err");
 }
};

async function loadProducts(){
 if(!selectedShop)return;
 requireAdmin();

 try{
  const snap=await getDocs(query(
   collection(db,"products"),
   where("shopId","==",selectedShop.id)
  ));

  const count=snap.size;
  const end=selectedShop.planEndAt?.toDate?
   selectedShop.planEndAt.toDate():null;

  let isActive=!!selectedShop.planActive;

  if(isActive&&end&&end<=new Date()){
   isActive=false;
   await updateDoc(doc(db,"shops",selectedShop.id),{
    planActive:false
   });
   selectedShop.planActive=false;
  }

  const amount=count*2;

  let infoHtml="<p><b>"+safe(selectedShop.name)+"</b></p><p>WhatsApp: "+safe(selectedShop.whatsapp)+"</p>";
  if(selectedShop.shopImageUrl){
   infoHtml+=`<br><img src="${safe(selectedShop.shopImageUrl)}" class="shopImage" alt="Shop Photo">`;
  }
  $("shopInfo").innerHTML=infoHtml;

  $("billing").innerHTML=
   "કુલ પ્રોડક્ટ: <b>"+count+"</b><br>"+
   "માસિક ચાર્જ: ₹"+amount+" ("+count+" × ₹2)<br>"+
   "દુકાનની સ્થિતિ: <b>"+(isActive?"🟢 ON":"🔴 OFF")+"</b>"+
   (end?"<br>પ્લાનની છેલ્લી તારીખ: "+end.toLocaleDateString("en-IN"):"<br>હજુ પ્લાન શરૂ થયો નથી.");

  $("cashReceived").checked=false;
  $("products").replaceChildren();

  snap.forEach(d=>{
   const p=d.data();
   const div=document.createElement("div");
   div.className="card";

   const title=document.createElement("b");
   title.textContent=(p.name||"પ્રોડક્ટ")+" — ₹"+p.price+" / "+(p.unit||"");

   const detail=document.createElement("p");
   detail.textContent=
    (p.category||"")+" | સાઇઝ: "+(p.sizes||"લાગુ નથી")+
    " | કલર: "+(p.colors||"લાગુ નથી")+
    " | ડિઝાઇન: "+(p.design||"લાગુ નથી");

   div.append(title,detail);

   if(p.imageUrl){
    const img=document.createElement("img");
    img.src=p.imageUrl;
    img.alt=p.name||"Product";
    img.className="productImage";
    div.append(img);
   }

   const del=document.createElement("button");
   del.textContent="પ્રોડક્ટ ડિલીટ";
   del.className="red";

   del.onclick=async()=>{
    try{
     requireAdmin();
     if(confirm((p.name||"પ્રોડક્ટ")+" ડિલીટ કરવી છે?")){
      await deleteDoc(doc(db,"products",d.id));
      await loadProducts();
     }
    }catch(e){alert(e.message);}
   };

   div.append(del);
   $("products").append(div);
  });

 }catch(e){
  console.error(e);
  $("products").textContent="પ્રોડક્ટ લોડ થઈ શકી નથી: "+e.message;
 }
}

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

$("activatePlan").onclick=async()=>{
 try{
  requireAdmin();
  if(!selectedShop)throw new Error("દુકાન પસંદ કરો.");

  const snap=await getDocs(query(
   collection(db,"products"),
   where("shopId","==",selectedShop.id)
  ));

  const count=snap.size;
  if(count<1)throw new Error("પ્લાન ચાલુ કરવા માટે ઓછામાં ઓછી ૧ પ્રોડક્ટ હોવી જોઈએ.");

  if(!$("cashReceived").checked)
   throw new Error("રોકડ પેમેન્ટ મળ્યાની ખાતરી કરો.");

  const start=new Date();
  const end=new Date(start.getTime()+30*24*60*60*1000);

  await updateDoc(doc(db,"shops",selectedShop.id),{
   planActive:true,
   registrationFeePaid:true,
   planStartAt:Timestamp.fromDate(start),
   planEndAt:Timestamp.fromDate(end),
   monthlyAmount:count*2,
   updatedAt:serverTimestamp()
  });

  $("planMsg").textContent="દુકાન 30 દિવસ માટે સફળતાપૂર્વક ON થઈ ગઈ!";
  await loadShops();

 }catch(e){
  $("planMsg").textContent="Error: "+e.message;
 }
};

$("deactivatePlan").onclick=async()=>{
 try{
  requireAdmin();
  if(!selectedShop)throw new Error("દુકાન પસંદ કરો.");

  await updateDoc(doc(db,"shops",selectedShop.id),{
   planActive:false,
   updatedAt:serverTimestamp()
  });

  $("planMsg").textContent="દુકાન બંધ કરી દેવામાં આવી છે.";
  await loadShops();

 }catch(e){
  $("planMsg").textContent="Error: "+e.message;
 }
};
</script>
</body>
</html>
