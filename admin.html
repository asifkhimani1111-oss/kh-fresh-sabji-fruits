
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh & Fashion - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#166534;color:white;padding:18px;text-align:center}
main{max-width:850px;margin:auto;padding:14px}
.card{background:white;padding:16px;margin:14px 0;border-radius:13px;box-shadow:0 2px 9px #0001}
h2{font-size:19px;margin:5px 0 14px}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{background:#15803d;color:white;border:0;font-weight:bold;cursor:pointer}
button.red{background:#dc2626}
button.blue{background:#2563eb}
button.gray{background:#475569}
.item{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0}
.item img{width:85px;height:85px;object-fit:cover;border-radius:8px}
.itemrow{display:flex;gap:12px;align-items:center}
.smallbtn{display:flex;gap:8px}
.smallbtn button{font-size:14px;padding:9px}
.hidden{display:none}
.muted{color:#64748b;font-size:13px}
#message{padding:10px;color:#166534;font-weight:bold}
</style>
</head>
<body>

<header>
<h2>K.H Fresh & Fashion</h2>
<div>Admin Panel</div>
</header>

<main>

<div id="loginBox" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login કરો</button>
<p class="muted">ફક્ત Admin જ અહીં Login કરી શકશે.</p>
</div>

<div id="adminPanel" class="hidden">

<div class="card">
<b id="adminEmail"></b>
<button id="logoutBtn" class="red">Logout</button>
<div id="message"></div>
</div>

<div class="card">
<h2>નવી દુકાન ઉમેરો</h2>
<input id="shopName" placeholder="દુકાનનું નામ">
<input id="shopArea" placeholder="વિસ્તાર / ગામ">
<input id="shopWhatsapp" placeholder="WhatsApp નંબર (91 સાથે)">
<label>દુકાનનો ફોટો પસંદ કરો</label>
<input id="shopPhoto" type="file" accept="image/*">
<p class="muted">મોટો ફોટો આપમેળે નાનો થશે.</p>
<button id="addShopBtn">દુકાન ઉમેરો</button>
</div>

<div class="card">
<h2>દુકાનોની યાદી</h2>
<div id="shopsList">લોડ થઈ રહ્યું છે...</div>
</div>

<div class="card">
<h2>નવી પ્રોડક્ટ ઉમેરો</h2>
<select id="productShop">
<option value="">દુકાન પસંદ કરો</option>
</select>
<input id="productName" placeholder="પ્રોડક્ટનું નામ">
<input id="productPrice" type="number" min="0" placeholder="ભાવ ₹">
<input id="productUnit" placeholder="માપ (કિલો, ગ્રામ, નંગ, લિટર, સાઇઝ...)">
<label>પ્રોડક્ટનો ફોટો પસંદ કરો</label>
<input id="productPhoto" type="file" accept="image/*">
<button id="addProductBtn">પ્રોડક્ટ ઉમેરો</button>
</div>

<div class="card">
<h2>પ્રોડક્ટ્સની યાદી</h2>
<div id="productsList">લોડ થઈ રહ્યું છે...</div>
</div>

</div>
</main>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
 getAuth, signInWithEmailAndPassword,
 onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 getFirestore, collection, addDoc, deleteDoc,
 doc, updateDoc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyB_9gcc4UHtrIHeASd8txglLZ4kkc_clQU",
 authDomain: "kh-fresh-fashion.firebaseapp.com",
 projectId: "kh-fresh-fashion",
 storageBucket: "kh-fresh-fashion.firebasestorage.app",
 messagingSenderId: "1013749791487",
 appId: "1:1013749791487:web:3b1af0eb4f7497a30feaca"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "asifkhimani1111@gmail.com";

const $ = id => document.getElementById(id);

function msg(text){
 $("message").textContent = text;
}

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g, c => ({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#039;"
 }[c]));
}

// ફોટો આપમેળે Compress કરવાની વ્યવસ્થા
async function compressImage(file){
 if(!file) return "";

 if(!file.type.startsWith("image/")){
  throw new Error("યોગ્ય ફોટો પસંદ કરો.");
 }

 if(file.size > 25 * 1024 * 1024){
  throw new Error("ફોટો 25MB થી મોટો છે. બીજો ફોટો પસંદ કરો.");
 }

 return new Promise((resolve,reject)=>{
  const reader = new FileReader();

  reader.onerror = () => reject(new Error("ફોટો વાંચી શકાયો નથી."));

  reader.onload = () => {
   const img = new Image();

   img.onerror = () => reject(new Error("ફોટો ખોલી શકાયો નથી."));

   img.onload = () => {
    try{
     const canvas = document.createElement("canvas");
     const ctx = canvas.getContext("2d");

     let maxDimension = 1000;
     let result = "";

     while(maxDimension >= 350){
      const scale = Math.min(
       1,
       maxDimension / Math.max(img.width,img.height)
      );

      canvas.width = Math.max(1,Math.round(img.width*scale));
      canvas.height = Math.max(1,Math.round(img.height*scale));

      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);

      for(let quality=0.75; quality>=0.35; quality-=0.10){
       result = canvas.toDataURL("image/jpeg",quality);

       // Firestore માં સુરક્ષિત જગ્યા રહે તે માટે
       if(result.length <= 650000){
        resolve(result);
        return;
       }
      }

      maxDimension = Math.round(maxDimension*0.75);
     }

     reject(new Error("આ ફોટો વધુ મોટો છે. બીજો ફોટો પસંદ કરો."));
    }catch(e){
     reject(new Error("ફોટો Compress થઈ શક્યો નથી."));
    }
   };

   img.src = reader.result;
  };

  reader.readAsDataURL(file);
 });
}

// Login
$("loginBtn").onclick = async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );
 }catch(e){
  alert("Login ન થયું: " + e.message);
 }
};

$("logoutBtn").onclick = ()=>signOut(auth);

onAuthStateChanged(auth,user=>{
 if(user && user.email === ADMIN_EMAIL){
  $("loginBox").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
  $("adminEmail").textContent = "Admin: " + user.email;
  startData();
 }else{
  $("adminPanel").classList.add("hidden");
  $("loginBox").classList.remove("hidden");

  if(user) signOut(auth);
 }
});

let shops = [];
let products = [];
let listenersStarted = false;

function startData(){
 if(listenersStarted) return;
 listenersStarted = true;

 onSnapshot(collection(db,"shops"),snapshot=>{
  shops = snapshot.docs.map(d=>({id:d.id,...d.data()}));
  showShops();
  fillShopSelect();
 },error=>{
  msg("દુકાનો લોડ કરવામાં ભૂલ: "+error.message);
 });

 onSnapshot(collection(db,"products"),snapshot=>{
  products = snapshot.docs.map(d=>({id:d.id,...d.data()}));
  showProducts();
 },error=>{
  msg("પ્રોડક્ટ લોડ કરવામાં ભૂલ: "+error.message);
 });
}

// દુકાન ઉમેરો
$("addShopBtn").onclick = async()=>{
 try{
  const name = $("shopName").value.trim();
  const area = $("shopArea").value.trim();
  const whatsapp = $("shopWhatsapp").value.trim();
  const file = $("shopPhoto").files[0];

  if(!name || !area || !whatsapp){
   alert("દુકાનનું નામ, વિસ્તાર અને WhatsApp નંબર લખો.");
   return;
  }

  msg("ફોટો તૈયાર થઈ રહ્યો છે...");

  const photo = await compressImage(file);

  await addDoc(collection(db,"shops"),{
   name, area, whatsapp,
   shopImageBase64: photo,
   active:true,
   createdAt:serverTimestamp()
  });

  $("shopName").value="";
  $("shopArea").value="";
  $("shopWhatsapp").value="";
  $("shopPhoto").value="";
  msg("દુકાન સફળતાપૂર્વક ઉમેરાઈ!");
 }catch(e){
  msg("ભૂલ: "+e.message);
 }
};

// દુકાનો બતાવો
function showShops(){
 $("shopsList").innerHTML = "";

 if(!shops.length){
  $("shopsList").textContent="હજુ કોઈ દુકાન નથી.";
  return;
 }

 shops.forEach(shop=>{
  const div=document.createElement("div");
  div.className="item";

  div.innerHTML=`
   <div class="itemrow">
    ${shop.shopImageBase64
     ? `<img src="${shop.shopImageBase64}">`
     : ""}
    <div>
     <b>${safe(shop.name)}</b><br>
     વિસ્તાર: ${safe(shop.area)}<br>
     WhatsApp: ${safe(shop.whatsapp)}
    </div>
   </div>
   <div class="smallbtn">
    <button class="blue edit">Edit</button>
    <button class="red delete">Delete</button>
   </div>
  `;

  div.querySelector(".edit").onclick=()=>editShop(shop);
  div.querySelector(".delete").onclick=()=>removeShop(shop);

  $("shopsList").appendChild(div);
 });
}

function fillShopSelect(){
 const select=$("productShop");
 select.innerHTML='<option value="">દુકાન પસંદ કરો</option>';

 shops.forEach(shop=>{
  if(shop.active !== false){
   const option=document.createElement("option");
   option.value=shop.id;
   option.textContent=shop.name;
   select.appendChild(option);
  }
 });
}

async function editShop(shop){
 const name=prompt("દુકાનનું નવું નામ:",shop.name || "");
 if(name===null) return;

 const area=prompt("નવો વિસ્તાર:",shop.area || "");
 if(area===null) return;

 const whatsapp=prompt("નવો WhatsApp નંબર:",shop.whatsapp || "");
 if(whatsapp===null) return;

 try{
  await updateDoc(doc(db,"shops",shop.id),{
   name:name.trim(),
   area:area.trim(),
   whatsapp:whatsapp.trim()
  });
  msg("દુકાન અપડેટ થઈ!");
 }catch(e){
  msg("ભૂલ: "+e.message);
 }
}

async function removeShop(shop){
 if(!confirm(shop.name+" દુકાન Delete કરવી છે?")) return;

 try{
  await deleteDoc(doc(db,"shops",shop.id));
  msg("દુકાન Delete થઈ.");
 }catch(e){
  msg("ભૂલ: "+e.message);
 }
}

// પ્રોડક્ટ ઉમેરો
$("addProductBtn").onclick=async()=>{
 try{
  const shopId=$("productShop").value;
  const shop=shops.find(s=>s.id===shopId);
  const name=$("productName").value.trim();
  const price=Number($("productPrice").value);
  const unit=$("productUnit").value.trim();
  const file=$("productPhoto").files[0];

  if(!shop){
   alert("પહેલાં દુકાન પસંદ કરો.");
   return;
  }

  if(!name || !unit || $("productPrice").value==="" ||
     !Number.isFinite(price) || price<0){
   alert("પ્રોડક્ટનું નામ, સાચો ભાવ અને માપ લખો.");
   return;
  }

  msg("ફોટો તૈયાર થઈ રહ્યો છે...");

  const photo=await compressImage(file);

  await addDoc(collection(db,"products"),{
   shopId,
   shopName:shop.name,
   name,
   price,
   unit,
   imageBase64:photo,
   active:true,
   createdAt:serverTimestamp()
  });

  $("productName").value="";
  $("productPrice").value="";
  $("productUnit").value="";
  $("productPhoto").value="";
  msg("પ્રોડક્ટ ઉમેરાઈ ગઈ!");
 }catch(e){
  msg("ભૂલ: "+e.message);
 }
};

// પ્રોડક્ટ બતાવો
function showProducts(){
 $("productsList").innerHTML="";

 if(!products.length){
  $("productsList").textContent="હજુ કોઈ પ્રોડક્ટ નથી.";
  return;
 }

 products.forEach(product=>{
  const div=document.createElement("div");
  div.className="item";

  div.innerHTML=`
   <div class="itemrow">
    ${product.imageBase64
     ? `<img src="${product.imageBase64}">`
     : ""}
    <div>
     <b>${safe(product.name)}</b><br>
     દુકાન: ${safe(product.shopName)}<br>
     ભાવ: ₹${safe(product.price)} / ${safe(product.unit)}
    </div>
   </div>
   <div class="smallbtn">
    <button class="blue edit">Edit</button>
    <button class="red delete">Delete</button>
   </div>
  `;

  div.querySelector(".edit").onclick=()=>editProduct(product);
  div.querySelector(".delete").onclick=()=>removeProduct(product);

  $("productsList").appendChild(div);
 });
}

async function editProduct(product){
 const name=prompt("પ્રોડક્ટનું નવું નામ:",product.name || "");
 if(name===null) return;

 const price=prompt("નવો ભાવ:",product.price);
 if(price===null) return;

 const unit=prompt("નવું માપ:",product.unit || "");
 if(unit===null) return;

 if(!name.trim() || !unit.trim() || price.trim()==="" ||
    !Number.isFinite(Number(price)) || Number(price)<0){
  alert("યોગ્ય નામ, ભાવ અને માપ નાખો.");
  return;
 }

 try{
  await updateDoc(doc(db,"products",product.id),{
   name:name.trim(),
   price:Number(price),
   unit:unit.trim()
  });
  msg("પ્રોડક્ટ અપડેટ થઈ!");
 }catch(e){
  msg("ભૂલ: "+e.message);
 }
}

async function removeProduct(product){
 if(!confirm(product.name+" Delete કરવી છે?")) return;

 try{
  await deleteDoc(doc(db,"products",product.id));
  msg("પ્રોડક્ટ Delete થઈ ગઈ.");
 }catch(e){
  msg("ભૂલ: "+e.message);
 }
}
</script>
</body>
</html>
