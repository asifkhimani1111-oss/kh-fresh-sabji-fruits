<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin Panel - Gujarat Bazaar</title>
    <style>
        :root { 
            --primary: #ff3366; 
            --primary-gradient: linear-gradient(135deg, #ff3366 0%, #ff6b6b 100%);
            --bg: #f4f7f6; 
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text-main); padding: 20px; max-width: 650px; margin: auto; padding-bottom: 50px; }
        
        /* Modern Header */
        header { 
            background: var(--primary-gradient); 
            color: white; 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            text-align: center; 
            box-shadow: 0 8px 20px rgba(255, 51, 102, 0.25);
        }
        header h2 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }

        /* Admin Panels / Cards */
        .admin-panel { 
            background: var(--card-bg); 
            border: 1px solid #edf2f7; 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        .admin-panel h3 { font-size: 18px; margin-bottom: 12px; color: #1a202c; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; }

        label { font-size: 13px; font-weight: 600; color: #4a5568; display: block; margin-top: 10px; }
        input, select { 
            width: 100%; 
            padding: 11px 14px; 
            margin: 6px 0 12px 0; 
            border: 1px solid #cbd5e0; 
            border-radius: 10px; 
            font-size: 14px; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fcfdfe;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255, 51, 102, 0.1); }

        /* Modern Action Buttons */
        button { 
            background: var(--primary-gradient); 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 700; 
            font-size: 14px; 
            box-shadow: 0 4px 12px rgba(255, 51, 102, 0.25);
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
        }
        button:active { opacity: 0.9; transform: scale(0.99); }

        /* Items List Box */
        .item-box { 
            background: white; 
            padding: 14px; 
            border-radius: 12px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
        }
        .del-btn { 
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%); 
            width: auto; 
            padding: 7px 14px; 
            font-size: 12px; 
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(229, 62, 62, 0.3);
            margin: 0; 
        }
        h3.section-title { font-size: 17px; margin: 20px 0 10px 0; color: #2d3748; }
    </style>
</head>
<body>

    <header>
        <h2>⚙️ Admin Control Panel</h2>
    </header>

    <div class="admin-panel">
        <h3>🏪 1. Navi Dukan (Store) Add Karo</h3>
        <label>Dukan Nu Naam:</label>
        <input type="text" id="storeName" placeholder="e.g., Gujarat Super Market">
        
        <label>Dukan na Photo ni Link (URL):</label>
        <input type="text" id="storeImg" placeholder="https://...">
        
        <label>Google Maps Location Link:</label>
        <input type="text" id="storeMap" placeholder="https://maps.app.goo.gl/...">
        
        <button onclick="addStore()">Dukan Add Karo</button>
    </div>

    <div class="admin-panel">
        <h3>📦 2. Product Add Karo (Size, Weight, Color Sathe)</h3>
        <label>Kyi Dukan Ma Product Nakvi Chhe?</label>
        <select id="productStoreSelect"></select>

        <label>Product Nu Naam:</label>
        <input type="text" id="pName" placeholder="e.g., Cotton Kurti / Fresh Keri / Mobile">
        
        <label>Category Select Karo:</label>
        <select id="pCat">
            <option value="fruit">🍎 Fruit & Sabji (Min 2kg, 250gm step)</option>
            <option value="fashion">👕 Fashion & Clothing (Saree, Kurti, Shirt)</option>
            <option value="electronics">📱 Electronics & Appliances</option>
            <option value="home">🏠 Home, Kitchen & Decor</option>
            <option value="beauty">✨ Beauty & Personal Care</option>
            <option value="other">📦 Other General Items</option>
        </select>
        
        <label>Size / Vajan / Tol / Color / Number (Details):</label>
        <input type="text" id="pSizeSpec" placeholder="e.g., Size: M/L/XL, Color: Red, 1kg, 500ml">

        <label>Bhav (₹):</label>
        <input type="number" id="pPrice" placeholder="Price">
        
        <label>Unit (kg / pcs / dozen / pair / set):</label>
        <input type="text" id="pUnit" placeholder="kg / pcs / pair">
        
        <label>Photo ni Link (URL):</label>
        <input type="text" id="pImg" placeholder="https://...">
        
        <button onclick="addProduct()">Product Add Karo</button>
    </div>

    <h3 class="section-title">📋 Manage Existing Stores & Products</h3>
    <div id="adminStoresList"></div>
    <div id="adminProductList"></div>

    <script>
        let stores = JSON.parse(localStorage.getItem('stores')) || [
            { id: 1, name: "K.H Fresh Sabji & Fruit Store", img: "https://images.unsplash.com/photo-1542838132-92c53300491e?w=500", mapLink: "https://maps.app.goo.gl/example" }
        ];

        let products = JSON.parse(localStorage.getItem('products')) || [
            { id: 1, storeId: 1, name: "Kela (Banana)", category: "fruit", spec: "1 Dozen = 1kg", price: 60, unit: "kg", img: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=300" }
        ];

        function updateStoreDropdown() {
            let select = document.getElementById('productStoreSelect');
            select.innerHTML = '';
            stores.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });
        }

        function addStore() {
            let name = document.getElementById('storeName').value;
            let img = document.getElementById('storeImg').value;
            let mapLink = document.getElementById('storeMap').value;

            if(!name) {
                alert("Krupaya dukan nu naam lakho.");
                return;
            }

            let newId = stores.length > 0 ? stores[stores.length - 1].id + 1 : 1;
            stores.push({
                id: newId,
                name,
                img: img || "https://images.unsplash.com/photo-1542838132-92c53300491e?w=500",
                mapLink: mapLink || "https://maps.app.goo.gl/example"
            });

            localStorage.setItem('stores', JSON.stringify(stores));
            alert("Navi Dukan Safaltapurvak Add Thai Gai!");
            document.getElementById('storeName').value = '';
            document.getElementById('storeImg').value = '';
            document.getElementById('storeMap').value = '';
            updateStoreDropdown();
            renderAdminLists();
        }

        function addProduct() {
            let storeId = parseInt(document.getElementById('productStoreSelect').value);
            let name = document.getElementById('pName').value;
            let cat = document.getElementById('pCat').value;
            let spec = document.getElementById('pSizeSpec').value;
            let price = parseFloat(document.getElementById('pPrice').value);
            let unit = document.getElementById('pUnit').value;
            let img = document.getElementById('pImg').value;

            if(!name || !price || !unit) {
                alert("Krupaya badhi mahiti bharo.");
                return;
            }

            let newId = products.length > 0 ? products[products.length - 1].id + 1 : 1;
            products.push({ 
                id: newId, 
                storeId, 
                name, 
                category: cat, 
                spec: spec || "Standard", 
                price, 
                unit, 
                img: img || "https://images.unsplash.com/photo-1542838132-92c53300491e?w=300" 
            });
            
            localStorage.setItem('products', JSON.stringify(products));
            alert("Product Safaltapurvak Add Thai Gai!");
            
            document.getElementById('pName').value = '';
            document.getElementById('pSizeSpec').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pUnit').value = '';
            document.getElementById('pImg').value = '';
            renderAdminLists();
        }

        function deleteStore(id) {
            if(confirm("Aa dukan ane teani badhi product delete thai jase. Kharekhar delete karvu chhe?")) {
                stores = stores.filter(s => s.id !== id);
                products = products.filter(p => p.storeId !== id);
                localStorage.setItem('stores', JSON.stringify(stores));
                localStorage.setItem('products', JSON.stringify(products));
                updateStoreDropdown();
                renderAdminLists();
            }
        }

        function deleteProduct(id) {
            if(confirm("Tame aa product delete karva mango cho?")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('products', JSON.stringify(products));
                renderAdminLists();
            }
        }

        function renderAdminLists() {
            let sList = document.getElementById('adminStoresList');
            let pList = document.getElementById('adminProductList');
            
            sList.innerHTML = '<h4 style="font-size:14px; color:#718096; margin-bottom:8px;">Dukano:</h4>';
            stores.forEach(s => {
                sList.innerHTML += `
                    <div class="item-box">
                        <span><b>${s.name}</b></span>
                        <button class="del-btn" onclick="deleteStore(${s.id})">Delete Store</button>
                    </div>
                `;
            });

            pList.innerHTML = '<h4 style="font-size:14px; color:#718096; margin:15px 0 8px 0;">Products:</h4>';
            products.forEach(p => {
                let storeObj = stores.find(s => s.id === p.storeId);
                let storeName = storeObj ? storeObj.name : 'Unknown Store';
                pList.innerHTML += `
                    <div class="item-box">
                        <div>
                            <b>${p.name}</b> <span style="font-size:12px; color:#718096;">(${storeName})</span><br>
                            <small style="color:#4a5568;">Spec: ${p.spec} | ₹${p.price} / ${p.unit}</small>
                        </div>
                        <button class="del-btn" onclick="deleteProduct(${p.id})">Delete</button>
                    </div>
                `;
            });
        }

        updateStoreDropdown();
        renderAdminLists();
    </script>
</body>
</html>
