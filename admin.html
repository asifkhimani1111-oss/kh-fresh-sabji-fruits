
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.H Fresh Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f2;font-family:Arial,sans-serif;color:#233}
header{background:#087b43;color:white;padding:18px;text-align:center}
main{max-width:750px;margin:auto;padding:12px}
section{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 5px #0001}
h3{color:#087b43}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{background:#087b43;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.red{background:#c62828}
.blue{background:#1976d2}
.card{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0}
.note{font-size:13px;color:#666}
.green{background:#e8f5e9;padding:10px;border-radius:8px}
.preview{width:130px;height:130px;object-fit:cover;display:none;border-radius:10px;margin:8px 0}
.productImage,.shopImage{width:110px;height:110px;object-fit:cover;border-radius:9px;background:#eee}
.photoRow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.progress{width:100%;height:12px;background:#ddd;border-radius:20px;overflow:hidden;display:none;margin:10px 0}
.bar{height:100%;width:0;background:#087b43;transition:width .2s}
.message{padding:11px;border-radius:8px;margin:8px 0;display:none;overflow-wrap:anywhere}
.ok{display:block;background:#e8f5e9;color:#087b43}
.err{display:block;background:#ffebee;color:#b71c1c}
</style>
</head>
<body>

<header>
<h2>K.H Fresh – Admin Panel</h2>
<p>દુકાન અને પ્રોડક્ટ મેનેજમેન્ટ</p>
</header>

<main>

<section>
<h3>🔐 Admin Login</h3>
<input id="adminEmail" type="email" placeholder="Admin Email">
<input id="adminPassword" type="password" placeholder="Password">
<button id="loginBtn">Admin Login</button>
<button id="logoutBtn" class="red" style="display:none">Logout</button>
<p id="loginMsg" class="note"></p>
</section>

<div id="adminArea" style="display:none">

<section>
<h3>🏪 નવી દુકાન ઉમેરો</h3>
<label>દુકાનનું નામ</label>
<input id="shopName" placeholder="દા.ત. ગણેશ નમકીન">

<label>WhatsApp નંબર (91 સાથે)</label>
<input id="shopWhatsApp" type="tel" placeholder="919426852334">

<label><b>📸 દુકાનનો ફોટો પસંદ કરો</b></label>
<input id="shopPhotoInput" type="file" accept="image/*" capture="environment">
<img id="shopPreview" class="preview" alt="દુકાન ફોટો પ્રિવ્યૂ">

<button id="saveShop">દુકાન ઉમેરો</button>
<div id="shopMsg" class="message"></div>
</section>

<section>
<h3>🏪 દુકાન પસંદ કરો</h3>
<select id="shopSelect"></select>
<div id="shopInfo"></div>
</section>

<section>
<h3>➕ નવી પ્રોડક્ટ ઉમેરો</h3>

<input id="productName" placeholder="પ્રોડક્ટનું નામ">
<input id="price" type="number" min="0" step="0.01" placeholder="ભાવ ₹">

<label>એકમ</label>
<select id="unit">
<option>કિલો (Kg)</option>
<option>ગ્રામ (Gram)</option>
<option>નંગ (Pcs)</option>
<option>ડઝન (Dozen)</option>
<option>લિટર</option>
<option>મિલીલીટર</option>
<option>પેકેટ</option>
<option>બોક્સ</option>
<option>જોડી</option>
<option>મીટર</option>
<option>સેટ</option>
<option>બીજું</option>
</select>

<input id="category" list="categoryList" placeholder="કેટેગરી">
<datalist id="categoryList">
<option value="શાકભાજી">
<option value="ફળો">
<option value="નમકીન / ફાસ્ટફૂડ">
<option value="કપડાં - લેડીઝ">
<option value="કપડાં - જેન્ટ્સ">
<option value="ફૂટવેર">
<option value="મોબાઇલ">
<option value="ઇલેક્ટ્રોનિક્સ">
<option value="કરિયાણું">
<option value="કટલરી">
<option value="અન્ય">
</datalist>

<input id="sizes" placeholder="સાઇઝ">
<input id="colors" placeholder="કલર">
<input id="design" placeholder="ડિઝાઇન / મોડેલ">

<label><b>📸 પ્રોડક્ટનો ફોટો</b></label>
<input id="photo" type="file" accept="image/*" capture="environment">
<img id="preview" class="preview" alt="પ્રોડક્ટ પ્રિવ્યૂ">

<div class="progress" id="progress">
<div class="bar" id="bar"></div>
</div>
<p id="uploadText" class="note"></p>
<div id="productMsg" class="message"></div>

<button id="addProduct">પ્રોડક્ટ ઉમેરો</button>
</section>

<section>
<h3>📦 દુકાનની પ્રોડક્ટ</h3>
<div id="products"></div>
</section>

<section>
<h3>💰 માસિક પ્લાન અને રોકડ પેમેન્ટ</h3>
<div id="billing" class="green">દુકાન પસંદ કરો.</div>

<label>
<input id="cashReceived" type="checkbox" style="width:auto">
રોકડ પેમેન્ટ મળી ગયું છે.
</label>

<button id="activatePlan" class="blue">OK – પ્લાન 30 દિવસ માટે ON કરો</button>
<button id="deactivatePlan" class="red">દુકાન OFF કરો</button>
<p id="planMsg" class="note"></p>
</section>

</div>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getFirestore,collection,addDoc,getDocs,query,where,
 doc,updateDoc,deleteDoc,serverTimestamp,Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
 getStorage,ref,uploadBytesResumable,getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",
 projectId:"kh-fresh-sabji-fruits",
 storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId:"815611229461",
 appId:"1:815611229461:web:ca713dc978e0997930251c",
 measurementId:"G-HBL4EVF1MN"
};

const ADMIN_UID="bzMpXfz6ltVVB7GcWHWh0ok7XbO2";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const storage=getStorage(app);
const auth=getAuth(app);
const $=id=>document.getElementById(id);

let shops=[];
let selectedShop=null;
let shopImageBlob=null;
let resizedImageBlob=null;
let busy=false;

function showMsg(id,text,type="ok"){
 const el=$(id);
 el.textContent=text;
 el.className="message "+type;
}

function requireAdmin(){
 if(!auth.currentUser||auth.currentUser.uid!==ADMIN_UID){
  throw new Error("આ સુવિધા ફક્ત Admin માટે છે.");
 }
}

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function resizePhoto(file,maxSize,quality,previewId,callback){
 if(!file){
  callback(null);
  return;
 }

 if(!file.type.startsWith("image/")){
  alert("કૃપા કરીને ફોટો પસંદ કરો.");
  callback(null);
  return;
 }

 const url=URL.createObjectURL(file);
 const img=new Image();

 img.onload=()=>{
  URL.revokeObjectURL(url);

  const scale=Math.min(1,maxSize/Math.max(img.width,img.height));
  const canvas=document.createElement("canvas");

  canvas.width=Math.round(img.width*scale);
  canvas.height=Math.round(img.height*scale);

  const ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0,canvas.width,canvas.height);

  $(previewId).src=canvas.toDataURL("image/jpeg",quality);
  $(previewId).style.display="block";

  canvas.toBlob(blob=>{
   if(!blob){
    callback(null);
    return;
   }
   callback(blob);
  },"image/jpeg",quality);
 };

 img.onerror=()=>{
  URL.revokeObjectURL(url);
  alert("ફોટો ખોલવામાં ભૂલ થઈ.");
  callback(null);
 };

 img.src=url;
}

$("shopPhotoInput").onchange=e=>{
 const file=e.target.files[0];
 shopImageBlob=null;
 $("shopPreview").style.display="none";
 resizePhoto(file,500,0.7,"shopPreview",blob=>{
  shopImageBlob=blob;
 });
};

$("photo").onchange=e=>{
 const file=e.target.files[0];
 resizedImageBlob=null;
 $("preview").style.display="none";
 resizePhoto(file,700,0.7,"preview",blob=>{
  resizedImageBlob=blob;
 });
};

function uploadPhoto(path,blob,onProgress){
 return new Promise((resolve,reject)=>{
  const storageRef=ref(storage,path);
  const task=uploadBytesResumable(storageRef,blob,{
   contentType:"image/jpeg"
  });

  task.on("state_changed",
   snap=>{
    if(onProgress){
     onProgress(Math.round(
      snap.bytesTransferred/snap.totalBytes*100
     ));
    }
   },
   reject,
   async()=>{
    try{
     const url=await getDownloadURL(task.snapshot.ref);
     resolve(url);
    }catch(e){
     reject(e);
    }
   }
  );
 });
}

onAuthStateChanged(auth,user=>{
 const allowed=!!user&&user.uid===ADMIN_UID;

 $("adminArea").style.display=allowed?"block":"none";
 $("loginBtn").style.display=allowed?"none":"block";
 $("logoutBtn").style.display=allowed?"block":"none";

 if(user&&!allowed){
  $("loginMsg").textContent="આ એકાઉન્ટ Admin નથી.";
  signOut(auth);
  return;
 }

 if(allowed){
  $("loginMsg").textContent="Admin Login સફળ થયું.";
  loadShops();
 }
});

$("loginBtn").onclick=async()=>{
 try{
  const email=$("adminEmail").value.trim();
  const password=$("adminPassword").value;

  if(!email||!password)throw new Error("Email અને Password ભરો.");

  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){
  $("loginMsg").textContent="Login Error: "+e.message;
 }
};

$("logoutBtn").onclick=()=>signOut(auth);

async function loadShops(){
 try{
  requireAdmin();

  const snap=await getDocs(collection(db,"shops"));
  shops=snap.docs.map(d=>({id:d.id,...d.data()}));

  const select=$("shopSelect");
  select.replaceChildren();

  shops.forEach(s=>{
   const op=document.createElement("option");
   op.value=s.id;
   op.textContent=(s.name||"દુકાન")+" ("+(s.planActive?"ON":"OFF")+")";
   select.append(op);
  });

  if(!shops.length){
   selectedShop=null;
   $("shopInfo").textContent="હજી દુકાન નથી.";
   $("products").textContent="";
   $("billing").textContent="પહેલાં દુકાન ઉમેરો.";
   return;
  }

  const oldId=selectedShop?.id;
  select.value=shops.some(s=>s.id===oldId)?oldId:shops[0].id;
  await selectShop();

 }catch(e){
  console.error(e);
  $("shopMsg").textContent=e.message;
 }
}

$("shopSelect").onchange=selectShop;

async function selectShop(){
 requireAdmin();
 const id=$("shopSelect").value;
 selectedShop=shops.find(s=>s.id===id)||null;

 if(selectedShop)await loadProducts();
}

$("saveShop").onclick=async()=>{
 const btn=$("saveShop");

 try{
  requireAdmin();

  const name=$("shopName").value.trim();
  const whatsapp=$("shopWhatsApp").value.trim().replace(/\D/g,"");

  if(!name||!whatsapp){
   throw new Error("દુકાનનું નામ અને WhatsApp નંબર ભરો.");
  }

  btn.disabled=true;
  btn.textContent="દુકાન સેવ થઈ રહી છે...";

  const shopRef=await addDoc(collection(db,"shops"),{
   name,
   whatsapp,
   shopImageUrl:"",
   planActive:false,
   registrationFeePaid:false,
   createdAt:serverTimestamp(),
   updatedAt:serverTimestamp()
  });

  if(shopImageBlob){
   $("shopMsg").textContent="દુકાનનો ફોટો અપલોડ થઈ રહ્યો છે...";
   const url=await uploadPhoto(
    "shops/"+shopRef.id+".jpg",
    shopImageBlob
   );

   await updateDoc(doc(db,"shops",shopRef.id),{
    shopImageUrl:url,
    updatedAt:serverTimestamp()
   });
  }

  $("shopName").value="";
  $("shopWhatsApp").value="";
  $("shopPhotoInput").value="";
  $("shopPreview").style.display="none";
  shopImageBlob=null;

  showMsg("shopMsg","દુકાન અને ફોટો સફળતાપૂર્વક ઉમેરાઈ ગયા!");

  await loadShops();
  $("shopSelect").value=shopRef.id;
  await selectShop();

 }catch(e){
  showMsg("shopMsg","ભૂલ: "+e.message,"err");
 }finally{
  btn.disabled=false;
  btn.textContent="દુકાન ઉમેરો";
 }
};

$("addProduct").onclick=async()=>{
 if(busy)return;

 const btn=$("addProduct");

 try{
  requireAdmin();

  if(!selectedShop)throw new Error("પહેલાં દુકાન પસંદ કરો.");

  const name=$("productName").value.trim();
  const price=Number($("price").value);
  const category=$("category").value.trim();

  if(!name||!category||$("price").value===""||
   !Number.isFinite(price)||price<0){
   throw new Error("પ્રોડક્ટનું નામ, કેટેગરી અને યોગ્ય ભાવ ભરો.");
  }

  busy=true;
  btn.disabled=true;
  btn.textContent="પ્રોડક્ટ સેવ થઈ રહી છે...";

  const productRef=await addDoc(collection(db,"products"),{
   name,
   price,
   unit:$("unit").value,
   category,
   imageUrl:"",
   sizes:$("sizes").value.trim(),
   colors:$("colors").value.trim(),
   design:$("design").value.trim(),
   shopId:selectedShop.id,
   active:true,
   createdAt:serverTimestamp()
  });

  if(resizedImageBlob){
   const url=await uploadPhoto(
    "products/"+productRef.id+".jpg",
    resizedImageBlob,
    percent=>{
     $("progress").style.display="block";
     $("bar").style.width=percent+"%";
     $("uploadText").textContent="ફોટો અપલોડ: "+percent+"%";
    }
   );

   await updateDoc(doc(db,"products",productRef.id),{
    imageUrl:url
   });
  }

  $("productName").value="";
  $("price").value="";
  $("category").value="";
  $("sizes").value="";
  $("colors").value="";
  $("design").value="";
  $("photo").value="";
  $("preview").style.display="none";
  resizedImageBlob=null;

  showMsg("productMsg","પ્રોડક્ટ સફળતાપૂર્વક ઉમેરાઈ ગઈ!");

  await loadProducts();

 }catch(e){
  showMsg("productMsg","ભૂલ: "+e.message,"err");
 }finally{
  busy=false;
  btn.disabled=false;
  btn.textContent="પ્રોડક્ટ ઉમેરો";
  $("progress").style.display="none";
 }
};

async function loadProducts(){
 if(!selectedShop)return;

 requireAdmin();

 try{
  const snap=await getDocs(query(
   collection(db,"products"),
   where("shopId","==",selectedShop.id)
  ));

  const count=snap.size;

  const info=$("shopInfo");
  info.replaceChildren();

  const name=document.createElement("h3");
  name.textContent=selectedShop.name||"દુકાન";
  info.append(name);

  const number=document.createElement("p");
  number.textContent="WhatsApp: "+(selectedShop.whatsapp||"");
  info.append(number);

  if(selectedShop.shopImageUrl){
   const img=document.createElement("img");
   img.src=selectedShop.shopImageUrl;
   img.className="shopImage";
   img.alt="દુકાનનો ફોટો";
   img.onerror=()=>img.alt="દુકાનનો ફોટો લોડ થયો નથી";
   info.append(img);
  }else{
   const note=document.createElement("p");
   note.textContent="દુકાનનો ફોટો ઉમેરેલો નથી.";
   info.append(note);
  }

  $("billing").innerHTML=
   `કુલ પ્રોડક્ટ: <b>${count}</b><br>
    માસિક ચાર્જ: ₹${count*2}<br>
    સ્થિતિ: <b>${selectedShop.planActive?"🟢 ON":"🔴 OFF"}</b>`;

  const list=$("products");
  list.replaceChildren();

  snap.forEach(d=>{
   const p=d.data();

   const card=document.createElement("div");
   card.className="card";

   const row=document.createElement("div");
   row.className="photoRow";

   if(p.imageUrl){
    const img=document.createElement("img");
    img.src=p.imageUrl;
    img.className="productImage";
    img.alt=p.name||"પ્રોડક્ટ";
    img.onerror=()=>img.alt="ફોટો લોડ થયો નથી";
    row.append(img);
   }else{
    const note=document.createElement("div");
    note.className="productImage";
    note.style.display="flex";
    note.style.alignItems="center";
    note.style.justifyContent="center";
    note.textContent="📦 ફોટો નથી";
    row.append(note);
   }

   const details=document.createElement("div");
   details.innerHTML=
    `<b>${safe(p.name)}</b><br>
     ₹${Number(p.price||0)} / ${safe(p.unit)}<br>
     <small>${safe(p.category)}</small><br>
     <small>સાઇઝ: ${safe(p.sizes||"-")}</small><br>
     <small>કલર: ${safe(p.colors||"-")}</small><br>
     <small>ડિઝાઇન: ${safe(p.design||"-")}</small>`;

   row.append(details);
   card.append(row);

   const del=document.createElement("button");
   del.textContent="પ્રોડક્ટ ડિલીટ";
   del.className="red";

   del.onclick=async()=>{
    if(!confirm("આ પ્રોડક્ટ ડિલીટ કરવી છે?"))return;

    try{
     requireAdmin();
     await deleteDoc(doc(db,"products",d.id));
     await loadProducts();
    }catch(e){
     alert("ભૂલ: "+e.message);
    }
   };

   card.append(del);
   list.append(card);
  });

  if(!count){
   list.innerHTML='<p>આ દુકાનમાં હજી પ્રોડક્ટ નથી.</p>';
  }

 }catch(e){
  console.error(e);
  $("products").textContent="પ્રોડક્ટ લોડ કરવામાં ભૂલ: "+e.message;
 }
}

$("activatePlan").onclick=async()=>{
 try{
  requireAdmin();

  if(!selectedShop)throw new Error("દુકાન પસંદ કરો.");
  if(!$("cashReceived").checked)throw new Error("રોકડ પેમેન્ટ મળ્યાની ખાતરી કરો.");

  const start=new Date();
  const end=new Date(start.getTime()+30*24*60*60*1000);

  await updateDoc(doc(db,"shops",selectedShop.id),{
   planActive:true,
   registrationFeePaid:true,
   planStartAt:Timestamp.fromDate(start),
   planEndAt:Timestamp.fromDate(end),
   monthlyAmount:(await getDocs(query(
    collection(db,"products"),
    where("shopId","==",selectedShop.id)
   ))).size*2,
   updatedAt:serverTimestamp()
  });

  $("planMsg").textContent="દુકાન 30 દિવસ માટે ON થઈ ગઈ!";
  $("cashReceived").checked=false;
  await loadShops();

 }catch(e){
  $("planMsg").textContent="ભૂલ: "+e.message;
 }
};

$("deactivatePlan").onclick=async()=>{
 try{
  requireAdmin();

  if(!selectedShop)throw new Error("દુકાન પસંદ કરો.");

  await updateDoc(doc(db,"shops",selectedShop.id),{
   planActive:false,
   updatedAt:serverTimestamp()
  });

  $("planMsg").textContent="દુકાન બંધ કરી દીધી.";
  await loadShops();

 }catch(e){
  $("planMsg").textContent="ભૂલ: "+e.message;
 }
};
