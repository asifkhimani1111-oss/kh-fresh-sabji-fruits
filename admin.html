const firebaseConfig = {

 authDomain: "kh-fresh-fashion.firebaseapp.com",
 projectId: "kh-fresh-fashion",
 storageBucket: "kh-fresh-fashion.firebasestorage.app",
 messagingSenderId: "1013749791487",
 appId: "1:1013749791487:web:3b1af0eb4f7497a30feaca"

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const ADMIN_EMAIL = "asifkhimani1111@gmail.com";

let shops = [];

const $ = id => document.getElementById(id);

function showMessage(text, error=false){
 $("message").textContent = text;

window.login = async function(){
 const email = $("email").value.trim();
 const password = $("password").value;

 $("loginMessage").textContent = "Login થઈ રહ્યું છે...";

 try{
  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){
  $("loginMessage").textContent = "Login Error: " + e.message;
 }
};

window.logout = async function(){
 await signOut(auth);
};

onAuthStateChanged(auth,user=>{
 if(user && user.email === ADMIN_EMAIL){
  $("loginBox").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
  $("welcome").textContent = "સ્વાગત છે: " + user.email;

 }else{

  $("loginBox").classList.remove("hidden");

function startListeners(){

 onSnapshot(collection(db,"shops"),snap=>{

  updateShopDropdown();
 },err=>showMessage("દુકાનો લોડ કરવામાં ભૂલ: "+err.message,true));

 onSnapshot(collection(db,"categories"),snap=>{
  categories = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderCategories();
  updateCategoryDropdown();
 },err=>showMessage("કેટેગરી લોડ કરવામાં ભૂલ: "+err.message,true));

 onSnapshot(collection(db,"products"),snap=>{
  products = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderProducts();
 },err=>showMessage("પ્રોડક્ટ્સ લોડ કરવામાં ભૂલ: "+err.message,true));

 onSnapshot(collection(db,"orders"),snap=>{
  orders = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderOrders();
 },err=>showMessage("ઓર્ડર લોડ કરવામાં ભૂલ: "+err.message,true));
}

window.showTab = function(tab){
 ["shops","categories","products","orders"].forEach(t=>{
  $(t+"Tab").classList.toggle("hidden",t!==tab);
 });
};

async function compressImage(file){
 return new Promise((resolve,reject)=>{
  const reader = new FileReader();
  reader.onerror = reject;
  reader.onload = ()=>{
   const img = new Image();
   img.onerror = reject;
   img.onload = ()=>{
    const canvas = document.createElement("canvas");
    let w=img.width,h=img.height;
    const max=900;
    if(w>max || h>max){
     const ratio=Math.min(max/w,max/h);
     w=Math.round(w*ratio);
     h=Math.round(h*ratio);
    }
    canvas.width=w;
    canvas.height=h;
    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);

    let quality=.72;
    let data=canvas.toDataURL("image/jpeg",quality);

    while(data.length>300000 && quality>.30){
     quality-=.08;
     data=canvas.toDataURL("image/jpeg",quality);
    }

    if(data.length>350000){
     reject(new Error("ફોટો મોટો છે. નાનો ફોટો પસંદ કરો."));
    }else{
     resolve(data);
    }
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

$("shopImage").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
  shopPhotoData=await compressImage(file);
  $("shopImagePreview").innerHTML='<img width="100" src="'+shopPhotoData+'">';
 }catch(err){showMessage(err.message,true);}
});

$("productImage").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
  productPhotoData=await compressImage(file);
  $("productImagePreview").innerHTML='<img width="100" src="'+productPhotoData+'">';
 }catch(err){showMessage(err.message,true);}
});

window.saveShop = async function(){
 try{
  const id=$("shopId").value;
  const name=$("shopName").value.trim();
  if(!name) return showMessage("દુકાનનું નામ લખો.",true);

  const data={
   name,
   owner:$("shopOwner").value.trim(),
   mobile:$("shopMobile").value.trim(),
   whatsapp:$("shopWhatsapp").value.trim(),
   area:$("shopArea").value.trim(),
   address:$("shopAddress").value.trim(),
   active:$("shopActive").checked,
   updatedAt:serverTimestamp()
  };

  if(shopPhotoData) data.shopImageBase64=shopPhotoData;

  if(id){
   await updateDoc(doc(db,"shops",id),data);
   showMessage("દુકાન અપડેટ થઈ ગઈ.");
  }else{
   data.createdAt=serverTimestamp();
   data.feePaid=false;
   await addDoc(collection(db,"shops"),data);
   showMessage("નવી દુકાન ઉમેરાઈ ગઈ.");
  }
  clearShopForm();
 }catch(e){showMessage("દુકાન સેવ કરવામાં ભૂલ: "+e.message,true);}
};

window.clearShopForm=function(){
 $("shopId").value="";
 ["shopName","shopOwner","shopMobile","shopWhatsapp","shopArea","shopAddress"].forEach(id=>$(id).value="");
 $("shopActive").checked=true;
 $("shopImage").value="";
 $("shopImagePreview").innerHTML="";
 shopPhotoData="";
};

function renderShops(){
 $("shopsList").innerHTML="";
 if(!shops.length){
  $("shopsList").textContent="હજુ કોઈ દુકાન નથી.";
  return;
 }

 shops.forEach(s=>{
  const div=document.createElement("div");
  div.className="item";
  const img=s.shopImageBase64
   ? '<img src="'+s.shopImageBase64+'">'
   : "";
  const status=s.active ? "ચાલુ" : "બંધ";
  const expiry=s.subscriptionEndAt?.toDate
   ? s.subscriptionEndAt.toDate().toLocaleDateString("en-IN")
   : "નક્કી નથી";

  div.innerHTML=`
   ${img}
   <b>${escapeHtml(s.name||"નામ નથી")}</b>
   <div>${escapeHtml(s.area||"")}</div>
   <div>માલિક: ${escapeHtml(s.owner||"-")}</div>
   <div>WhatsApp: ${escapeHtml(s.whatsapp||"-")}</div>
   <div class="status ${s.active?'green':'red'}">સ્થિતિ: ${status}</div>
   <div class="small">ફી: ${s.feePaid?"ચૂકવેલી":"બાકી"} | સમાપ્તિ: ${expiry}</div>
   <button data-edit="${s.id}">Edit</button>
   <button class="warning" data-renew="${s.id}">₹60 / 30 દિવસ ચાલુ</button>
   <button class="secondary" data-toggle="${s.id}">${s.active?"બંધ કરો":"ચાલુ કરો"}</button>
   <button class="danger" data-delete="${s.id}">Delete</button>
  `;
  $("shopsList").appendChild(div);
 });

 $("shopsList").querySelectorAll("[data-edit]").forEach(b=>
  b.onclick=()=>editShop(b.dataset.edit));
 $("shopsList").querySelectorAll("[data-renew]").forEach(b=>
  b.onclick=()=>renewShop(b.dataset.renew));
 $("shopsList").querySelectorAll("[data-toggle]").forEach(b=>
  b.onclick=()=>toggleShop(b.dataset.toggle));
 $("shopsList").querySelectorAll("[data-delete]").forEach(b=>
  b.onclick=()=>removeShop(b.dataset.delete));
}

function editShop(id){
 const s=shops.find(x=>x.id===id);
 if(!s)return;
 $("shopId").value=id;
 $("shopName").value=s.name||"";
 $("shopOwner").value=s.owner||"";
 $("shopMobile").value=s.mobile||"";
 $("shopWhatsapp").value=s.whatsapp||"";
 $("shopArea").value=s.area||"";
 $("shopAddress").value=s.address||"";
 $("shopActive").checked=s.active!==false;
 shopPhotoData=s.shopImageBase64||"";
 $("shopImagePreview").innerHTML=shopPhotoData
  ? '<img width="100" src="'+shopPhotoData+'">'
  : "";
 showTab("shops");
 window.scrollTo({top:0,behavior:"smooth"});
}

async function renewShop(id){
 if(!confirm("₹60 રોકડ ફી મળ્યા પછી જ દુકાનને 30 દિવસ ચાલુ કરવી છે?"))return;
 try{
  const end=new Date();
  end.setDate(end.getDate()+30);
  await updateDoc(doc(db,"shops",id),{
   active:true,
   feePaid:true,
   subscriptionEndAt:Timestamp.fromDate(end),
   updatedAt:serverTimestamp()
  });
  showMessage("દુકાન 30 દિવસ માટે ચાલુ થઈ ગઈ.");
 }catch(e){showMessage(e.message,true);}
}

async function toggleShop(id){
 const s=shops.find(x=>x.id===id);
 if(!s)return;
 try{
  await updateDoc(doc(db,"shops",id),{active:!s.active});
  showMessage("દુકાનની સ્થિતિ બદલાઈ ગઈ.");
 }catch(e){showMessage(e.message,true);}
}

async function removeShop(id){
 if(!confirm("આ દુકાન Delete કરવી છે?"))return;
 try{
  await deleteDoc(doc(db,"shops",id));
  showMessage("દુકાન Delete થઈ ગઈ.");
 }catch(e){showMessage(e.message,true);}
}

 try{
  await addDoc(collection(db,"categories"),{
   name,createdAt:serverTimestamp()

  $("categoryName").value="";
  showMessage("કેટેગરી ઉમેરાઈ ગઈ.");

function renderCategories(){
 $("categoriesList").innerHTML="";
 if(!categories.length){
  $("categoriesList").textContent="હજુ કેટેગરી નથી.";
  return;
 }
 categories.forEach(c=>{
  const div=document.createElement("div");
  div.className="item";
  div.innerHTML=`
   <b>${escapeHtml(c.name||"")}</b>
   <button data-edit-category="${c.id}">Edit</button>
   <button class="danger" data-delete-category="${c.id}">Delete</button>
  `;
  $("categoriesList").appendChild(div);
 });
 $("categoriesList").querySelectorAll("[data-edit-category]").forEach(b=>{
  b.onclick=async()=>{
   const c=categories.find(x=>x.id===b.dataset.editCategory);
   if(!c)return;
   const name=prompt("નવી કેટેગરીનું નામ:",c.name||"");
   if(name && name.trim()){
    try{
     await updateDoc(doc(db,"categories",c.id),{name:name.trim()});
     showMessage("કેટેગરી અપડેટ થઈ.");
    }catch(e){showMessage(e.message,true);}
   }
  };
 });
 $("categoriesList").querySelectorAll("[data-delete-category]").forEach(b=>{
  b.onclick=async()=>{
   if(!confirm("કેટેગરી Delete કરવી છે?"))return;
   try{
    await deleteDoc(doc(db,"categories",b.dataset.deleteCategory));
    showMessage("કેટેગરી Delete થઈ.");
   }catch(e){showMessage(e.message,true);}
  };
 });
}

function updateShopDropdown(){

 const old=select.value;
 select.innerHTML='<option value="">દુકાન પસંદ કરો</option>';
 shops.forEach(s=>{
  const op=document.createElement("option");
  op.value=s.id;
  op.textContent=s.name||"નામ નથી";
  select.appendChild(op);
 });
 if(old)select.value=old;
}

function updateCategoryDropdown(){
 const select=$("productCategory");
 const old=select.value;
 select.innerHTML='<option value="">કેટેગરી પસંદ કરો</option>';
 categories.forEach(c=>{
  const op=document.createElement("option");
  op.value=c.name;
  op.textContent=c.name;
  select.appendChild(op);
 });
 if(old)select.value=old;
}

window.saveProduct=async function(){
 try{
  const id=$("productId").value;
  const shopId=$("productShop").value;
  const shop=shops.find(s=>s.id===shopId);
  const name=$("productName").value.trim();
  const price=Number($("productPrice").value);

  if(!shopId)return showMessage("દુકાન પસંદ કરો.",true);
  if(!name)return showMessage("પ્રોડક્ટનું નામ લખો.",true);
  if(!Number.isFinite(price)||price<0)return showMessage("સાચો ભાવ લખો.",true);

  const data={
   shopId,
   shopName:shop?.name||"",
   name,
   category:$("productCategory").value,
   subcategory:$("productSubcategory").value.trim(),
   price,
   unit:$("productUnit").value,
   stepGrams:Number($("stepGrams").value)||0,
   stepPieces:Number($("stepPieces").value)||0,
   categoryType:$("categoryType").value,
   size:$("productSize").value.trim(),
   color:$("productColor").value.trim(),
   design:$("productDesign").value.trim(),
   shoeNumber:$("shoeNumber").value.trim(),
   otherDetails:$("otherDetails").value.trim(),
   active:$("productActive").checked,
   updatedAt:serverTimestamp()
  };

  if(productPhotoData)data.imageBase64=productPhotoData;

  if(id){
   await updateDoc(doc(db,"products",id),data);
   showMessage("પ્રોડક્ટ અપડેટ થઈ ગઈ.");
  }else{
   data.createdAt=serverTimestamp();
   await addDoc(collection(db,"products"),data);
   showMessage("પ્રોડક્ટ ઉમેરાઈ ગઈ.");
  }
  clearProductForm();
 }catch(e){showMessage("પ્રોડક્ટ સેવ કરવામાં ભૂલ: "+e.message,true);}
};

window.clearProductForm=function(){
 $("productId").value="";
 ["productName","productSubcategory","productPrice","stepGrams",
  "stepPieces","productSize","productColor","productDesign",
  "shoeNumber","otherDetails"].forEach(id=>$(id).value="");
 $("productShop").value="";
 $("productCategory").value="";
 $("productUnit").value="કિલો";
 $("categoryType").value="other";
 $("productActive").checked=true;
 $("productImage").value="";
 $("productImagePreview").innerHTML="";
 productPhotoData="";
};

function renderProducts(){
 $("productsList").innerHTML="";
 if(!products.length){
  $("productsList").textContent="હજુ પ્રોડક્ટ નથી.";
  return;
 }

 products.forEach(p=>{
  const div=document.createElement("div");
  div.className="item";
  const img=p.imageBase64?'<img src="'+p.imageBase64+'">':"";
  div.innerHTML=`
   ${img}
   <b>${escapeHtml(p.name||"નામ નથી")}</b>
   <div>દુકાન: ${escapeHtml(p.shopName||"")}</div>
   <div>કેટેગરી: ${escapeHtml(p.category||"")}</div>
   <div>ભાવ: ₹${Number(p.price||0)} / ${escapeHtml(p.unit||"")}</div>
   <div>સ્થિતિ: <span class="${p.active===false?'red':'green'}">${p.active===false?'બંધ':'ચાલુ'}</span></div>
   <button data-edit-product="${p.id}">Edit</button>
   <button class="secondary" data-toggle-product="${p.id}">${p.active===false?'ચાલુ કરો':'બંધ કરો'}</button>
   <button class="danger" data-delete-product="${p.id}">Delete</button>
  `;
  $("productsList").appendChild(div);
 });

 $("productsList").querySelectorAll("[data-edit-product]").forEach(b=>
  b.onclick=()=>editProduct(b.dataset.editProduct));
 $("productsList").querySelectorAll("[data-toggle-product]").forEach(b=>
  b.onclick=()=>toggleProduct(b.dataset.toggleProduct));
 $("productsList").querySelectorAll("[data-delete-product]").forEach(b=>
  b.onclick=()=>removeProduct(b.dataset.deleteProduct));
}

function editProduct(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;

 $("productId").value=id;
 $("productShop").value=p.shopId||"";
 $("productName").value=p.name||"";
 $("productCategory").value=p.category||"";
 $("productSubcategory").value=p.subcategory||"";
 $("productPrice").value=p.price??"";
 $("productUnit").value=p.unit||"કિલો";
 $("stepGrams").value=p.stepGrams||"";
 $("stepPieces").value=p.stepPieces||"";
 $("categoryType").value=p.categoryType||"other";
 $("productSize").value=p.size||"";
 $("productColor").value=p.color||"";
 $("productDesign").value=p.design||"";
 $("shoeNumber").value=p.shoeNumber||"";
 $("otherDetails").value=p.otherDetails||"";
 $("productActive").checked=p.active!==false;
 productPhotoData=p.imageBase64||"";
 $("productImagePreview").innerHTML=productPhotoData
  ? '<img width="100" src="'+productPhotoData+'">'
  : "";
 showTab("products");
 window.scrollTo({top:0,behavior:"smooth"});
}

async function toggleProduct(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;
 try{
  await updateDoc(doc(db,"products",id),{active:p.active===false});
  showMessage("પ્રોડક્ટની સ્થિતિ બદલાઈ ગઈ.");
 }catch(e){showMessage(e.message,true);}
}

async function removeProduct(id){
 if(!confirm("આ પ્રોડક્ટ Delete કરવી છે?"))return;
 try{
  await deleteDoc(doc(db,"products",id));
  showMessage("પ્રોડક્ટ Delete થઈ ગઈ.");
 }catch(e){showMessage(e.message,true);}
}

function renderOrders(){
 $("ordersList").innerHTML="";
 if(!orders.length){
  $("ordersList").textContent="હજુ કોઈ ઓર્ડર નથી.";
  return;
 }

 orders.forEach(o=>{
  const div=document.createElement("div");
  div.className="item";
  const details=JSON.stringify(o,null,2);
  div.innerHTML=`
   <b>Order ID: ${escapeHtml(o.id)}</b>
   <pre style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(details)}</pre>
  `;
  $("ordersList").appendChild(div);
 });
}

function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
