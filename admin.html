<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh & Fashion — Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#eef4ee;color:#203326;font-family:Arial,sans-serif}
main{max-width:700px;margin:auto}
section{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
h2,h3{color:#168343;margin-top:0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#168343;color:white;border:0;font-weight:bold;cursor:pointer}
button:hover{background:#126633}
.item-card{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0;background:#fafafa;display:flex;align-items:center;gap:12px}
.item-card img{width:70px;height:70px;object-fit:cover;border-radius:6px}
.item-info{flex:1}
.del-btn{background:#d32f2f;width:auto;padding:6px 12px;font-size:13px;margin-top:4px}
.shop-box{border:1px solid #c8e6c9;background:#f9fbf9;padding:12px;margin:10px 0;border-radius:8px}
</style>
</head>
<body>
<main>
<h2>🛠️ K.H Fresh & Fashion - Admin Panel</h2>

<!-- નવી દુકાન અને માસિક ચાર્જ ઉમેરવા માટેનું સેશન -->
<section>
<h3>🏪 દુકાન અને માસિક પ્લાન (₹300 / 30 Prods) ઉમેરો</h3>
<form id="shopForm">
<label>દુકાનનું નામ</label>
<input id="sName" placeholder="દા.ત. K.H Fresh Sabji" required>
<label>દુકાનનો WhatsApp નંબર (દા.ત. 919876543210)</label>
<input id="sWhatsapp" placeholder="919876543210" required>
<label>માસિક મિનિમમ ચાર્જ (₹)</label>
<input id="sMinCharge" type="number" value="300" required>
<label>પ્લાન ચાલુ થયાની તારીખ</label>
<input id="sStartDate" type="date" required>
<button type="submit" style="background:#0288d1;">💾 દુકાન સેવ કરો</button>
</form>
</section>

<!-- દુકાનો અને એમના હિસાબની યાદી -->
<section>
<h3>📊 દુકાનવાર માસિક હિસાબ (₹300 + એક્સ્ટ્રા પ્રોડક્ટ ₹10)</h3>
<div id="shopsAccountList">લોડ થઈ રહ્યું છે...</div>
</section>

<!-- વસ્તુ ઉમેરવા માટેનું સેશન -->
<section>
<h3>➕ નવી વસ્તુ ઉમેરો / અપડેટ કરો</h3>
<form id="productForm">
<input type="hidden" id="pId">
<label>દુકાન સિલેક્ટ કરો</label>
<select id="pShopId" required>
  <option value="">દુકાન પસંદ કરો...</option>
</select>

<label>વસ્તુનું નામ</label>
<input id="pName" placeholder="દા.ત. Apple, Mawa Chikki" required>

<label>કેટેગરી</label>
<select id="pCategory" required>
  <option value="શાકભાજી">શાકભાજી</option>
  <option value="ફળો">ફળો</option>
  <option value="Ice Cream & Cold Drink">Ice Cream & Cold Drink</option>
  <option value="Mithai & Namkeen">Mithai & Namkeen</option>
  <option value="Women / Ladies">Women / Ladies</option>
  <option value="Men / Gents">Men / Gents</option>
  <option value="Big Boy">Big Boy</option>
  <option value="Big Girl">Big Girl</option>
  <option value="Children">Children</option>
  <option value="Baby Boy">Baby Boy</option>
  <option value="Baby Girl">Baby Girl</option>
  <option value="કરિયાણું">કરિયાણું</option>
  <option value="જનરલ સ્ટોર">જનરલ સ્ટોર</option>
</select>

<label>ભાવ (₹)</label>
<input id="pPrice" type="number" step="0.01" placeholder="ભાવ લખો" required>

<label>એકમ (Unit)</label>
<select id="pUnit">
  <option value="કિલો (Kg)">કિલો (Kg)</option>
  <option value="ગ્રામ (Gram)">ગ્રામ (Gram)</option>
  <option value="નંગ (Piece)">નંગ (Piece)</option>
  <option value="પેકેટ (Packet)">પેકેટ (Packet)</option>
  <option value="લીટર (Liter)">લીટર (Liter)</option>
  <option value="મીટર (Meter)">મીટર (Meter)</option>
</select>

<label>ફોટો લિંક (Image URL)</label>
<input id="pImageUrl" placeholder="ફોટોની લિંક અહીં પેસ્ટ કરો">

<label>કલર્સ (વૈકલ્પિક)</label>
<input id="pColors" placeholder="Red, Blue, White">

<label>સાઇઝ (વૈકલ્પિક)</label>
<input id="pSizes" placeholder="S, M, L, XL">

<button type="submit">💾 વસ્તુ સેવ કરો</button>
<button type="button" id="resetBtn" style="background:#666; display:none;">ફોર્મ ખાલી કરો</button>
</form>
</section>

<section>
<h3>📦 બધી વસ્તુઓની યાદી</h3>
<div id="adminProductsList">લોડ થઈ રહ્યું છે...</div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",
 projectId:"kh-fresh-sabji-fruits",
 storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId:"815611229461",
 appId:"1:815611229461:web:ca713dc978e0997930251c",
 measurementId:"G-HBL4EVF1MN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let allShopsCache = [];
let allProductsCache = [];

async function initAdmin() {
 // આજની તારીખ ડિફોલ્ટ સેટ કરો
 const today = new Date().toISOString().split('T')[0];
 if($("sStartDate")) $("sStartDate").value = today;

 loadShopsAndProducts();

 $("shopForm").onsubmit = async (e) => {
  e.preventDefault();
  const name = $("sName").value.trim();
  const whatsapp = $("sWhatsapp").value.trim();
  const minCharge = parseFloat($("sMinCharge").value) || 300;
  const startDate = $("sStartDate").value;

  try {
   await addDoc(collection(db, "shops"), { name, whatsapp, minCharge, startDate });
   alert("દુકાન સફળતાપૂર્વક ઉમેરાઈ ગઈ!");
   $("shopForm").reset();
   $("sStartDate").value = today;
   loadShopsAndProducts();
  } catch(err) {
   alert("ભૂલ આવી: " + err.message);
  }
 };

 $("productForm").onsubmit = async (e) => {
  e.preventDefault();
  const id = $("pId").value;
  const shopId = $("pShopId").value;
  if(!shopId) {
   alert("કૃપા કરીને દુકાન સિલેક્ટ કરો!");
   return;
  }

  const data = {
   shopId: shopId,
   name: $("pName").value.trim(),
   category: $("pCategory").value,
   price: parseFloat($("pPrice").value),
   unit: $("pUnit").value,
   imageUrl: $("pImageUrl").value.trim(),
   colors: $("pColors").value.trim(),
   sizes: $("pSizes").value.trim(),
   active: true
  };

  try {
   if(id) {
    await updateDoc(doc(db, "products", id), data);
    alert("વસ્તુ સફળતાપૂર્વક અપડેટ થઈ ગઈ!");
   } else {
    await addDoc(collection(db, "products"), data);
    alert("નવી વસ્તુ સફળતાપૂર્વક ઉમેરાઈ ગઈ!");
   }
   resetForm();
  } catch(err) {
   alert("ભૂલ આવી: " + err.message);
  }
 };

 $("resetBtn").onclick = resetForm;
}

async function loadShopsAndProducts() {
 const shopSnap = await getDocs(collection(db, "shops"));
 allShopsCache = shopSnap.docs.map(d => ({id: d.id, ...d.data()}));

 // Dropdown update
 const shopSel = $("pShopId");
 shopSel.replaceChildren();
 const defaultOpt = document.createElement("option");
 defaultOpt.value = "";
 defaultOpt.textContent = "દુકાન પસંદ કરો...";
 shopSel.append(defaultOpt);

 allShopsCache.forEach(s => {
  const opt = document.createElement("option");
  opt.value = s.id;
  opt.textContent = s.name;
  shopSel.append(opt);
 });

 onSnapshot(collection(db, "products"), snap => {
  allProductsCache = snap.docs.map(d => ({id: d.id, ...d.data()}));
  renderAdminProducts(allProductsCache);
  renderShopsAccount();
 });
}

function renderShopsAccount() {
 const host = $("shopsAccountList");
 host.replaceChildren();

 if(allShopsCache.length === 0) {
  host.textContent = "હજી કોઈ દુકાન ઉમેરેલી નથી.";
  return;
 }

 allShopsCache.forEach(shop => {
  const shopProducts = allProductsCache.filter(p => p.shopId === shop.id);
  const totalProds = shopProducts.length;
  
  let baseCharge = shop.minCharge || 300;
  let calculatedBill = baseCharge;
  let extraCount = 0;

  if(totalProds > 30) {
   extraCount = totalProds - 30;
   calculatedBill = baseCharge + (extraCount * 10);
  }

  const box = document.createElement("div");
  box.className = "shop-box";
  box.innerHTML = `
   <h4 style="margin:0 0 6px 0; color:#168343;">🏪 ${shop.name}</h4>
   <p style="margin:4px 0; font-size:14px;">📞 WhatsApp: ${shop.whatsapp}</p>
   <p style="margin:4px 0; font-size:14px;">📅 શરૂ તારીખ: ${shop.startDate || 'નક્કી નથી'}</p>
   <p style="margin:4px 0; font-size:14px; font-weight:bold;">📦 કુલ પ્રોડક્ટ્સ: ${totalProds} (30 સુધી ₹${baseCharge}, ઉપરની ${extraCount} ના ₹10 લેખે)</p>
   <p style="margin:6px 0; font-size:16px; color:#d32f2f; font-weight:bold;">💰 આ મહિનાનું કુલ બિલ: ₹${calculatedBill}</p>
  `;

  // WhatsApp reminder button
  const callBtn = document.createElement("button");
  callBtn.textContent = "💬 WhatsApp પર રીમાઇન્ડર મોકલો / કોલ કરો";
  callBtn.style.cssText = "background:#25d366; margin-top:6px; font-size:13px; padding:8px;";
  callBtn.onclick = () => {
   let msg = `नमस्कार ${shop.name}, તમારો માસિક સબ્સ્ક્રિપ્શન પ્લાન પૂરો થવા આવ્યો છે. તમારી કુલ ${totalProds} પ્રોડક્ટ્સ છે અને આ મહિનાનું કુલ બિલ ₹${calculatedBill} થયું છે. શું તમે પ્લાન ચાલુ રાખવા માગો છો?`;
   window.open(`https://wa.me/${shop.whatsapp}?text=` + encodeURIComponent(msg), "_blank");
  };

  box.append(callBtn);
  host.append(box);
 });
}

function renderAdminProducts(products) {
 const host = $("adminProductsList");
 host.replaceChildren();

 if(products.length === 0) {
  host.textContent = "હજી કોઈ વસ્તુ ઉમેરેલી નથી.";
  return;
 }

 products.forEach(p => {
  const card = document.createElement("div");
  card.className = "item-card";

  const shopObj = allShopsCache.find(s => s.id === p.shopId);

  const img = document.createElement("img");
  img.src = p.imageUrl || "https://via.placeholder.com/70";
  img.alt = p.name;

  const info = document.createElement("div");
  info.className = "item-info";
  info.innerHTML = `
   <span style="font-size:11px; color:#168343; font-weight:bold;">[${p.category}] - ${shopObj ? shopObj.name : 'દુકાન નક્કી નથી'}</span>
   <strong style="display:block; font-size:15px;">${p.name}</strong>
   <span style="color:#333;">₹${p.price} / ${p.unit}</span>
  `;

  const btnRow = document.createElement("div");
  
  const editBtn = document.createElement("button");
  editBtn.textContent = "Edit";
  editBtn.style.cssText = "background:#ff9800; width:auto; padding:6px 12px; font-size:13px; margin-right:6px;";
  editBtn.onclick = () => {
   $("pId").value = p.id;
   $("pShopId").value = p.shopId || "";
   $("pName").value = p.name;
   $("pCategory").value = p.category || "શાકભાજી";
   $("pPrice").value = p.price;
   $("pUnit").value = p.unit || "કિલો (Kg)";
   $("pImageUrl").value = p.imageUrl || "";
   $("pColors").value = p.colors || "";
   $("pSizes").value = p.sizes || "";
   $("resetBtn").style.display = "block";
   window.scrollTo({top: 0, behavior: 'smooth'});
  };

  const delBtn = document.createElement("button");
  delBtn.className = "del-btn";
  delBtn.textContent = "Delete";
  delBtn.onclick = async () => {
   if(confirm(`શું તમે ખરેખર "${p.name}" હટાવવા માગો છો?`)) {
    await deleteDoc(doc(db, "products", p.id));
   }
  };

  btnRow.append(editBtn, delBtn);
  info.append(btnRow);
  card.append(img, info);
  host.append(card);
 });
}

function resetForm() {
 $("productForm").reset();
 $("pId").value = "";
 $("resetBtn").style.display = "none";
}

initAdmin();
</script>
</body>
</html>
