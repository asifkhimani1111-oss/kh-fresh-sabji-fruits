
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh Admin</title>
<style>
body{font-family:Arial;background:#f3f5f7;padding:15px}
.card{background:white;padding:16px;border-radius:14px;margin:12px 0}
h2{color:#087b43}
input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:8px}
input{border:1px solid #ccc}
button{background:#087b43;color:white;border:0}
img{width:100%;max-height:200px;object-fit:contain;background:#eee;border-radius:10px}
</style>
</head>
<body>

<h2>🛍️ K.H Fresh & Fashion Admin</h2>

<div class="card">
<h3>🏪 દુકાન ઉમેરો</h3>
<input id="shopName" placeholder="દુકાનનું નામ">

<label>દુકાનનો ફોટો પસંદ કરો</label>
<input type="file" id="shopPhoto" accept="image/*" onchange="previewPhoto(this,'shopPreview','shopBase64')">
<img id="shopPreview" alt="દુકાનનો ફોટો અહીં દેખાશે">
<input type="hidden" id="shopBase64">
<button onclick="saveShop()">દુકાન સેવ કરો</button>
</div>

<div class="card">
<h3>📦 પ્રોડક્ટ ઉમેરો</h3>
<input id="productName" placeholder="પ્રોડક્ટનું નામ">
<input id="productPrice" type="number" placeholder="ભાવ">

<label>પ્રોડક્ટનો ફોટો પસંદ કરો</label>
<input type="file" id="productPhoto" accept="image/*" onchange="previewPhoto(this,'productPreview','productBase64')">
<img id="productPreview" alt="પ્રોડક્ટનો ફોટો અહીં દેખાશે">
<input type="hidden" id="productBase64">
<button onclick="saveProduct()">પ્રોડક્ટ સેવ કરો</button>
</div>

<script>
async function compressImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const max=700;
    let w=img.width,h=img.height;
    if(w>h && w>max){h=h*max/w;w=max}
    else if(h>max){w=w*max/h;h=max}
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(w);
    canvas.height=Math.round(h);
    canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL("image/jpeg",0.65));
   };
   img.onerror=reject;
   img.src=reader.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

async function previewPhoto(input,previewId,hiddenId){
 const file=input.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){
  alert("મહેરબાની કરીને ફોટો પસંદ કરો.");
  input.value="";
  return;
 }
 try{
  const base64=await compressImage(file);
  document.getElementById(hiddenId).value=base64;
  document.getElementById(previewId).src=base64;
 }catch(e){
  alert("ફોટો વાંચી શકાયો નથી.");
 }
}

function saveShop(){
 const name=document.getElementById("shopName").value.trim();
 const photo=document.getElementById("shopBase64").value;
 if(!name||!photo){alert("દુકાનનું નામ અને ફોટો નાખો.");return}
 alert("ફોટો તૈયાર છે. ડેટાબેઝ જોડ્યા પછી દુકાન સાચવી શકાશે.");
}

function saveProduct(){
 const name=document.getElementById("productName").value.trim();
 const price=document.getElementById("productPrice").value;
 const photo=document.getElementById("productBase64").value;
 if(!name||!price||!photo){alert("નામ, ભાવ અને ફોટો નાખો.");return}
 alert("ફોટો તૈયાર છે. ડેટાબેઝ જોડ્યા પછી પ્રોડક્ટ સાચવી શકાશે.");
}
</script>
</body>
</html>
