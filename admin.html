<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.H Fresh - Master Multi-Store Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap');
        body { font-family: 'Noto Sans Gujarati', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-3 md:p-6">

    <div class="max-w-3xl mx-auto bg-white p-5 rounded-2xl shadow-md space-y-6">
        <h2 class="text-xl font-bold text-pink-600 border-b pb-2 flex justify-between items-center">
            <span><i class="fa-solid fa-store"></i> Master Admin - Badhi Dukano Ekaj Page Upar</span>
        </h2>

        <!-- Section 1: Add New Store -->
        <div class="bg-pink-50 border border-pink-200 p-4 rounded-xl space-y-3">
            <h3 class="font-bold text-sm text-pink-950"><i class="fa-solid fa-plus-circle"></i> નવી દુકાન ઉમેરો:</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">દુકાનનું નામ:</label>
                    <input type="text" id="newStoreName" class="w-full border p-2 rounded text-sm bg-white" placeholder="દા.ત. Ayan SuperStore">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">WhatsApp નંબર (ઓર્ડર માટે):</label>
                    <input type="text" id="newStorePhone" class="w-full border p-2 rounded text-sm bg-white" placeholder="9426852334">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 text-gray-600">દુકાનનો મોલ બેનર ફોટો (Gallery/Camera):</label>
                <input type="file" id="newStoreBanner" accept="image/*" class="w-full border p-2 rounded text-sm bg-white">
            </div>
            <button onclick="createNewStore()" class="w-full bg-pink-600 text-white font-bold py-2 rounded-lg text-xs shadow hover:bg-pink-700">નવી દુકાન સેવ કરો</button>
        </div>

        <!-- Section 2: All Stores List & Products Management -->
        <div class="space-y-4">
            <h3 class="font-bold text-sm text-gray-800"><i class="fa-solid fa-list"></i> બધી દુકાનો અને પ્રોડક્ટ્સ યાદી:</h3>
            <div id="allStoresContainer" class="space-y-6">
                <!-- Dynamically loaded stores list -->
            </div>
        </div>
    </div>

    <script>
        let stores = JSON.parse(localStorage.getItem('kh_all_stores')) || [];

        function compressImage(file, maxWidth, maxHeight, quality, callback) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let img = new Image();
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                    }
                    canvas.width = width; canvas.height = height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function createNewStore() {
            let name = document.getElementById('newStoreName').value.trim();
            let phone = document.getElementById('newStorePhone').value.trim();
            let bannerInput = document.getElementById('newStoreBanner');

            if (!name || !phone) {
                alert('દુકાનનું નામ અને નંબર ભરવો ફરજિયાત છે!');
                return;
            }

            let storeId = 'store_' + Date.now();
            let defaultBanner = 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=1000';

            if (bannerInput.files && bannerInput.files[0]) {
                compressImage(bannerInput.files[0], 800, 400, 0.7, function(compressedUrl) {
                    saveStoreObj(storeId, name, phone, compressedUrl);
                });
            } else {
                saveStoreObj(storeId, name, phone, defaultBanner);
            }
        }

        function saveStoreObj(id, name, phone, banner) {
            let newStore = { id, name, phone, banner, products: [] };
            stores.push(newStore);
            localStorage.setItem('kh_all_stores', JSON.stringify(stores));
            alert('નવી દુકાન સફળતાપૂર્વક ઉમેરાઈ ગઈ!');
            document.getElementById('newStoreName').value = '';
            document.getElementById('newStorePhone').value = '';
            document.getElementById('newStoreBanner').value = '';
            renderAllStores();
        }

        function renderAllStores() {
            let container = document.getElementById('allStoresContainer');
            container.innerHTML = '';

            if (stores.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-4 text-xs bg-gray-50 rounded-xl">હજુ સુધી કોઈ દુકાન ઉમેરી નથી.</p>`;
                return;
            }

            stores.forEach((s, storeIndex) => {
                let productsHTML = '';
                if (s.products && s.products.length > 0) {
                    s.products.forEach((p, pIndex) => {
                        productsHTML += `
                            <div class="flex justify-between items-center bg-white p-2 rounded border shadow-sm text-xs">
                                <div class="flex items-center space-x-2">
                                    <img src="${p.image}" class="w-8 h-8 object-cover rounded">
                                    <div>
                                        <p class="font-bold">${p.name}</p>
                                        <p class="text-gray-500">₹${p.price} | (${p.category})</p>
                                    </div>
                                </div>
                                <button onclick="deleteProduct('${s.id}', ${p.id})" class="text-red-600 font-bold px-2 py-1 bg-gray-50 border rounded">ડિલીટ</button>
                            </div>
                        `;
                    });
                } else {
                    productsHTML = `<p class="text-gray-400 text-xs text-center py-2">આ દુકાનમાં કોઈ પ્રોડક્ટ નથી.</p>`;
                }

                container.innerHTML += `
                    <div class="bg-gray-50 border p-4 rounded-xl space-y-3 shadow-sm">
                        <div class="flex justify-between items-center border-b pb-2">
                            <div>
                                <h4 class="font-bold text-base text-pink-600">${s.name}</h4>
                                <p class="text-xs text-gray-500">WhatsApp: ${s.phone}</p>
                            </div>
                            <button onclick="deleteStore('${s.id}')" class="bg-red-50 text-red-600 border border-red-200 px-3 py-1 rounded text-xs font-bold shadow-sm">દુકાન ડિલીટ કરો</button>
                        </div>

                        <!-- Add Product Form for this store -->
                        <form onsubmit="addProduct(event, '${s.id}')" class="space-y-2 bg-white p-3 rounded-lg border">
                            <h5 class="font-bold text-xs text-gray-700">આ દુકાનમાં નવી પ્રોડક્ટ ઉમેરો:</h5>
                            <input type="text" id="pName_${s.id}" required class="w-full border p-1.5 rounded text-xs" placeholder="પ્રોડક્ટનું નામ (દા.ત. Apple)">
                            <div class="grid grid-cols-2 gap-2">
                                <select id="pCat_${s.id}" class="border p-1.5 rounded text-xs">
                                    <option value="veg_fruit">Vegetables & Fruits</option>
                                    <option value="men">Men Clothing</option>
                                    <option value="women">Women Clothing</option>
                                    <option value="kids">Kids Clothing</option>
                                    <option value="footwear">Footwear</option>
                                    <option value="grocery">Grocery & Staples</option>
                                    <option value="beauty">Beauty & Personal Care</option>
                                    <option value="home">Home & Kitchen</option>
                                    <option value="electronics">Electronics</option>
                                    <option value="other">Other Items</option>
                                </select>
                                <input type="number" id="pPrice_${s.id}" required class="border p-1.5 rounded text-xs" placeholder="ભાવ (₹)">
                            </div>
                            <input type="text" id="pSize_${s.id}" class="w-full border p-1.5 rounded text-xs" placeholder="સાઈઝ / વજન ઓપ્શન (દા.ત. 250g, 500g, 1 Kg)">
                            <input type="file" id="pImage_${s.id}" accept="image/*" class="w-full border p-1.5 rounded text-xs bg-gray-50">
                            <button type="submit" class="w-full bg-gray-800 text-white font-bold py-1.5 rounded text-xs shadow">પ્રોડક્ટ ઉમેરો</button>
                        </form>

                        <!-- Products List -->
                        <div class="space-y-1.5 max-h-40 overflow-y-auto">
                            ${productsHTML}
                        </div>
                    </div>
                `;
            });
        }

        function addProduct(e, storeId) {
            e.preventDefault();
            let s = stores.find(item => item.id === storeId);
            if (!s) return;

            let name = document.getElementById(`pName_${storeId}`).value.trim();
            let category = document.getElementById(`pCat_${storeId}`).value;
            let price = parseFloat(document.getElementById(`pPrice_${storeId}`).value);
            let sizeOptions = document.getElementById(`pSize_${storeId}`).value.trim() || (category === 'veg_fruit' ? '250g, 500g, 1 Kg, 2 Kg' : 'Standard');
            let fileInput = document.getElementById(`pImage_${storeId}`);

            if (fileInput.files && fileInput.files[0]) {
                compressImage(fileInput.files[0], 500, 500, 0.7, function(compressedUrl) {
                    s.products.push({ id: Date.now(), category, name, price, sizeOptions, image: compressedUrl });
                    localStorage.setItem('kh_all_stores', JSON.stringify(stores));
                    renderAllStores();
                });
            } else {
                let defaultImg = 'https://images.unsplash.com/photo-1582281298055-e2f38a520443?w=500';
                s.products.push({ id: Date.now(), category, name, price, sizeOptions, image: defaultImg });
                localStorage.setItem('kh_all_stores', JSON.stringify(stores));
                renderAllStores();
            }
        }

        function deleteProduct(storeId, prodId) {
            let s = stores.find(item => item.id === storeId);
            if (s) {
                s.products = s.products.filter(p => p.id !== prodId);
                localStorage.setItem('kh_all_stores', JSON.stringify(stores));
                renderAllStores();
            }
        }

        function deleteStore(storeId) {
            if (confirm('શું તમે ખરેખર આ દુકાન ડિલીટ કરવા માંગો છો?')) {
                stores = stores.filter(s => s.id !== storeId);
                localStorage.setItem('kh_all_stores', JSON.stringify(stores));
                renderAllStores();
            }
        }

        renderAllStores();
    </script>
</body>
</html>
