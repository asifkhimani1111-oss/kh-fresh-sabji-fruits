<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh & Fashion — Smart Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f4faf4;color:#203326;font-family:Arial,sans-serif}
main{max-width:700px;margin:auto}
section{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
h2,h3{color:#168343;margin-top:0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#168343;color:white;border:0;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
.item-box{border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;background:#fafafa}
.item-box img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.admin-logo{width:90px;height:90px;object-fit:cover;border-radius:50%;border:3px solid #168343;box-shadow:0 4px 10px rgba(0,0,0,0.15);margin-bottom:8px}
.btn-group{display:flex;gap:5px;margin-top:5px}
</style>
</head>
<body>
<main>
<div style="text-align:center;background:linear-gradient(135deg, #e8f5e9, #c8e6c9);padding:20px;border-radius:12px;margin-bottom:14px;border:1px solid #a5d6a7;">
  <img src="logo-admin.jpg" alt="Admin Logo" class="admin-logo">
  <h2 style="color:#168343;margin:0;">🛠️ K.H Fresh એડમિન પેનલ</h2>
  <p style="color:#2e7d32;margin:5px 0 0 0;">દુકાનો અને પ્રોડક્ટ્સ મેનેજ કરો</p>
</div>

<!-- Shop Add / Edit Section -->
<section>
<h3 id="shopFormTitle">🏪 નવી દુકાન ઉમેરો</h3>
<input type="hidden" id="editShopId" value="">

<label>દુકાનનું નામ</label>
<input id="shopName" placeholder="દા.ત. K.H ફ્રેશ & સ્વીટ્સ">
<label>દુકાનદારનો WhatsApp નંબર (91 સાથે)</label>
<input id="shopWhatsapp" placeholder="91xxxxxxxxxx">

<button id="addShopBtn" style="background:#1b5e20;">દુકાન સેવ કરો</button>
<button id="cancelShopEditBtn" style="background:#6c757d;display:none;margin-top:5px;">દુકાન એડિટ કેન્સલ કરો</button>
</section>

<!-- Shops List (Edit / Delete) -->
<section>
<h3>📋 દુકાનોની યાદી (Edit / Delete)</h3>
<div id="adminShopsList">દુકાનો લોડ થઈ રહી છે...</div>
</section>

<!-- Product Add / Edit Section -->
<section>
<h3 id="prodFormTitle">➕ નવી પ્રોડક્ટ ઉમેરો</h3>
<input type="hidden" id="editProdId" value="">

<label>દુકાન પસંદ કરો</label>
<select id="prodShopSelect"><option value="">દુકાન લોડ થઈ રહી છે...</option></select>

<label>પ્રોડક્ટનું નામ</label>
<input id="prodName" placeholder="દા.ત. કાજુ કતરી / કોટન કાપડ / એપલ">

<label>કેટેગરી પસંદ કરો</label>
<select id="prodCategory">
  <option value="શાકભાજી">શાકભાજી</option>
  <option value="ફળો">ફળો</option>
  <option value="Ice Cream & Cold Drink">Ice Cream & Cold Drink</option>
  <option value="Mithai & Namkeen">Mithai & Namkeen</option>
  <option value="Women / Ladies">Women / Ladies</option>
  <option value="Men / Gents">Men / Gents</option>
  <option value="Big Boy">Big Boy</option>
  <option value="Big Girl">Big Girl</option>
  <option value="Children">Children</option>
  <option value="Baby Boy">Baby Boy</option>
  <option value="Baby Girl">Baby Girl</option>
  <option value="કરિયાણું">કરિયાણું</option>
  <option value="જનરલ સ્ટોર">જનરલ સ્ટોર</option>
</select>

<label>એકમ (Unit)</label>
<select id="prodUnit">
  <option value="કિલો (Kg)">કિલો (Kg)</option>
  <option value="ગ્રામ (Gram)">ગ્રામ (Gram)</option>
  <option value="મીટર (Meter)">મીટર (Meter)</option>
  <option value="લીટર (Liter)">લીટર (Liter)</option>
  <option value="ડઝન (Dozen)">ડઝન (Dozen)</option>
  <option value="પેકેટ">પેકેટ</option>
  <option value="નંગ (Piece)">નંગ (Piece)</option>
</select>

<label>ભાવ (₹ માં)</label>
<input id="prodPrice" type="number" placeholder="દા.ત. 100">

<label>📸 મોબાઈલ ગેલેરીમાંથી ફોટો પસંદ કરો</label>
<input type="file" id="prodImageFile" accept="image/*">
<input type="hidden" id="prodImageBase64">
<div id="imagePreview" style="margin:5px 0;"></div>

<label>ઉપલબ્ધ કલર (જો હોય તો)</label>
<input id="prodColors" placeholder="લાલ, લીલો, કાળો">

<label>ઉપલબ્ધ સાઈઝ (જો હોય તો)</label>
<input id="prodSizes" placeholder="S, M, L, XL">

<button id="addProdBtn">પ્રોડક્ટ લાઇવ કરો</button>
<button id="cancelProdEditBtn" style="background:#6c757d;display:none;margin-top:5px;">પ્રોડક્ટ એડિટ કેન્સલ કરો</button>
</section>

<!-- Products List (Edit / Delete) -->
<section>
<h3>📋 પ્રોડક્ટ્સની યાદી (Edit / Delete)</h3>
<div id="adminProductsList">પ્રોડક્ટ્સ લોડ થઈ રહી છે...</div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore, collection, addDoc, updateDoc, onSnapshot, deleteDoc, doc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",
 projectId:"kh-fresh-sabji-fruits",
 storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId:"815611229461",
 appId:"1:815611229461:web:ca713dc978e0997930251c",
 measurementId:"G-HBL4EVF1MN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let allShops = [];
let allProducts = [];

async function initAdmin() {
 // Gallery image compression & base64 converter
 $("prodImageFile").onchange = (e) => {
  const file = e.target.files[0];
  if(file) {
   const reader = new FileReader();
   reader.onload = (uploadEvent) => {
    const img = new Image();
    img.src = uploadEvent.target.result;
    img.onload = () => {
     const canvas = document.createElement('canvas');
     const ctx = canvas.getContext('2d');
     let width = img.width;
     let height = img.height;
     const maxDim = 400;
     if (width > height) {
      if (width > maxDim) { height *= maxDim / width; width = maxDim; }
     } else {
      if (height > maxDim) { width *= maxDim / height; height = maxDim; }
     }
     canvas.width = width;
     canvas.height = height;
     ctx.drawImage(img, 0, 0, width, height);
     const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
     
     $("prodImageBase64").value = compressedDataUrl;
     $("imagePreview").innerHTML = `<img src="${compressedDataUrl}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;">`;
    };
   };
   reader.readAsDataURL(file);
  }
 };

 // Listen Shops
 onSnapshot(collection(db, "shops"), snap => {
  allShops = snap.docs.map(d => ({id: d.id, ...d.data()}));
  updateShopDropdown();
  renderAdminShops();
 });

 // Listen Products
 onSnapshot(collection(db, "products"), snap => {
  allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
  renderAdminProducts();
 });

 // Add / Update Shop
 $("addShopBtn").onclick = async () => {
  const editId = $("editShopId").value;
  const name = $("shopName").value.trim();
  const whatsapp = $("shopWhatsapp").value.trim();
  if(!name || !whatsapp) {
   alert("દુકાનનું નામ અને WhatsApp નંબર ભરો!");
   return;
  }
  try {
   if(editId) {
    await updateDoc(doc(db, "shops", editId), { name, whatsapp });
    alert("દુકાન સફળતાપૂર્વક અપડેટ થઈ ગઈ!");
    resetShopForm();
   } else {
    await addDoc(collection(db, "shops"), { name, whatsapp });
    alert("દુકાન સફળતાપૂર્વક ઉમેરાઈ ગઈ!");
    $("shopName").value = "";
    $("shopWhatsapp").value = "";
   }
  } catch(err) {
   alert("ભૂલ આવી: " + err.message);
  }
 };

 $("cancelShopEditBtn").onclick = () => { resetShopForm(); };

 // Add / Update Product
 $("addProdBtn").onclick = async () => {
  const editId = $("editProdId").value;
  const shopId = $("prodShopSelect").value;
  const name = $("prodName").value.trim();
  const category = $("prodCategory").value;
  const unit = $("prodUnit").value;
  const price = parseFloat($("prodPrice").value);
  const imageUrl = $("prodImageBase64").value.trim();
  const colors = $("prodColors").value.trim();
  const sizes = $("prodSizes").value.trim();

  if(!shopId || !name || isNaN(price)) {
   alert("કૃપા કરીને દુકાન, પ્રોડક્ટનું નામ અને ભાવ સાચા ભરો!");
   return;
  }

  const productData = { shopId, name, category, unit, price, colors, sizes, active: true };
  if(imageUrl) productData.imageUrl = imageUrl;

  try {
   if(editId) {
    await updateDoc(doc(db, "products", editId), productData);
    alert("પ્રોડક્ટ સફળતાપૂર્વક અપડેટ થઈ ગઈ!");
    resetProdForm();
   } else {
    if(!imageUrl) {
     alert("કૃપા કરીને ગેલેરીમાંથી ફોટો પસંદ કરો!");
     return;
    }
    await addDoc(collection(db, "products"), productData);
    alert("પ્રોડક્ટ સફળતાપૂર્વક ઉમેરાઈ ગઈ!");
    resetProdForm();
   }
  } catch(err) {
   alert("પ્રોડક્ટ સેવ કરવામાં ભૂલ: " + err.message);
  }
 };

 $("cancelProdEditBtn").onclick = () => { resetProdForm(); };
}

function resetShopForm() {
 $("editShopId").value = "";
 $("shopName").value = "";
 $("shopWhatsapp").value = "";
 $("shopFormTitle").textContent = "🏪 નવી દુકાન ઉમેરો";
 $("addShopBtn").textContent = "દુકાન સેવ કરો";
 $("cancelShopEditBtn").style.display = "none";
}

function resetProdForm() {
 $("editProdId").value = "";
 $("prodName").value = "";
 $("prodPrice").value = "";
 $("prodColors").value = "";
 $("prodSizes").value = "";
 $("prodImageFile").value = "";
 $("prodImageBase64").value = "";
 $("imagePreview").innerHTML = "";
 $("prodFormTitle").textContent = "➕ નવી પ્રોડક્ટ ઉમેરો";
 $("addProdBtn").textContent = "પ્રોડક્ટ લાઇવ કરો";
 $("cancelProdEditBtn").style.display = "none";
}

function updateShopDropdown() {
 const shopSel = $("prodShopSelect");
 const currentSelected = shopSel.value;
 shopSel.replaceChildren();
 const defaultOpt = document.createElement("option");
 defaultOpt.value = "";
 defaultOpt.textContent = "દુકાન પસંદ કરો...";
 shopSel.append(defaultOpt);

 allShops.forEach(s => {
  const opt = document.createElement("option");
  opt.value = s.id;
  opt.textContent = s.name;
  shopSel.append(opt);
 });
 if(currentSelected) shopSel.value = currentSelected;
}

function renderAdminShops() {
 const host = $("adminShopsList");
 host.replaceChildren();
 if(allShops.length === 0) {
  host.textContent = "કોઈ દુકાન મળી નથી.";
  return;
 }

 allShops.forEach(s => {
  const item = document.createElement("div");
  item.className = "item-box";
  item.innerHTML = `
   <div>
    <strong style="font-size:15px;">${s.name}</strong><br>
    <span style="font-size:13px; color:#168343;">WhatsApp: ${s.whatsapp}</span>
   </div>
  `;

  const btnGroup = document.createElement("div");
  btnGroup.className = "btn-group";

  const editBtn = document.createElement("button");
  editBtn.textContent = "એડિટ";
  editBtn.style.cssText = "background:#ff9800; width:auto; padding:6px 10px; font-size:12px;";
  editBtn.onclick = () => {
   $("editShopId").value = s.id;
   $("shopName").value = s.name || "";
   $("shopWhatsapp").value = s.whatsapp || "";
   $("shopFormTitle").textContent = "✏️ દુકાન એડિટ કરો";
   $("addShopBtn").textContent = "દુકાનના સુધારા સેવ કરો";
   $("cancelShopEditBtn").style.display = "block";
   window.scrollTo({top: 0, behavior: 'smooth'});
  };

  const delBtn = document.createElement("button");
  delBtn.textContent = "ડિલીટ";
  delBtn.style.cssText = "background:#d32f2f; width:auto; padding:6px 10px; font-size:12px;";
  delBtn.onclick = async () => {
   if(confirm(`શું તમે "${s.name}" દુકાન ડિલીટ કરવા માંગો છો?`)) {
    await deleteDoc(doc(db, "shops", s.id));
   }
  };

  btnGroup.append(editBtn, delBtn);
  item.append(btnGroup);
  host.append(item);
 });
}

function renderAdminProducts() {
 const host = $("adminProductsList");
 host.replaceChildren();
 if(allProducts.length === 0) {
  host.textContent = "કોઈ પ્રોડક્ટ મળી નથી.";
  return;
 }

 allProducts.forEach(p => {
  const item = document.createElement("div");
  item.className = "item-box";
  const shopObj = allShops.find(s => s.id === p.shopId);
  
  item.innerHTML = `
   <div style="display:flex; gap:10px; align-items:center;">
    <img src="${p.imageUrl || 'https://via.placeholder.com/60'}" alt="">
    <div>
     <strong style="font-size:15px;">${p.name}</strong><br>
     <span style="font-size:13px; color:#168343;">₹${p.price} / ${p.unit}</span><br>
     <span style="font-size:11px; color:#666;">કેટેગરી: ${p.category} | દુકાન: ${shopObj ? shopObj.name : 'N/A'}</span>
    </div>
   </div>
  `;

  const btnGroup = document.createElement("div");
  btnGroup.className = "btn-group";

  const editBtn = document.createElement("button");
  editBtn.textContent = "એડિટ";
  editBtn.style.cssText = "background:#ff9800; width:auto; padding:6px 10px; font-size:12px;";
  editBtn.onclick = () => {
   $("editProdId").value = p.id;
   $("prodShopSelect").value = p.shopId || "";
   $("prodName").value = p.name || "";
   $("prodCategory").value = p.category || "શાકભાજી";
   $("prodUnit").value = p.unit || "કિલો (Kg)";
   $("prodPrice").value = p.price || "";
   $("prodColors").value = p.colors || "";
   $("prodSizes").value = p.sizes || "";
   if(p.imageUrl) {
    $("prodImageBase64").value = p.imageUrl;
    $("imagePreview").innerHTML = `<img src="${p.imageUrl}" style="width:80px;height:80px;object-fit:cover;border-radius:6px;">`;
   }
   $("prodFormTitle").textContent = "✏️ પ્રોડક્ટ એડિટ કરો";
   $("addProdBtn").textContent = "પ્રોડક્ટના સુધારા સેવ કરો";
   $("cancelProdEditBtn").style.display = "block";
   window.scrollTo({top: 400, behavior: 'smooth'});
  };

  const delBtn = document.createElement("button");
  delBtn.textContent = "ડિલીટ";
  delBtn.style.cssText = "background:#d32f2f; width:auto; padding:6px 10px; font-size:12px;";
  delBtn.onclick = async () => {
   if(confirm(`શું તમે "${p.name}" ડિલીટ કરવા માંગો છો?`)) {
    await deleteDoc(doc(db, "products", p.id));
   }
  };

  btnGroup.append(editBtn, delBtn);
  item.append(btnGroup);
  host.append(item);
 });
}

initAdmin();
</script>
</body>
</html>
