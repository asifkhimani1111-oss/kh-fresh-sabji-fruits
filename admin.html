
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.H Fresh Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f2;font-family:Arial,sans-serif;color:#233}
header{background:#087b43;color:white;padding:18px;text-align:center}
main{max-width:700px;margin:auto;padding:12px}
section{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 5px #0001}
h3{color:#087b43}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{background:#087b43;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.red{background:#c62828}
.blue{background:#1976d2}
.card{border:1px solid #ddd;padding:12px;border-radius:9px;margin:9px 0}
.note{font-size:13px;color:#666}
.green{background:#e8f5e9;padding:10px;border-radius:8px}
img.preview{width:110px;height:110px;object-fit:cover;display:none;border-radius:8px;margin:5px 0}
.productImage{width:110px;height:110px;object-fit:cover;border-radius:8px;display:block;margin:8px 0}
.progress{width:100%;height:12px;background:#ddd;border-radius:20px;overflow:hidden;display:none;margin:10px 0}
.bar{height:100%;width:0;background:#087b43;transition:width .2s}
.message{padding:11px;border-radius:8px;margin:8px 0;display:none;overflow-wrap:anywhere}
.ok{display:block;background:#e8f5e9;color:#087b43}
.err{display:block;background:#ffebee;color:#b71c1c}
.photoFallback{background:#eee;color:#666;padding:20px;text-align:center;border-radius:8px;width:110px;margin:8px 0}
</style>
</head>
<body>
<header>
<h2>K.H Fresh – Admin Panel</h2>
<p>દુકાન અને પ્રોડક્ટ મેનેજમેન્ટ</p>
</header>
<main>
<section>
<h3>🔐 Admin Login</h3>
<input id="adminEmail" type="email" placeholder="Admin Email">
<input id="adminPassword" type="password" placeholder="Password">
<button id="loginBtn">Admin Login</button>
<button id="logoutBtn" class="red" style="display:none">Logout</button>
<p id="loginMsg" class="note"></p>
</section>

<div id="adminArea" style="display:none">
<section>
<h3>🏪 નવી દુકાન ઉમેરો</h3>
<input id="shopName" placeholder="દુકાનનું નામ">
<input id="shopWhatsApp" placeholder="WhatsApp નંબર (91 સાથે)">
<button id="saveShop">દુકાન ઉમેરો</button>
<p id="shopMsg" class="note"></p>
</section>

<section>
<h3>દુકાન પસંદ કરો</h3>
<select id="shopSelect"></select>
<div id="shopInfo"></div>
</section>

<section>
<h3>➕ નવી પ્રોડક્ટ ઉમેરો</h3>
<input id="productName" placeholder="પ્રોડક્ટનું નામ">
<input id="price" type="number" min="0" step="0.01" placeholder="ભાવ ₹">
<select id="unit">
<option>કિલો (Kg)</option><option>ગ્રામ (Gram)</option>
<option>નંગ (Pcs)</option><option>ડઝન (Dozen)</option>
<option>લિટર</option><option>મિલીલીટર</option>
<option>પેકેટ</option><option>બોક્સ</option>
<option>જોડી</option><option>મીટર</option>
<option>સેટ</option><option>બીજું</option>
</select>
<input id="category" list="categoryList" placeholder="કેટેગરી">
<datalist id="categoryList">
<option value="શાકભાજી"><option value="ફળો">
<option value="કપડાં - લેડીઝ"><option value="કપડાં - જેન્ટ્સ">
<option value="ફૂટવેર"><option value="મોબાઇલ">
<option value="ઇલેક્ટ્રોનિક્સ"><option value="કરિયાણું">
<option value="કટલરી"><option value="ઘરવખરી"><option value="અન્ય">
</datalist>
<input id="sizes" placeholder="સાઇઝ (7, 8, M, L)">
<input id="colors" placeholder="કલર (Black, Red)">
<input id="design" placeholder="ડિઝાઇન / મોડેલ">
<label><b>📷 પ્રોડક્ટ ફોટો પસંદ કરો</b></label>
<input id="photo" type="file" accept="image/*">
<img id="preview" class="preview" alt="ફોટો પ્રિવ્યુ">
<div class="progress" id="progress"><div class="bar" id="bar"></div></div>
<p id="uploadText" class="note"></p>
<div id="productMsg" class="message"></div>
<button id="addProduct">પ્રોડક્ટ ઉમેરો</button>
</section>

<section>
<h3>📦 દુકાનની પ્રોડક્ટ અને હિસાબ</h3>
<div id="products"></div>
</section>

<section>
<h3>💰 માસિક પ્લાન અને રોકડ પેમેન્ટ</h3>
<div id="billing" class="green">દુકાન પસંદ કરો.</div><br>
<label><input id="cashReceived" type="checkbox" style="width:auto"> રોકડ પેમેન્ટ મળી ગયું છે.</label>
<button id="activatePlan" class="blue">OK – પ્લાન 30 દિવસ માટે ON કરો</button>
<button id="deactivatePlan" class="red">દુકાન OFF કરો</button>
<p id="planMsg" class="note"></p>
</section>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getFirestore,collection,addDoc,getDocs,query,where,
 doc,updateDoc,deleteDoc,serverTimestamp,Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
 getStorage,ref,uploadBytesResumable,getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",
 projectId:"kh-fresh-sabji-fruits",
 storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId:"815611229461",
 appId:"1:815611229461:web:ca713dc978e0997930251c",
 measurementId:"G-HBL4EVF1MN"
};

const ADMIN_UID="bzMpXfz6ltVVB7GcWHWh0ok7XbO2";
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const storage=getStorage(app);
const auth=getAuth(app);
const $=id=>document.getElementById(id);

let shops=[];
let selectedShop=null;
let resizedImageBlob=null;
let busy=false;

function msg(id,text,type="ok"){
 const el=$(id);
 el.textContent=text;
 el.className="message "+type;
}
function setProgress(percent,text){
 $("progress").style.display="block";
 $("bar").style.width=percent+"%";
 $("uploadText").textContent=text;
}
function requireAdmin(){
 if(!auth.currentUser||auth.currentUser.uid!==ADMIN_UID)
  throw new Error("આ સુવિધા ફક્ત Admin માટે છે.");
}
function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function clearProductForm(){
 ["productName","price","category","sizes","colors","design"].forEach(id=>$(id).value="");
 $("photo").value="";
 $("preview").removeAttribute("src");
 $("preview").style.display="none";
 resizedImageBlob=null;
}
function showProductImage(container,url,name){
 if(!url)return;
 const img=document.createElement("img");
 img.className="productImage";
 img.alt=name||"Product";
 img.loading="lazy";
 img.src=url;
 img.onerror=()=>{
  const fallback=document.createElement("div");
  fallback.className="photoFallback";
  fallback.textContent="ફોટો લોડ થયો નથી";
  img.replaceWith(fallback);
 };
 container.append(img);
}

onAuthStateChanged(auth,user=>{
 const allowed=!!user&&user.uid===ADMIN_UID;
 $("adminArea").style.display=allowed?"block":"none";
 $("loginBtn").style.display=allowed?"none":"block";
 $("logoutBtn").style.display=allowed?"block":"none";
 if(user&&!allowed){
  $("loginMsg").textContent="આ એકાઉન્ટ Admin નથી.";
  signOut(auth);
  return;
 }
 if(allowed){
  $("loginMsg").textContent="Admin Login સફળ થયું.";
  loadShops();
 }
});

$("loginBtn").onclick=async()=>{
 try{
  const email=$("adminEmail").value.trim();
  const password=$("adminPassword").value;
  if(!email||!password)throw new Error("Email અને Password ભરો.");
  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){$("loginMsg").textContent="Login Error: "+e.message;}
};
$("logoutBtn").onclick=()=>signOut(auth);

async function loadShops(){
 try{
  requireAdmin();
  const snap=await getDocs(collection(db,"shops"));
  shops=snap.docs.map(d=>({id:d.id,...d.data()}));
  $("shopSelect").replaceChildren();
  shops.forEach(s=>{
   const op=document.createElement("option");
   op.value=s.id;
   op.textContent=(s.name||"દુકાન")+" ("+(s.planActive?"ON":"OFF")+")";
   $("shopSelect").append(op);
  });
  if(!shops.length){
   selectedShop=null;
   $("shopInfo").textContent="હજી દુકાન નથી.";
   $("products").replaceChildren();
   $("billing").textContent="દુકાન ઉમેરો.";
   return;
  }
  const oldId=selectedShop?.id;
  $("shopSelect").value=shops.some(s=>s.id===oldId)?oldId:shops[0].id;
  await selectShop();
 }catch(e){
  console.error(e);
  $("shopMsg").textContent=e.message;
 }
}
$("shopSelect").onchange=selectShop;

async function selectShop(){
 requireAdmin();
 const id=$("shopSelect").value;
 selectedShop=shops.find(s=>s.id===id)||null;
 if(selectedShop)await loadProducts();
}

$("saveShop").onclick=async()=>{
 try{
  requireAdmin();
  const name=$("shopName").value.trim();
  const whatsapp=$("shopWhatsApp").value.trim().replace(/\D/g,"");
  if(!name||!whatsapp)throw new Error("દુકાનનું નામ અને WhatsApp નંબર ભરો.");
  const shopRef=await addDoc(collection(db,"shops"),{
   name,whatsapp,planActive:false,registrationFeePaid:false,
   createdAt:serverTimestamp(),updatedAt:serverTimestamp()
  });
  $("shopName").value="";
  $("shopWhatsApp").value="";
  $("shopMsg").textContent="દુકાન સફળતાપૂર્વક ઉમેરાઈ ગઈ!";
  await loadShops();
  $("shopSelect").value=shopRef.id;
  await selectShop();
 }catch(e){$("shopMsg").textContent="Error: "+e.message;}
};

// ફોટો પસંદ કરતાં નાનો અને હળવો બનાવે છે
$("photo").onchange=async e=>{
 const file=e.target.files[0];
 resizedImageBlob=null;
 $("preview").style.display="none";
 if(!file)return;
 try{
  if(!file.type.startsWith("image/"))throw new Error("ફક્ત ફોટો પસંદ કરો.");
  msg("productMsg","ફોટો તૈયાર થઈ રહ્યો છે...");
  const objectUrl=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
   URL.revokeObjectURL(objectUrl);
   const canvas=document.createElement("canvas");
   const scale=Math.min(1,600/Math.max(img.width,img.height));
   canvas.width=Math.round(img.width*scale);
   canvas.height=Math.round(img.height*scale);
   canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
   $("preview").src=canvas.toDataURL("image/jpeg",0.7);
   $("preview").style.display="block";
   canvas.toBlob(blob=>{
    if(!blob){msg("productMsg","ફોટો તૈયાર થઈ શક્યો નથી.","err");return;}
    resizedImageBlob=blob;
    msg("productMsg","ફોટો તૈયાર છે. હવે પ્રોડક્ટ ઉમેરો.");
   },"image/jpeg",0.7);
  };
  img.onerror=()=>{
   URL.revokeObjectURL(objectUrl);
   msg("productMsg","ફોટો ખોલી શકાયો નથી.","err");
  };
  img.src=objectUrl;
 }catch(e){msg("productMsg",e.message,"err");}
};

// પ્રોડક્ટ સેવ, ફોટો Upload, URL Firestoreમાં સેવ
$("addProduct").onclick=async()=>{
 if(busy)return;
 const btn=$("addProduct");
 let productRef=null;
 try{
  requireAdmin();
  if(!selectedShop)throw new Error("પહેલાં દુકાન પસંદ કરો.");
  const name=$("productName").value.trim();
  const price=Number($("price").value);
  const category=$("category").value.trim();
  const unit=$("unit").value;
  const imageBlob=resizedImageBlob;
  if(!name||!category||$("price").value===""||!Number.isFinite(price)||price<0)
   throw new Error("પ્રોડક્ટનું નામ, કેટેગરી અને યોગ્ય ભાવ ભરો.");
  if($("photo").files.length&&!imageBlob)
   throw new Error("ફોટો તૈયાર થાય ત્યાં સુધી રાહ જુઓ.");

  busy=true;btn.disabled=true;
  btn.textContent="પ્રોડક્ટ સેવ થઈ રહી છે...";
  msg("productMsg","પ્રોડક્ટની વિગતો સેવ થઈ રહી છે...");
  productRef=await addDoc(collection(db,"products"),{
   name,price,unit,category,imageUrl:"",
   sizes:$("sizes").value.trim(),
   colors:$("colors").value.trim(),
   design:$("design").value.trim(),
   shopId:selectedShop.id,active:true,
   createdAt:serverTimestamp()
  });

  if(imageBlob){
   msg("productMsg","પ્રોડક્ટ સેવ થઈ ગઈ. હવે ફોટો અપલોડ થઈ રહ્યો છે.");
   const imageRef=ref(storage,"products/"+productRef.id+".jpg");
   const task=uploadBytesResumable(imageRef,imageBlob,{contentType:"image/jpeg"});
   const url=await new Promise((resolve,reject)=>{
    task.on("state_changed",snapshot=>{
     const percent=Math.round(snapshot.bytesTransferred/snapshot.totalBytes*100);
     setProgress(percent,"📤 ફોટો અપલોડ: "+percent+"%");
     btn.textContent="ફોટો અપલોડ: "+percent+"%";
    },reject,async()=>{
     try{resolve(await getDownloadURL(task.snapshot.ref));}
     catch(error){reject(error);}
    });
   });
   await updateDoc(doc(db,"products",productRef.id),{
    imageUrl:url,photoUploadedAt:serverTimestamp()
   });
  }

  clearProductForm();
  await loadProducts();
  if(imageBlob){
   setProgress(100,"100% અપલોડ પૂર્ણ");
   msg("productMsg","✅ ફોટો Upload થયો અને તેની URL સેવ થઈ ગઈ. હવે Admin અને ગ્રાહકોની એપમાં દેખાવવો જોઈએ.");
  }else{
   msg("productMsg","✅ પ્રોડક્ટ સફળતાપૂર્વક ઉમેરાઈ ગઈ!");
  }
 }catch(e){
  console.error(e);
  msg("productMsg","ભૂલ: "+e.message+(productRef?" પ્રોડક્ટ સેવ થઈ ગઈ હોઈ શકે; ફોટો ફરી તપાસો.":""),"err");
  if(productRef)await loadProducts();
 }finally{
  busy=false;btn.disabled=false;btn.textContent="પ્રોડક્ટ ઉમેરો";
 }
};

async function loadProducts(){
 if(!selectedShop)return;
 requireAdmin();
 try{
  const snap=await getDocs(query(collection(db,"products"),where("shopId","==",selectedShop.id)));
  const count=snap.size;
  const end=selectedShop.planEndAt?.toDate?selectedShop.planEndAt.toDate():null;
  let isActive=!!selectedShop.planActive;
  if(isActive&&end&&end<=new Date()){
   isActive=false;
   await updateDoc(doc(db,"shops",selectedShop.id),{planActive:false});
   selectedShop.planActive=false;
  }
  $("shopInfo").innerHTML="<p><b>"+safe(selectedShop.name)+"</b></p><p>WhatsApp: "+safe(selectedShop.whatsapp)+"</p>";
  $("billing").innerHTML="કુલ પ્રોડક્ટ: <b>"+count+"</b><br>માસિક ચાર્જ: ₹"+(count*2)+" ("+count+" × ₹2)<br>દુકાનની સ્થિતિ: <b>"+(isActive?"🟢 ON":"🔴 OFF")+"</b>"+(end?"<br>પ્લાનની છેલ્લી તારીખ: "+end.toLocaleDateString("en-IN"):"<br>હજુ પ્લાન શરૂ થયો નથી.");
  $("cashReceived").checked=false;
  $("products").replaceChildren();

  snap.forEach(d=>{
   const p=d.data();
   const div=document.createElement("div");div.className="card";
   const title=document.createElement("b");
   title.textContent=(p.name||"પ્રોડક્ટ")+" — ₹"+p.price+" / "+(p.unit||"");
   const detail=document.createElement("p");
   detail.textContent=(p.category||"")+" | સાઇઝ: "+(p.sizes||"લાગુ નથી")+" | કલર: "+(p.colors||"લાગુ નથી")+" | ડિઝાઇન: "+(p.design||"લાગુ નથી");
   div.append(title,detail);
   if(p.imageUrl)showProductImage(div,p.imageUrl,p.name);
   else{
    const pending=document.createElement("p");
    pending.textContent="📷 આ પ્રોડક્ટનો ફોટો ઉમેરેલો નથી.";
    div.append(pending);
   }

   const edit=document.createElement("button");
   edit.textContent="ભાવ / નામ બદલો";
   edit.onclick=async()=>{
    try{
     requireAdmin();
     const n=prompt("પ્રોડક્ટનું નામ",p.name);if(n===null)return;
     const v=prompt("નવો ભાવ",p.price);if(v===null)return;
     if(!n.trim()||!Number.isFinite(Number(v))||Number(v)<0)return alert("માહિતી ખોટી છે.");
     await updateDoc(doc(db,"products",d.id),{name:n.trim(),price:Number(v)});
     await loadProducts();
    }catch(e){alert(e.message);}
   };

   const del=document.createElement("button");
   del.textContent="પ્રોડક્ટ ડિલીટ";del.className="red";
   del.onclick=async()=>{
    try{
     requireAdmin();
     if(confirm((p.name||"પ્રોડક્ટ")+" ડિલીટ કરવી છે?")){
      await deleteDoc(doc(db,"products",d.id));
      await loadProducts();
     }
    }catch(e){alert(e.message);}
   };
   div.append(edit,del);
   $("products").append(div);
  });
 }catch(e){
  console.error(e);
  $("products").textContent="પ્રોડક્ટ લોડ થઈ શકી નથી: "+e.message;
 }
}

$("activatePlan").onclick=async()=>{
 try{
  requireAdmin();
  if(!selectedShop)throw new Error("દુકાન પસંદ કરો.");
  const snap=await getDocs(query(collection(db,"products"),where("shopId","==",selectedShop.id)));
  const count=snap.size;
  if(count<1)throw new Error("પ્લાન ચાલુ કરવા માટે ઓછામાં ઓછી ૧ પ્રોડક્ટ હોવી જોઈએ.");
  if(!$("cashReceived").checked)throw new Error("રોકડ પેમેન્ટ મળ્યાની ખાતરી કરો.");
  const start=new Date(),end=new Date(start.getTime()+30*24*60*60*1000);
  await updateDoc(doc(db,"shops",selectedShop.id),{
   planActive:true,registrationFeePaid:true,
   planStartAt:Timestamp.fromDate(start),planEndAt:Timestamp.fromDate(end),
   monthlyAmount:count*2,updatedAt:serverTimestamp()
  });
  $("planMsg").textContent="દુકાન 30 દિવસ માટે સફળતાપૂર્વક ON થઈ ગઈ!";
  await loadShops();
 }catch(e){$("planMsg").textContent="Error: "+e.message;}
};

$("deactivatePlan").onclick=async()=>{
 try{
  requireAdmin();
  if(!selectedShop)throw new Error("દુકાન પસંદ કરો.");
  await updateDoc(doc(db,"shops",selectedShop.id),{planActive:false,updatedAt:serverTimestamp()});
  $("planMsg").textContent="દુકાન બંધ કરી દેવામાં આવી છે.";
  await loadShops();
 }catch(e){$("planMsg").textContent="Error: "+e.message;}
};
</script>
</body>
