<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard - K.H Fresh</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f4faf4;color:#203326;font-family:Arial,sans-serif}
main{max-width:700px;margin:auto}
section{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
h2,h3{color:#168343;margin-top:0}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#168343;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
button.danger{background:#b3261e}
button.secondary{background:#456}
small{color:#555}
.item-card{border:1px solid #ddd;border-radius:8px;padding:10px;margin:10px 0;background:#fafafa}
.item-card img{width:80px;height:80px;object-fit:cover;border-radius:8px;display:block;margin:6px 0}
.row{display:flex;gap:10px;align-items:center}
.row button{width:auto;flex:1}
#app{display:none}
#preview{display:none;max-width:150px;max-height:150px;object-fit:cover;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<main>
<h2>🥬 K.H Fresh - Admin Dashboard 🍉</h2>
<p>દુકાનો અને પ્રોડક્ટ્સ મેનેજ કરો</p>

<!-- લૉગિન સેક્શન -->
<section id="login">
<h3>Admin Login</h3>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin Email" required autocomplete="username">
<input id="password" type="password" placeholder="Password" required autocomplete="current-password">
<button type="submit">Login કરો</button>
</form>
<p id="loginMsg" role="status"></p>
</section>

<!-- એડમિન એપ્લિકેશન પૅનલ -->
<div id="app">
<div style="text-align:right; margin-bottom:10px;">
<button id="logout" class="secondary" style="width:auto; padding:8px 16px;">Logout</button>
</div>

<!-- ૧. દુકાન ઉમેરવા કે મેનેજ કરવાનું ફોર્મ -->
<section>
<h3>🏪 નવી દુકાન ઉમેરો / સુધારો</h3>
<form id="shopForm">
<input id="shopId" type="hidden">
<label>દુકાનનું નામ</label>
<input id="shopName" required placeholder="દા.ત. K.H Fresh Sabji">
<label>દુકાનનો પ્રકાર</label>
<select id="shopType">
<option value="શાકભાજી અને ફળો">શાકભાજી અને ફળો</option>
<option value="કરિયાણું">કરિયાણું</option>
<option value="જનરલ સ્ટોર">જનરલ સ્ટોર</option>
</select>
<label>દુકાનદારનો WhatsApp નંબર (ઓર્ડર મેળવવા માટે)</label>
<input id="shopWhatsapp" type="tel" required placeholder="દા.ત. 919876543210">
<button type="submit">દુકાન સેવ કરો</button>
<p id="shopMsg"></p>
</form>

<h4 style="margin-top:20px;">હાલની દુકાનો:</h4>
<div id="shopsList">દુકાનો લોડ થઈ રહી છે...</div>
</section>

<!-- ૨. પ્રોડક્ટ ઉમેરવા કે મેનેજ કરવાનું ફોર્મ -->
<section>
<h3>📦 પ્રોડક્ટ અને ભાવ મેનેજ કરો</h3>
<form id="productForm">
<input id="productId" type="hidden">

<label>કઈ દુકાન માટે પ્રોડક્ટ છે?</label>
<select id="productShopSelect" required><option value="">દુકાન પસંદ કરો</option></select>

<label>પ્રોડક્ટનું નામ</label>
<input id="name" required placeholder="દા.ત. બટાકા, ડુંગળી">

<label>ભાવ (₹)</label>
<input id="price" type="number" min="0" step="0.01" required placeholder="દા.ત. 40">

<label>કેટેગરી</label>
<select id="category">
<option value="શાકભાજી">શાકભાજી</option>
<option value="ફળો">ફળો</option>
<option value="કરિયાણું">કરિયાણું</option>
<option value="જનરલ સ્ટોર">જનરલ સ્ટોર</option>
</select>

<label>એકમ</label>
<select id="unit">
<option value="કિલો">કિલો</option>
<option value="નંગ">નંગ</option>
<option value="પેકેટ">પેકેટ</option>
</select>

<label for="imageFile">મોબાઇલ Gallery માંથી ફોટો પસંદ કરો</label>
<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp">
<img id="preview" alt="ફોટો ప్రిવ્યુ">
<p id="uploadMsg"></p>

<label>અથવા ફોટો URL નાખો</label>
<input id="imageUrl" type="url" placeholder="https://...">

<label>ગ્રાહકોને બતાવવી છે?</label>
<select id="active">
<option value="true">હા</option>
<option value="false">ના (છુપાવો)</option>
</select>

<button type="submit" id="saveButton">પ્રોડક્ટ સેવ કરો</button>
<p id="saveMsg"></p>
</form>

<h4 style="margin-top:20px;">હાલની પ્રોડક્ટ્સ:</h4>
<div id="productsList">પ્રોડક્ટ્સ લોડ થઈ રહી છે...</div>
</section>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore, collection, onSnapshot, addDoc, doc, setDoc, deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain:"kh-fresh-sabji-fruits.firebaseapp.com",
 projectId:"kh-fresh-sabji-fruits",
 storageBucket:"kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId:"815611229461",
 appId:"1:815611229461:web:ca713dc978e0997930251c",
 measurementId:"G-HBL4EVF1MN"
};

const ADMIN_UID = "bzMpXfz6ltVVB7GcWHWh0ok7XbO2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let loadedShops = [];
let base64Image = "";

$("loginForm").addEventListener("submit", async e => {
 e.preventDefault();
 $("loginMsg").textContent = "Login થઈ રહ્યું છે...";
 try {
  await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  $("loginMsg").textContent = "";
 } catch(err) {
  $("loginMsg").textContent = "Login ન થયું: " + err.message;
 }
});

onAuthStateChanged(auth, async user => {
 if(user) {
  if(user.uid !== ADMIN_UID) {
   alert("તમને એડમિન એક્સેસ નથી!");
   await signOut(auth);
   return;
  }
  $("login").style.display = "none";
  $("app").style.display = "block";
  initAdminData();
 } else {
  $("login").style.display = "block";
  $("app").style.display = "none";
 }
});

$("logout").addEventListener("click", () => signOut(auth));

// ગેલેરીમાંથી ફોટો સિલેક્ટ કરીને તેને Base64 માં કન્વર્ટ કરવા માટે
$("imageFile").addEventListener("change", function(e) {
 const file = e.target.files[0];
 if(!file) return;

 if(file.size > 1024 * 1024) { // 1MB કરતા નાનો ફોટો સારો રહે
  $("uploadMsg").textContent = "ફોટો 1 MB કરતા નાનો હોવો જોઈએ.";
  return;
 }

 const reader = new FileReader();
 reader.onload = function(uploadEvent) {
  base64Image = uploadEvent.target.result;
  $("imageUrl").value = base64Image; // URL ફીલ્ડમાં આપમેળે ભરાઈ જશે
  $("preview").src = base64Image;
  $("preview").style.display = "block";
  $("uploadMsg").textContent = "ફોટો સફળતાપૂર્વક લોડ થઈ ગયો છે!";
 };
 reader.readAsDataURL(file);
});

function initAdminData() {
 onSnapshot(collection(db, "shops"), snap => {
  loadedShops = snap.docs.map(d => ({id: d.id, ...d.data()}));
  const shopSel = $("productShopSelect");
  shopSel.replaceChildren(document.createElement("option"));
  shopSel.children[0].value = "";
  shopSel.children[0].textContent = "દુકાન પસંદ કરો";

  const host = $("shopsList");
  host.replaceChildren();

  if(loadedShops.length === 0) {
   host.textContent = "હજી કોઈ દુકાન નથી.";
  }

  loadedShops.forEach(s => {
   const opt = document.createElement("option");
   opt.value = s.id;
   opt.textContent = s.name;
   shopSel.append(opt);

   const card = document.createElement("div");
   card.className = "item-card";
   card.innerHTML = `<strong>${s.name}</strong><br><small>પ્રકાર: ${s.type || ''} | WhatsApp: ${s.whatsapp || ''}</small>`;
   
   const delBtn = document.createElement("button");
   delBtn.className = "danger";
   delBtn.textContent = "દુકાન કાઢી નાખો";
   delBtn.style.marginTop = "6px";
   delBtn.onclick = async () => {
    if(confirm("આ દુકાન ડિલીટ કરવી છે?")) {
     await deleteDoc(doc(db, "shops", s.id));
    }
   };
   card.append(delBtn);
   host.append(card);
  });
 });

 onSnapshot(collection(db, "products"), snap => {
  const host = $("productsList");
  host.replaceChildren();

  if(snap.empty) {
   host.textContent = "હજી કોઈ પ્રોડક્ટ નથી.";
   return;
  }

  snap.forEach(item => {
   const p = item.data();
   const shopObj = loadedShops.find(s => s.id === p.shopId);
   const card = document.createElement("div");
   card.className = "item-card";
   
   card.innerHTML = `
    <strong>${p.name}</strong> — ₹${p.price} / ${p.unit}
    <br><small>દુકાન: ${shopObj ? shopObj.name : 'મુખ્ય દુકાન'} | કેટેગરી: ${p.category}</small>
   `;

   const del = document.createElement("button");
   del.className = "danger";
   del.textContent = "Delete";
   del.style.marginTop = "6px";
   del.onclick = async () => {
    if(confirm("આ પ્રોડક્ટ ડિલીટ કરવી છે?")) {
     await deleteDoc(doc(db, "products", item.id));
    }
   };
   card.append(del);
   host.append(card);
  });
 });
}

$("shopForm").addEventListener("submit", async e => {
 e.preventDefault();
 try {
  const shopData = {
   name: $("shopName").value.trim(),
   type: $("shopType").value,
   whatsapp: $("shopWhatsapp").value.trim(),
   active: true
  };
  await addDoc(collection(db, "shops"), shopData);
  $("shopMsg").textContent = "દુકાન સફળતાપૂર્વક ઉમેરાઈ ગઈ!";
  $("shopForm").reset();
 } catch(err) {
  $("shopMsg").textContent = "ભૂલ: " + err.message;
 }
});

$("productForm").addEventListener("submit", async e => {
 e.preventDefault();
 try {
  const finalImageUrl = $("imageUrl").value.trim() || base64Image;

  const productData = {
   shopId: $("productShopSelect").value,
   name: $("name").value.trim(),
   price: Number($("price").value),
   category: $("category").value,
   unit: $("unit").value,
   imageUrl: finalImageUrl,
   active: $("active").value === "true"
  };

  const id = $("productId").value;
  if(id) {
   await setDoc(doc(db, "products", id), productData, {merge: true});
  } else {
   await addDoc(collection(db, "products"), productData);
  }

  $("saveMsg").textContent = "પ્રોડક્ટ સફળતાપૂર્વક સેવ થઈ ગઈ!";
  $("productForm").reset();
  $("productId").value = "";
  base64Image = "";
  $("preview").style.display = "none";
  $("uploadMsg").textContent = "";
 } catch(err) {
  $("saveMsg").textContent = "ભૂલ: " + err.message;
 }
});
</script>
</body>
</html>
