<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.H Fresh - Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap');
        body { font-family: 'Noto Sans Gujarati', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4">

    <div class="max-w-xl mx-auto bg-white p-5 rounded-2xl shadow-md">
        <h2 class="text-xl font-bold text-pink-600 mb-4 border-b pb-2"><i class="fa-solid fa-gear"></i> Seller Panel (દુકાન સેટિંગ્સ)</h2>
        
        <div class="mb-3">
            <label class="block text-xs font-bold mb-1 text-gray-600">WhatsApp નંબર (દા.ત. 919876543210):</label>
            <input type="text" id="whatsappNumber" class="w-full border p-2 rounded-lg text-sm" placeholder="919876543210">
        </div>

        <div class="mb-4">
            <label class="block text-xs font-bold mb-1 text-gray-600">દુકાનનું નામ:</label>
            <input type="text" id="inputStoreName" class="w-full border p-2 rounded-lg text-sm" placeholder="K.H Fresh">
        </div>
        <button onclick="saveStoreSettings()" class="w-full bg-gray-800 text-white font-bold py-2 rounded-lg text-xs mb-6 shadow">સેટિંગ્સ સેવ કરો</button>

        <h3 class="text-base font-bold mb-3 text-gray-800 border-t pt-3">નવી પ્રોડક્ટ ઉમેરો:</h3>
        <form id="productForm" onsubmit="addProduct(event)" class="space-y-3">
            <div>
                <label class="block text-xs font-bold mb-1 text-gray-600">પ્રોડક્ટનું નામ:</label>
                <input type="text" id="pName" required class="w-full border p-2 rounded text-sm" placeholder="દા.ત. તાજા ટમેટા / શર્ટ">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">કેટેગરી (ફક્ત ૨ વિકલ્પો):</label>
                    <select id="pCategory" class="w-full border p-2 rounded text-sm">
                        <option value="veg_fruit">Vegetables & Fruits</option>
                        <option value="other">Fashion & Other Items</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">ભાવ (₹):</label>
                    <input type="number" id="pPrice" required class="w-full border p-2 rounded text-sm" placeholder="₹ ભાવ">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">માપ/વજન વિકલ્પ:</label>
                    <input type="text" id="pSize" required class="w-full border p-2 rounded text-sm" placeholder="દા.ત. 1 Kg અથવા M Size">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">વજન ગ્રામમાં (શાકભાજી માટે):</label>
                    <input type="number" step="0.1" id="pWeightKg" class="w-full border p-2 rounded text-sm" placeholder="દા.ત. 0.2 અથવા 1.0">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 text-gray-600">ફોટો અપલોડ કરો (Gallery/Camera):</label>
                <input type="file" id="pImageFile" accept="image/*" class="w-full border p-2 rounded text-sm bg-gray-50">
            </div>
            <button type="submit" class="w-full bg-pink-600 text-white font-bold py-2.5 rounded-lg hover:bg-pink-700 shadow text-sm">પ્રોડક્ટ ઉમેરો</button>
        </form>

        <div class="mt-6">
            <h3 class="font-bold text-sm mb-2">પ્રોડક્ટ્સ મેનેજ કરો:</h3>
            <div id="sellerProductList" class="space-y-2 max-h-48 overflow-y-auto border p-2 rounded text-xs"></div>
        </div>
    </div>

    <!-- Script -->
    <script>
        let products = JSON.parse(localStorage.getItem('kh_products')) || [];
        let whatsappNum = localStorage.getItem('kh_whatsapp') || '919876543210';
        let storeName = localStorage.getItem('kh_storename') || 'K.H Fresh';

        document.getElementById('whatsappNumber').value = whatsappNum;
        document.getElementById('inputStoreName').value = storeName;

        function saveStoreSettings() {
            whatsappNum = document.getElementById('whatsappNumber').value;
            storeName = document.getElementById('inputStoreName').value;
            localStorage.setItem('kh_whatsapp', whatsappNum);
            localStorage.setItem('kh_storename', storeName);
            alert('સેટિંગ્સ સેવ થઈ ગઈ!');
        }

        function addProduct(e) {
            e.preventDefault();
            let name = document.getElementById('pName').value;
            let category = document.getElementById('pCategory').value;
            let price = parseFloat(document.getElementById('pPrice').value);
            let size = document.getElementById('pSize').value;
            let weightKg = parseFloat(document.getElementById('pWeightKg').value) || 0;
            let fileInput = document.getElementById('pImageFile');

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let image = e.target.result;
                    saveNewProduct(name, category, price, size, weightKg, image);
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                let image = 'https://images.unsplash.com/photo-1582281298055-e2f38a520443?w=500';
                saveNewProduct(name, category, price, size, weightKg, image);
            }
        }

        function saveNewProduct(name, category, price, size, weightKg, image) {
            let newP = { id: Date.now(), category, name, price, originalPrice: Math.round(price * 1.3), size, weightKg, rating: 4.7, reviews: 10, image };
            products.push(newP);
            localStorage.setItem('kh_products', JSON.stringify(products));

            alert('પ્રોડક્ટ સફળતાપૂર્વક ઉમેરાઈ ગઈ!');
            document.getElementById('productForm').reset();
            renderSellerProducts();
        }

        function renderSellerProducts() {
            let list = document.getElementById('sellerProductList');
            list.innerHTML = '';
            if(products.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-500 py-2">કોઈ પ્રોડક્ટ નથી.</p>`;
                return;
            }
            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded border">
                        <div class="flex items-center space-x-2">
                            <img src="${p.image}" class="w-8 h-8 object-cover rounded">
                            <div>
                                <p class="font-bold">${p.name}</p>
                                <p class="text-gray-500">₹${p.price} | ${p.size}</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct(${p.id})" class="text-red-600 font-bold px-2 py-1 bg-white border rounded shadow-sm">ડિલીટ</button>
                    </div>
                `;
            });
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('kh_products', JSON.stringify(products));
            renderSellerProducts();
        }

        renderSellerProducts();
    </script>
</body>
</html>
