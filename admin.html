<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh Sabji & Fruits - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f4faf4;color:#203326;font-family:Arial,sans-serif}
main{max-width:650px;margin:auto}
section{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
h2{color:#168343}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#168343;color:white;border:0;font-weight:bold;cursor:pointer}
button.danger{background:#b3261e}
button.secondary{background:#456}
small{color:#555}
.product{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
.product img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.row{display:flex;gap:10px;align-items:center}
.row button{width:auto;flex:1}
#app{display:none}
</style>
</head>
<body>
<main>
<h2>K.H Fresh Sabji & Fruits</h2>
<p>Admin Panel — ભાવ અને પ્રોડક્ટ મેનેજ કરો</p>

<section id="login">
<h3>Admin Login</h3>
<p>Email અને Password દાખલ કરો.</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin Email" required autocomplete="username">
<input id="password" type="password" placeholder="Password" required autocomplete="current-password">
<button type="submit">Login કરો</button>
</form>
<p id="loginMsg" role="status"></p>
</section>

<div id="app">
<section>
<div class="row">
<h3 style="flex:1">પ્રોડક્ટ મેનેજમેન્ટ</h3>
<button id="logout" type="button">Logout</button>
</div>
<form id="productForm">
<input id="productId" type="hidden">
<label>પ્રોડક્ટનું નામ</label>
<input id="name" required placeholder="દા.ત. બટાકા">
<label>ભાવ (₹)</label>
<input id="price" type="number" min="0" step="0.01" required placeholder="દા.ત. 30">
<label>કેટેગરી</label>
<select id="category">
<option value="શાકભાજી">શાકભાજી</option>
<option value="ફળો">ફળો</option>
</select>
<label>એકમ</label>
<select id="unit">
<option value="કિલો">કિલો</option>
<option value="નંગ">નંગ</option>
<option value="પેકેટ">પેકેટ</option>
</select>
<label>ફોટો URL (વૈકલ્પિક)</label>
<input id="imageUrl" type="url" placeholder="https://...">
<small>આ વર્ઝનમાં ફોટો URL મૂકવો પડે છે. Galleryમાંથી સીધો ફોટો અપલોડ કરવાનું આગળ ઉમેરશું.</small>
<label>ગ્રાહકોને બતાવવો છે?</label>
<select id="active">
<option value="true">હા</option>
<option value="false">ના</option>
</select>
<button type="submit">સેવ કરો</button>
<button id="clearForm" class="secondary" type="button">નવું ફોર્મ</button>
<p id="saveMsg" role="status"></p>
</form>
</section>

<section>
<h3>હાલની પ્રોડક્ટ્સ</h3>
<div id="products">પ્રોડક્ટ્સ લોડ થઈ રહી છે...</div>
</section>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore, collection, onSnapshot, addDoc, doc, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
  authDomain: "kh-fresh-sabji-fruits.firebaseapp.com",
  projectId: "kh-fresh-sabji-fruits",
  storageBucket: "kh-fresh-sabji-fruits.firebasestorage.app",
  messagingSenderId: "815611229461",
  appId: "1:815611229461:web:ca713dc978e0997930251c",
  measurementId: "G-HBL4EVF1MN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let stopProducts = null;

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginMsg").textContent = "Login થઈ રહ્યું છે...";
  try {
    await signInWithEmailAndPassword(
      auth, $("email").value.trim(), $("password").value
    );
    $("loginMsg").textContent = "";
  } catch (err) {
    $("loginMsg").textContent = "Login ન થયું: " + err.message;
  }
});

onAuthStateChanged(auth, user => {
  if (stopProducts) {
    stopProducts();
    stopProducts = null;
  }
  $("login").style.display = user ? "none" : "block";
  $("app").style.display = user ? "block" : "none";
  if (user) loadProducts();
});

$("logout").addEventListener("click", async () => {
  await signOut(auth);
});

function loadProducts() {
  stopProducts = onSnapshot(collection(db, "products"), snapshot => {
    const host = $("products");
    host.replaceChildren();

    if (snapshot.empty) {
      host.textContent = "હજી કોઈ પ્રોડક્ટ નથી.";
      return;
    }

    snapshot.forEach(item => {
      const p = item.data();
      const card = document.createElement("div");
      card.className = "product";

      const title = document.createElement("strong");
      title.textContent = p.name || "(નામ નથી)";
      card.appendChild(title);

      const detail = document.createElement("p");
      detail.textContent =
        "₹" + (p.price ?? 0) + " / " + (p.unit || "કિલો") +
        " • " + (p.category || "શાકભાજી") +
        " • " + (p.active === false ? "છુપાવેલ" : "દેખાય છે");
      card.appendChild(detail);

      if (p.imageUrl && /^https?:\/\//i.test(p.imageUrl)) {
        const img = document.createElement("img");
        img.src = p.imageUrl;
        img.alt = p.name || "Product photo";
        img.loading = "lazy";
        card.appendChild(img);
      }

      const actions = document.createElement("div");
      actions.className = "row";

      const edit = document.createElement("button");
      edit.type = "button";
      edit.textContent = "Edit";
      edit.addEventListener("click", () => {
        $("productId").value = item.id;
        $("name").value = p.name || "";
        $("price").value = p.price ?? "";
        $("category").value = p.category || "શાકભાજી";
        $("unit").value = p.unit || "કિલો";
        $("imageUrl").value = p.imageUrl || "";
        $("active").value = String(p.active !== false);
        window.scrollTo({top: 0, behavior: "smooth"});
      });

      const del = document.createElement("button");
      del.type = "button";
      del.className = "danger";
      del.textContent = "Delete";
      del.addEventListener("click", async () => {
        if (!confirm("આ પ્રોડક્ટ કાઢી નાખવી છે?")) return;
        try {
          await deleteDoc(doc(db, "products", item.id));
          $("saveMsg").textContent = "પ્રોડક્ટ કાઢી નાખી.";
        } catch (err) {
          $("saveMsg").textContent = "ભૂલ: " + err.message;
        }
      });

      actions.append(edit, del);
      card.appendChild(actions);
      host.appendChild(card);
    });
  }, err => {
    $("products").textContent = "લોડ ન થયું: " + err.message;
  });
}

$("productForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("saveMsg").textContent = "સેવ થઈ રહ્યું છે...";

  const name = $("name").value.trim();
  const price = Number($("price").value);
  const imageUrl = $("imageUrl").value.trim();

  if (!name || !Number.isFinite(price) || price < 0) {
    $("saveMsg").textContent = "નામ અને યોગ્ય ભાવ દાખલ કરો.";
    return;
  }
  if (imageUrl && !/^https?:\/\//i.test(imageUrl)) {
    $("saveMsg").textContent = "ફોટો URL https:// અથવા http:// થી શરૂ થવો જોઈએ.";
    return;
  }

  const product = {
    name,
    price,
    category: $("category").value,
    unit: $("unit").value,
    imageUrl,
    active: $("active").value === "true"
  };

  try {
    const id = $("productId").value;
    if (id) {
      await setDoc(doc(db, "products", id), product, {merge: true});
    } else {
      await addDoc(collection(db, "products"), product);
    }
    $("saveMsg").textContent = "સફળતાપૂર્વક સેવ થયું!";
    $("productForm").reset();
    $("productId").value = "";
  } catch (err) {
    $("saveMsg").textContent = "સેવ ન થયું: " + err.message;
  }
});

$("clearForm").addEventListener("click", () => {
  $("productForm").reset();
  $("productId").value = "";
  $("saveMsg").textContent = "";
});
</script>
</body>
</html>
