
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.H Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f8}
header{background:#174f39;color:white;padding:15px;text-align:center}
main{max-width:950px;margin:auto;padding:12px}
.panel{background:white;padding:14px;border-radius:12px;margin:12px 0}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #bbb;border-radius:8px}
button{background:#087a4b;color:white;padding:10px;border:0;border-radius:8px;margin:3px}
.danger{background:#b42318}
.hidden{display:none}
.item{border-bottom:1px solid #ddd;padding:12px 0}
</style>
</head>
<body>
<header><h2>K.H Fresh & Fashion Admin</h2></header>
<main>

<div id="login" class="panel">
<h3>Admin Login</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="msg"></div>
</div>

<div id="app" class="hidden">
<div class="panel">
<span id="user"></span>
<button onclick="logout()">Logout</button>
</div>

<section class="panel">
<h3>દુકાન ઉમેરો / Edit કરો</h3>
<input type="hidden" id="shopId">
<input id="shopName" placeholder="દુકાનનું નામ">
<input id="owner" placeholder="માલિકનું નામ">
<input id="phone" placeholder="WhatsApp નંબર">
<input id="area" placeholder="વિસ્તાર">
<input id="address" placeholder="સરનામું">

<label>દુકાનનો ફોટો</label>
<input type="file" id="shopImage" accept="image/*">

<h3>આ દુકાનનો ઓર્ડર નિયમ</h3>
<select id="minimumRule" onchange="customBox()">
<option value="none">કોઈ લઘુત્તમ નિયમ નહીં</option>
<option value="veg_2kg">મિક્સ વસ્તુઓ મળીને ઓછામાં ઓછા 2 કિલો</option>
<option value="amount_500">મિક્સ વસ્તુઓ મળીને ઓછામાં ઓછા ₹500</option>
<option value="custom">પોતાનો નિયમ</option>
</select>

<div id="customFields" class="hidden">
<select id="customType">
<option value="amount">રૂપિયામાં ₹</option>
<option value="kg">કિલોમાં kg</option>
</select>
<input id="customMinimum" type="number" placeholder="લઘુત્તમ રકમ / વજન">
</div>

<label><input id="active" type="checkbox" checked style="width:auto"> દુકાન ચાલુ રાખો</label>
<br>
<button onclick="saveShop()">દુકાન સાચવો</button>
<button onclick="resetShop()">નવું ફોર્મ</button>

<h3>દુકાનોની યાદી</h3>
<div id="shopList"></div>
</section>

<section class="panel">
<h3>પ્રોડક્ટ ઉમેરો / Edit કરો</h3>
<input type="hidden" id="productId">
<select id="productShop"></select>
<input id="productName" placeholder="પ્રોડક્ટનું નામ">
<input id="category" placeholder="કેટેગરી">
<input id="price" type="number" placeholder="ભાવ">
<input id="unit" placeholder="એકમ: નંગ / 250 ગ્રામ / કિલો">
<input id="step" type="number" step="0.01" placeholder="જથ્થાનો સ્ટેપ">
<input id="gramsPerUnit" type="number" placeholder="એક એકમમાં કેટલા ગ્રામ?">
<input id="size" placeholder="સાઇઝ">
<input id="color" placeholder="રંગ">
<input id="shoeNumber" placeholder="ચપ્પલ / શૂ નંબર">
<input id="design" placeholder="ડિઝાઇન">
<label>પ્રોડક્ટ ફોટો</label>
<input type="file" id="productImage" accept="image/*">
<label><input id="productActive" type="checkbox" checked style="width:auto"> ગ્રાહકને દેખાય</label>
<br>
<button onclick="saveProduct()">પ્રોડક્ટ સાચવો</button>
<button onclick="resetProduct()">નવું ફોર્મ</button>
<h3>પ્રોડક્ટ્સ</h3>
<div id="productList"></div>
</section>

<section class="panel">
<h3>ઓર્ડર</h3>
<div id="orders"></div>
</section>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyB_9gcc4UHtrIHeASd8txglLZ4kkc_clQU",
authDomain:"kh-fresh-fashion.firebaseapp.com",
projectId:"kh-fresh-fashion",
storageBucket:"kh-fresh-fashion.firebasestorage.app",
messagingSenderId:"1013749791487",
appId:"1:1013749791487:web:3b1af0eb4f7497a30feaca"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const ADMIN_UID="g5BmaKZp3QQ1FnXkYc6WIDBlRVn1";
let shops=[],products=[];

const $=id=>document.getElementById(id);

function login(){
auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)
.catch(e=>$("msg").textContent=e.message);
}
function logout(){auth.signOut()}

auth.onAuthStateChanged(async user=>{
if(user&&user.uid===ADMIN_UID){
$("login").classList.add("hidden");
$("app").classList.remove("hidden");
$("user").textContent=user.email;
await refresh();
}else{
$("app").classList.add("hidden");
$("login").classList.remove("hidden");
if(user)auth.signOut();
}
});

function customBox(){
$("customFields").classList.toggle("hidden",$("minimumRule").value!=="custom");
}

async function imageBase64(file){
if(!file)return "";
return new Promise((resolve,reject)=>{
let img=new Image(),url=URL.createObjectURL(file);
img.onload=()=>{
let canvas=document.createElement("canvas");
let w=img.width,h=img.height,max=600;
let ratio=Math.min(1,max/Math.max(w,h));
canvas.width=Math.round(w*ratio);
canvas.height=Math.round(h*ratio);
canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
URL.revokeObjectURL(url);
resolve(canvas.toDataURL("image/jpeg",.5));
};
img.onerror=reject;
img.src=url;
});
}

async function refresh(){
let a=await db.collection("shops").get();
let b=await db.collection("products").get();
let c=await db.collection("orders").get();
shops=a.docs.map(d=>({id:d.id,...d.data()}));
products=b.docs.map(d=>({id:d.id,...d.data()}));
renderShops();renderProducts();renderOrders(c.docs);
}

async function saveShop(){
try{
let id=$("shopId").value;
let old=shops.find(s=>s.id===id);
let photo=await imageBase64($("shopImage").files[0]);

let data={
name:$("shopName").value.trim(),
owner:$("owner").value.trim(),
phone:$("phone").value.trim(),
area:$("area").value.trim(),
address:$("address").value.trim(),
minimumRule:$("minimumRule").value,
customType:$("customType").value,
customMinimum:Number($("customMinimum").value||0),
active:$("active").checked,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
};
if(!data.name)return alert("દુકાનનું નામ લખો.");
if(photo)data.imageBase64=photo;
else if(old?.imageBase64)data.imageBase64=old.imageBase64;

if(id)await db.collection("shops").doc(id).update(data);
else await db.collection("shops").add({
...data,paid:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
resetShop();await refresh();alert("દુકાન સાચવાઈ ગઈ.");
}catch(e){alert(e.message)}
}

function resetShop(){
["shopId","shopName","owner","phone","area","address","customMinimum"].forEach(x=>$(x).value="");
$("minimumRule").value="none";
$("active").checked=true;
$("shopImage").value="";
customBox();
}

function ruleName(s){
if(s.minimumRule==="veg_2kg")return "મિક્સ 2 કિલો";
if(s.minimumRule==="amount_500")return "મિક્સ ₹500";
if(s.minimumRule==="custom")return s.customType==="kg"?s.customMinimum+" કિલો":"₹"+s.customMinimum;
return "કોઈ લઘુત્તમ નહીં";
}

function renderShops(){
$("shopList").innerHTML=shops.map(s=>`
<div class="item">
<b>${s.name||""}</b> — ${s.area||""}
<br>નિયમ: ${ruleName(s)}
<br>સ્થિતિ: ${s.active===false?"બંધ":"ચાલુ"}
<br>
<button onclick="editShop('${s.id}')">Edit</button>
<button onclick="toggleShop('${s.id}')">ચાલુ / બંધ</button>
<button class="danger" onclick="deleteShop('${s.id}')">Delete</button>
</div>`).join("");

$("productShop").innerHTML='<option value="">દુકાન પસંદ કરો</option>'+
shops.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
}

function editShop(id){
let s=shops.find(x=>x.id===id);
$("shopId").value=id;
$("shopName").value=s.name||"";
$("owner").value=s.owner||"";
$("phone").value=s.phone||"";
$("area").value=s.area||"";
$("address").value=s.address||"";
$("minimumRule").value=s.minimumRule||"none";
$("customType").value=s.customType||"amount";
$("customMinimum").value=s.customMinimum||"";
$("active").checked=s.active!==false;
customBox();
window.scrollTo(0,0);
}

async function toggleShop(id){
let s=shops.find(x=>x.id===id);
await db.collection("shops").doc(id).update({active:s.active===false});
refresh();
}

async function deleteShop(id){
if(!confirm("દુકાન અને તેની પ્રોડક્ટ્સ ડિલીટ કરવી છે?"))return;
let batch=db.batch();
batch.delete(db.collection("shops").doc(id));
products.filter(p=>p.shopId===id).forEach(p=>batch.delete(db.collection("products").doc(p.id)));
await batch.commit();refresh();
}

async function saveProduct(){
try{
let id=$("productId").value;
let old=products.find(p=>p.id===id);
let shop=shops.find(s=>s.id===$("productShop").value);
if(!shop)return alert("દુકાન પસંદ કરો.");
let photo=await imageBase64($("productImage").files[0]);

let data={
shopId:shop.id,shopName:shop.name,
name:$("productName").value.trim(),
category:$("category").value.trim(),
price:Number($("price").value||0),
unit:$("unit").value.trim()||"નંગ",
step:Number($("step").value||1),
gramsPerUnit:Number($("gramsPerUnit").value||0),
size:$("size").value.trim(),
color:$("color").value.trim(),
shoeNumber:$("shoeNumber").value.trim(),
design:$("design").value.trim(),
active:$("productActive").checked,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
};
if(!data.name)return alert("પ્રોડક્ટનું નામ લખો.");
if(photo)data.imageBase64=photo;
else if(old?.imageBase64)data.imageBase64=old.imageBase64;

if(id)await db.collection("products").doc(id).update(data);
else await db.collection("products").add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});

resetProduct();await refresh();alert("પ્રોડક્ટ સાચવાઈ ગઈ.");
}catch(e){alert(e.message)}
}

function resetProduct(){
["productId","productName","category","price","unit","step","gramsPerUnit","size","color","shoeNumber","design"].forEach(x=>$(x).value="");
$("productShop").value="";
$("productImage").value="";
$("productActive").checked=true;
}

function renderProducts(){
$("productList").innerHTML=products.map(p=>`
<div class="item">
<b>${p.name||""}</b> ₹${p.price||0} / ${p.unit||""}
<br>${p.shopName||""}
<br>
<button onclick="editProduct('${p.id}')">Edit</button>
<button onclick="toggleProduct('${p.id}')">ચાલુ / બંધ</button>
<button class="danger" onclick="deleteProduct('${p.id}')">Delete</button>
</div>`).join("");
}

function editProduct(id){
let p=products.find(x=>x.id===id);
$("productId").value=id;
$("productShop").value=p.shopId||"";
$("productName").value=p.name||"";
$("category").value=p.category||"";
$("price").value=p.price||0;
$("unit").value=p.unit||"";
$("step").value=p.step||1;
$("gramsPerUnit").value=p.gramsPerUnit||0;
$("size").value=p.size||"";
$("color").value=p.color||"";
$("shoeNumber").value=p.shoeNumber||"";
$("design").value=p.design||"";
$("productActive").checked=p.active!==false;
window.scrollTo(0,document.body.scrollHeight/2);
}

async function toggleProduct(id){
let p=products.find(x=>x.id===id);
await db.collection("products").doc(id).update({active:p.active===false});
refresh();
}

async function deleteProduct(id){
if(!confirm("પ્રોડક્ટ ડિલીટ કરવી છે?"))return;
await db.collection("products").doc(id).delete();refresh();
}

function renderOrders(docs){
$("orders").innerHTML=docs.map(d=>{
let o=d.data();
return `<div class="item">
<b>${o.shopName||""} — ₹${o.total||0}</b>
<br>${o.customerName||""} | ${o.phone||""}
<br>${o.address||""}
<br>${(o.items||[]).map(i=>i.name+" × "+i.qty).join(", ")}
<br>સ્થિતિ: ${o.status||"New"}
</div>`;
}).join("")||"હજુ ઓર્ડર નથી.";
}
</script>
</body>
</html>
