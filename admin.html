<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.H Fresh - Master Multi-Store Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap');
        body { font-family: 'Noto Sans Gujarati', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-3 md:p-6">

    <div class="max-w-2xl mx-auto bg-white p-5 rounded-2xl shadow-md space-y-6">
        <h2 class="text-xl font-bold text-pink-600 border-b pb-2 flex justify-between items-center">
            <span><i class="fa-solid fa-store"></i> માસ્ટર દુકાન એડમિન પેનલ</span>
        </h2>

        <!-- Section 1: Add New Store -->
        <div class="bg-pink-50 border border-pink-200 p-4 rounded-xl space-y-3">
            <h3 class="font-bold text-sm text-pink-950"><i class="fa-solid fa-plus-circle"></i> ૧. નવી દુકાન ઉમેરો:</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">દુકાનનું નામ:</label>
                    <input type="text" id="newStoreName" class="w-full border p-2 rounded text-sm bg-white" placeholder="દા.ત. Ayan SuperStore">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">WhatsApp નંબર (ઓર્ડર માટે):</label>
                    <input type="text" id="newStorePhone" class="w-full border p-2 rounded text-sm bg-white" placeholder="9426852334">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1 text-gray-600">દુકાનનો મોલ બેનર ફોટો (Gallery/Camera):</label>
                <input type="file" id="newStoreBanner" accept="image/*" class="w-full border p-2 rounded text-sm bg-white">
            </div>
            <button onclick="createNewStore()" class="w-full bg-pink-600 text-white font-bold py-2 rounded-lg text-xs shadow hover:bg-pink-700">નવી દુકાન સેવ કરો</button>
        </div>

        <!-- Section 2: Manage Store & Add Products -->
        <div class="bg-gray-50 border p-4 rounded-xl space-y-4">
            <h3 class="font-bold text-sm text-gray-800"><i class="fa-solid fa-boxes-stacked"></i> ૨. દુકાન પસંદ કરો અને પ્રોડક્ટ ઉમેરો:</h3>
            
            <div>
                <label class="block text-xs font-bold mb-1 text-gray-600">કઈ દુકાનમાં કામ કરવું છે તે પસંદ કરો:</label>
                <select id="selectStore" onchange="switchStore()" class="w-full border p-2 rounded text-sm font-bold bg-white text-pink-600">
                    <!-- Stores options will load dynamically -->
                </select>
            </div>

            <div id="storeManageArea" class="hidden space-y-4 border-t pt-3">
                <!-- Status & Slab Info -->
                <div class="flex justify-between items-center text-xs bg-amber-50 p-2.5 rounded border border-amber-200">
                    <div>
                        <span>સ્થિતિ: <b id="displayStatus" class="text-green-600">Active</b></span> | 
                        <span>પ્રોડક્ટ્સ: <b id="displayProdCount">0</b></span>
                    </div>
                    <div class="space-x-1">
                        <button onclick="toggleStoreStatus(true)" class="bg-green-600 text-white text-[10px] px-2 py-1 rounded font-bold">ચાલુ કરો</button>
                        <button onclick="toggleStoreStatus(false)" class="bg-red-600 text-white text-[10px] px-2 py-1 rounded font-bold">બંધ કરો</button>
                    </div>
                </div>

                <!-- Add Product Form -->
                <form id="productForm" onsubmit="addProduct(event)" class="space-y-3 bg-white p-3 rounded-lg border">
                    <h4 class="font-bold text-xs text-gray-700">આ દુકાનમાં નવી પ્રોડક્ટ ઉમેરો:</h4>
                    <div>
                        <input type="text" id="pName" required class="w-full border p-2 rounded text-sm" placeholder="પ્રોડક્ટનું નામ (દા.ત. Banana / Shirt)">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="pCategory" class="border p-2 rounded text-sm">
                            <option value="veg_fruit">Vegetables & Fruits</option>
                            <option value="men">Men Clothing</option>
                            <option value="women">Women Clothing</option>
                            <option value="kids">Kids Clothing</option>
                            <option value="footwear">Footwear</option>
                            <option value="grocery">Grocery & Staples</option>
                            <option value="beauty">Beauty & Personal Care</option>
                            <option value="home">Home & Kitchen</option>
                            <option value="electronics">Electronics</option>
                            <option value="other">Other Items</option>
                        </select>
                        <input type="number" id="pPrice" required class="border p-2 rounded text-sm" placeholder="ભાવ (₹)">
                    </div>
                    <div>
                        <input type="text" id="pSizeOptions" class="w-full border p-2 rounded text-sm" placeholder="સાઈઝ / કલર / વજન ઓપ્શન (દા.ત. 250g, 500g, 1 Kg)">
                    </div>
                    <div>
                        <input type="file" id="pImageFile" accept="image/*" class="w-full border p-2 rounded text-sm bg-gray-50">
                    </div>
                    <button type="submit" id="btnSubmitProd" class="w-full bg-pink-600 text-white font-bold py-2 rounded-lg text-xs shadow">પ્રોડક્ટ ઉમેરો</button>
                </form>

                <!-- Product List -->
                <div>
                    <h4 class="font-bold text-xs mb-2">પસંદ કરેલી દુકાનની પ્રોડક્ટ્સ:</h4>
                    <div id="productList" class="space-y-2 max-h-48 overflow-y-auto border p-2 rounded text-xs bg-white"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stores = JSON.parse(localStorage.getItem('kh_all_stores')) || [];
        let currentStoreId = null;

        function compressImage(file, maxWidth, maxHeight, quality, callback) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let img = new Image();
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                    }
                    canvas.width = width; canvas.height = height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderStoreDropdown() {
            let select = document.getElementById('selectStore');
            select.innerHTML = '<option value="">-- દુકાન પસંદ કરો --</option>';
            stores.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.name} (${s.phone})</option>`;
            });
        }

        function createNewStore() {
            let name = document.getElementById('newStoreName').value.trim();
            let phone = document.getElementById('newStorePhone').value.trim();
            let bannerInput = document.getElementById('newStoreBanner');

            if (!name || !phone) {
                alert('દુકાનનું નામ અને નંબર ભરવો ફરજિયાત છે!');
                return;
            }

            let storeId = 'store_' + Date.now();
            let defaultBanner = 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=1000';

            if (bannerInput.files && bannerInput.files[0]) {
                compressImage(bannerInput.files[0], 800, 400, 0.7, function(compressedUrl) {
                    saveStoreObj(storeId, name, phone, compressedUrl);
                });
            } else {
                saveStoreObj(storeId, name, phone, defaultBanner);
            }
        }

        function saveStoreObj(id, name, phone, banner) {
            let newStore = { id, name, phone, banner, status: 'active', products: [] };
            stores.push(newStore);
            localStorage.setItem('kh_all_stores', JSON.stringify(stores));
            alert('નવી દુકાન સફળતાપૂર્વક ઉમેરાઈ ગઈ!');
            document.getElementById('newStoreName').value = '';
            document.getElementById('newStorePhone').value = '';
            document.getElementById('newStoreBanner').value = '';
            renderStoreDropdown();
        }

        function switchStore() {
            let selectedId = document.getElementById('selectStore').value;
            if (!selectedId) {
                document.getElementById('storeManageArea').classList.add('hidden');
                return;
            }
            currentStoreId = selectedId;
            document.getElementById('storeManageArea').classList.remove('hidden');
            renderStoreDetails();
        }

        function renderStoreDetails() {
            let s = stores.find(item => item.id === currentStoreId);
            if (!s) return;
            document.getElementById('displayStatus').innerText = (s.status === 'active' ? 'Active (ચાલુ)' : 'Inactive (બંધ)');
            document.getElementById('displayStatus').className = (s.status === 'active' ? 'text-green-600 font-bold' : 'text-red-600 font-bold');
            document.getElementById('displayProdCount').innerText = s.products.length;

            let list = document.getElementById('productList');
            list.innerHTML = '';
            if (s.products.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-500 py-2">કોઈ પ્રોડક્ટ નથી.</p>`;
                return;
            }
            s.products.forEach(p => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded border">
                        <div class="flex items-center space-x-2">
                            <img src="${p.image}" class="w-8 h-8 object-cover rounded">
                            <div>
                                <p class="font-bold">${p.name}</p>
                                <p class="text-gray-500">₹${p.price} | (${p.category})</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct(${p.id})" class="text-red-600 font-bold px-2 py-1 bg-white border rounded">ડિલીટ</button>
                    </div>
                `;
            });
        }

        function toggleStoreStatus(isActive) {
            let s = stores.find(item => item.id === currentStoreId);
            if (s) {
                s.status = isActive ? 'active' : 'inactive';
                localStorage.setItem('kh_all_stores', JSON.stringify(stores));
                renderStoreDetails();
            }
        }

        function addProduct(e) {
            e.preventDefault();
            let s = stores.find(item => item.id === currentStoreId);
            if (!s) return;

            let name = document.getElementById('pName').value.trim();
            let category = document.getElementById('pCategory').value;
            let price = parseFloat(document.getElementById('pPrice').value);
            let sizeOptions = document.getElementById('pSizeOptions').value.trim() || (category === 'veg_fruit' ? '250g, 500g, 1 Kg, 2 Kg' : 'Standard');
            let fileInput = document.getElementById('pImageFile');

            let btn = document.getElementById('btnSubmitProd');
            btn.disabled = true;

            if (fileInput.files && fileInput.files[0]) {
                compressImage(fileInput.files[0], 500, 500, 0.7, function(compressedUrl) {
                    s.products.push({ id: Date.now(), category, name, price, sizeOptions, image: compressedUrl });
                    localStorage.setItem('kh_all_stores', JSON.stringify(stores));
                    document.getElementById('productForm').reset();
                    btn.disabled = false;
                    renderStoreDetails();
                });
            } else {
                let defaultImg = 'https://images.unsplash.com/photo-1582281298055-e2f38a520443?w=500';
                s.products.push({ id: Date.now(), category, name, price, sizeOptions, image: defaultImg });
                localStorage.setItem('kh_all_stores', JSON.stringify(stores));
                document.getElementById('productForm').reset();
                btn.disabled = false;
                renderStoreDetails();
            }
        }

        function deleteProduct(prodId) {
            let s = stores.find(item => item.id === currentStoreId);
            if (s) {
                s.products = s.products.filter(p => p.id !== prodId);
                localStorage.setItem('kh_all_stores', JSON.stringify(stores));
                renderStoreDetails();
            }
        }

        renderStoreDropdown();
    </script>
</body>
</html>
