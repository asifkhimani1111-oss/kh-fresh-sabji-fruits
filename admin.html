<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh & Fashion Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#172554;color:white;padding:17px;text-align:center}
main{max-width:950px;margin:auto;padding:14px}

h2{font-size:19px}

<body>

<header>
<h2>🛍️ K.H Fresh & Fashion</h2>
Admin Panel
</header>

<main>

<section id="loginBox" class="card">

<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg" class="small"></p>

<section id="panel" class="hidden">

<div class="card">
<div class="row">
<h2>Admin Dashboard</h2>
<button class="red" onclick="logout()">Logout</button>
</div>
<p id="adminInfo" class="small"></p>

<div class="card">
<h2>🏪 નવી દુકાન ઉમેરો</h2>
<input id="shopName" placeholder="દુકાનનું નામ">

<input id="shopPhone" placeholder="મોબાઇલ / WhatsApp નંબર">
<input id="area" placeholder="વિસ્તાર / ગામ">
<textarea id="address" placeholder="પૂરું સરનામું"></textarea>

<div class="card">
<h2>📦 નવી પ્રોડક્ટ ઉમેરો</h2>
<select id="productShop"><option value="">દુકાન પસંદ કરો</option></select>
<input id="productName" placeholder="પ્રોડક્ટનું નામ">
<select id="category">
<option value="Fruits & Vegetables">ફળો અને શાકભાજી</option>
<option value="Grocery">કરિયાણું</option>
<option value="Men">પુરુષોના કપડાં</option>
<option value="Women">મહિલાઓના કપડાં</option>
<option value="Kids">બાળકોના કપડાં</option>
<option value="Footwear">ફૂટવેર</option>
<option value="Beauty">બ્યુટી અને પર્સનલ કેર</option>
<option value="Home">ઘરવખરી</option>
<option value="Electronics">ઇલેક્ટ્રોનિક્સ</option>

<input id="subcategory" placeholder="સબ કેટેગરી">
<input id="price" type="number" min="0" placeholder="ભાવ ₹">

<option value="piece">નંગ</option>

<option value="meter">મીટર</option>

<input id="weight" placeholder="વજન / માપ">

<input id="otherDetails" placeholder="બીજી માહિતી">
<label>પ્રોડક્ટનો ફોટો</label>
<input id="productPhoto" type="file" accept="image/*">
<img id="productPreview" style="width:100px;display:none;border-radius:10px">
<button onclick="addProduct()">પ્રોડક્ટ ઉમેરો</button>
<p id="productMsg" class="small"></p>
</div>

<div class="card">
<h2>🏪 દુકાનોનું સંચાલન</h2>
<div id="shopsList">લોડ થઈ રહ્યું છે...</div>
</div>

<div class="card">
<h2>🛍️ પ્રોડક્ટ્સનું સંચાલન</h2>
<div id="productsList">લોડ થઈ રહ્યું છે...</div>
</div>

<div class="card">
<h2>🧾 ઓર્ડર</h2>
<div id="ordersList">લોડ થઈ રહ્યા છે...</div>
</div>

</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyB_9gcc4UHtrIHeASd8txglLZ4kkc_clQU",
 authDomain: "kh-fresh-fashion.firebaseapp.com",
 projectId: "kh-fresh-fashion",
 storageBucket: "kh-fresh-fashion.firebasestorage.app",
 messagingSenderId: "1013749791487",
 appId: "1:1013749791487:web:3b1af0eb4f7497a30feaca"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

const ADMIN_EMAIL="asifkhimani1111@gmail.com";
const ADMIN_UID="g5BmaKZp3QQ1FnXkYc6WIDBlRVn1";

let shopsCache=[];
let productsCache=[];
let shopImage="";
let productImage="";

function $(id){return document.getElementById(id)}
function msg(id,text){$(id).textContent=text}

auth.onAuthStateChanged(async user=>{
 if(user && user.email===ADMIN_EMAIL && user.uid===ADMIN_UID){
  $("loginBox").classList.add("hidden");
  $("panel").classList.remove("hidden");
  $("adminInfo").textContent="Admin: "+user.email;
  await loadAll();
 }else{
  $("panel").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  if(user) await auth.signOut();
 }
});

async function login(){
 try{
  await auth.signInWithEmailAndPassword(
   $("email").value.trim(),
   $("password").value
  );
  msg("loginMsg","Login થઈ રહ્યું છે...");
 }catch(e){msg("loginMsg",e.message)}
}
async function logout(){await auth.signOut()}

function compressImage(file,maxKB=50){
 return new Promise((resolve,reject)=>{
  if(!file){resolve("");return}
  if(!file.type.startsWith("image/")){
   reject(new Error("યોગ્ય ફોટો પસંદ કરો"));return;
  }
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("ફોટો વાંચી શકાયો નથી"));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("ફોટો ખોલી શકાયો નથી"));
   img.onload=()=>{
    let w=img.width,h=img.height;
    const scale=Math.min(1,700/Math.max(w,h));
    w=Math.round(w*scale);h=Math.round(h*scale);
    const canvas=document.createElement("canvas");
    canvas.width=w;canvas.height=h;
    canvas.getContext("2d").drawImage(img,0,0,w,h);
    let quality=.65;
    let data=canvas.toDataURL("image/jpeg",quality);
    while(data.length*0.75/1024>maxKB && quality>.25){
     quality-=.08;
     data=canvas.toDataURL("image/jpeg",quality);
    }
    resolve(data);
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

$("shopPhoto").addEventListener("change",async e=>{
 try{
  shopImage=await compressImage(e.target.files[0]);
  $("shopPreview").src=shopImage;
  $("shopPreview").style.display=shopImage?"block":"none";
 }catch(err){msg("shopMsg",err.message)}
});

$("productPhoto").addEventListener("change",async e=>{
 try{
  productImage=await compressImage(e.target.files[0]);
  $("productPreview").src=productImage;
  $("productPreview").style.display=productImage?"block":"none";
 }catch(err){msg("productMsg",err.message)}
});

async function addShop(){
 try{
  const name=$("shopName").value.trim();
  if(!name)return msg("shopMsg","દુકાનનું નામ લખો");

  await db.collection("shops").add({
   name,
   shopName:name,
   owner:$("owner").value.trim(),
   phone:$("shopPhone").value.trim(),
   area:$("area").value.trim(),
   address:$("address").value.trim(),
   imageBase64:shopImage,
   active:true,
   paid:false,
   subscriptionEndAt:null,
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });

  ["shopName","owner","shopPhone","area","address"].forEach(id=>$(id).value="");
  $("shopPhoto").value="";
  $("shopPreview").style.display="none";
  shopImage="";
  msg("shopMsg","દુકાન ઉમેરાઈ ગઈ!");
  await loadAll();
 }catch(e){msg("shopMsg","ભૂલ: "+e.message)}
}

async function addProduct(){
 try{
  const shopId=$("productShop").value;
  const name=$("productName").value.trim();
  const price=Number($("price").value);
  if(!shopId)return msg("productMsg","દુકાન પસંદ કરો");
  if(!name)return msg("productMsg","પ્રોડક્ટનું નામ લખો");
  if(!Number.isFinite(price)||price<0)return msg("productMsg","યોગ્ય ભાવ લખો");

  const shop=shopsCache.find(s=>s.id===shopId);
  const category=$("category").value;
  const veg=category==="Fruits & Vegetables";

  await db.collection("products").add({
   shopId,
   shopName:shop?.name||shop?.shopName||"",
   name,
   category,
   categoryType:veg?"veg_fruit":"other",
   subcategory:$("subcategory").value.trim(),
   price,
   unit:$("unit").value,
   weight:$("weight").value.trim(),
   size:$("size").value.trim(),
   color:$("color").value.trim(),
   shoeNumber:$("shoeNumber").value.trim(),
   design:$("design").value.trim(),
   otherDetails:$("otherDetails").value.trim(),
   imageBase64:productImage,
   stepGrams:veg?250:0,
   stepPieces:1,
   active:true,
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });

  ["productName","subcategory","price","weight","size","color","shoeNumber","design","otherDetails"].forEach(id=>$(id).value="");
  $("productPhoto").value="";
  $("productPreview").style.display="none";
  productImage="";
  msg("productMsg","પ્રોડક્ટ ઉમેરાઈ ગઈ!");
  await loadAll();
 }catch(e){msg("productMsg","ભૂલ: "+e.message)}
}

async function loadAll(){
 try{
  const [s,p,o]=await Promise.all([
   db.collection("shops").get(),
   db.collection("products").get(),
   db.collection("orders").get()
  ]);
  shopsCache=s.docs.map(d=>({id:d.id,...d.data()}));
  productsCache=p.docs.map(d=>({id:d.id,...d.data()}));
  renderShops();
  renderProducts();
  renderOrders(o.docs.map(d=>({id:d.id,...d.data()})));

  $("productShop").innerHTML=
   '<option value="">દુકાન પસંદ કરો</option>'+
   shopsCache.map(s=>`<option value="${s.id}">${escapeHTML(s.name||s.shopName||"દુકાન")}</option>`).join("");
 }catch(e){
  $("shopsList").textContent="ડેટા લોડ કરવામાં ભૂલ: "+e.message;
 }
}

function escapeHTML(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function renderShops(){
 $("shopsList").innerHTML=shopsCache.map(s=>{
  const count=productsCache.filter(p=>p.shopId===s.id).length;
  const fee=Math.max(1,Math.ceil(count/30))*60;
  const photo=s.imageBase64||s.banner||"";
  return `<div class="item">
   <div class="row">
   ${photo?`<img src="${photo}">`:""}
   <div><b>${escapeHTML(s.name||s.shopName)}</b>
   <div class="small">${escapeHTML(s.area||"")}</div>
   <div class="small">મોબાઇલ: ${escapeHTML(s.phone||"")}</div>
   <div class="small">પ્રોડક્ટ્સ: ${count} | 30 દિવસની ફી: ₹${fee}</div>
   <div class="small">સ્થિતિ: ${s.active?"ચાલુ":"બંધ"} | ચુકવણી: ${s.paid?"Paid":"Pending"}</div>
   </div></div>
   <button class="green" onclick="activateShop('${s.id}')">રોકડા મળ્યા – 30 દિવસ ચાલુ કરો</button>
   <button class="gray" onclick="toggleShop('${s.id}',${!s.active})">${s.active?"દુકાન બંધ કરો":"દુકાન ચાલુ કરો"}</button>
   <button class="gray" onclick="editShop('${s.id}')">દુકાન Edit</button>
   <button class="red" onclick="deleteShop('${s.id}')">દુકાન Delete</button>
  </div>`;
 }).join("")||"હજુ કોઈ દુકાન નથી";
}

function renderProducts(){
 $("productsList").innerHTML=productsCache.map(p=>`
  <div class="item">
   <div class="row">
   ${p.imageBase64?`<img src="${p.imageBase64}">`:""}
   <div><b>${escapeHTML(p.name)}</b>
   <div class="small">${escapeHTML(p.shopName||"")}</div>
   <div>₹${Number(p.price)||0} / ${escapeHTML(p.unit||"")}</div>
   <div class="small">${escapeHTML(p.category||"")}</div>
   </div></div>
   <button class="gray" onclick="editProduct('${p.id}')">Edit</button>
   <button class="gray" onclick="toggleProduct('${p.id}',${!p.active})">${p.active===false?"ચાલુ કરો":"બંધ કરો"}</button>
   <button class="red" onclick="deleteProduct('${p.id}')">Delete</button>
  </div>`).join("")||"હજુ કોઈ પ્રોડક્ટ નથી";
}

function renderOrders(orders){
 orders.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 $("ordersList").innerHTML=orders.map(o=>{
  const items=Array.isArray(o.items)?o.items:[];
  return `<div class="item">
   <b>ઓર્ડર: ${escapeHTML(o.id)}</b>
   <div class="small">ગ્રાહક: ${escapeHTML(o.customerName||o.name||"")}</div>
   <div class="small">ફોન: ${escapeHTML(o.phone||o.customerPhone||"")}</div>
   <div class="small">સરનામું: ${escapeHTML(o.address||"")}</div>
   <div class="small">સ્થિતિ: ${escapeHTML(o.status||"નવો")}</div>
   <div>${items.map(i=>`<div>${escapeHTML(i.name||"વસ્તુ")} × ${escapeHTML(i.qty||i.quantity||1)}</div>`).join("")}</div>
   <b>કુલ: ₹${Number(o.total||o.totalAmount||0)}</b>
   <button class="green" onclick="setOrder('${o.id}','Confirmed')">Confirm</button>
   <button class="gray" onclick="setOrder('${o.id}','Completed')">Completed</button>
   <button class="red" onclick="setOrder('${o.id}','Rejected')">Reject</button>
  </div>`;
 }).join("")||"હજુ કોઈ ઓર્ડર નથી";
}

async function activateShop(id){
 const count=productsCache.filter(p=>p.shopId===id).length;
 if(!count)return alert("પહેલાં પ્રોડક્ટ ઉમેરો");
 const fee=Math.ceil(count/30)*60;
 if(!confirm(`${count} પ્રોડક્ટ માટે 30 દિવસની રોકડ ફી ₹${fee} મળી છે?`))return;
 try{
  const end=new Date();
  end.setDate(end.getDate()+30);
  await db.collection("shops").doc(id).update({
   active:true,paid:true,
   subscriptionEndAt:firebase.firestore.Timestamp.fromDate(end)
  });
  await loadAll();
 }catch(e){alert(e.message)}
}

async function toggleShop(id,value){
 try{
  await db.collection("shops").doc(id).update({active:value});
  await loadAll();
 }catch(e){alert(e.message)}
}

async function editShop(id){
 const s=shopsCache.find(x=>x.id===id);if(!s)return;
 const name=prompt("દુકાનનું નામ",s.name||s.shopName||"");
 if(name===null)return;
 const phone=prompt("મોબાઇલ નંબર",s.phone||"");
 if(phone===null)return;
 const area=prompt("વિસ્તાર",s.area||"");
 if(area===null)return;
 const address=prompt("સરનામું",s.address||"");
 if(address===null)return;
 try{
  await db.collection("shops").doc(id).update({name,shopName:name,phone,area,address});
  await loadAll();
 }catch(e){alert(e.message)}
}

async function deleteShop(id){
 if(!confirm("દુકાન અને તેની બધી પ્રોડક્ટ્સ કાયમ માટે Delete કરવી છે?"))return;
 try{
  const batch=db.batch();
  productsCache.filter(p=>p.shopId===id).forEach(p=>{
   batch.delete(db.collection("products").doc(p.id));
  });
  batch.delete(db.collection("shops").doc(id));
  await batch.commit();
  await loadAll();
 }catch(e){alert(e.message)}
}

async function editProduct(id){
 const p=productsCache.find(x=>x.id===id);if(!p)return;
 const name=prompt("પ્રોડક્ટનું નામ",p.name||"");
 if(name===null)return;
 const price=prompt("ભાવ",p.price??0);
 if(price===null)return;
 const unit=prompt("Unit",p.unit||"piece");
 if(unit===null)return;
 const size=prompt("Size",p.size||"");
 if(size===null)return;
 const color=prompt("Color",p.color||"");
 if(color===null)return;
 if(!Number.isFinite(Number(price))||Number(price)<0)return alert("યોગ્ય ભાવ લખો");
 try{
  await db.collection("products").doc(id).update({
   name,price:Number(price),unit,size,color
  });
  await loadAll();
 }catch(e){alert(e.message)}
}

async function toggleProduct(id,value){
 try{
  await db.collection("products").doc(id).update({active:value});
  await loadAll();
 }catch(e){alert(e.message)}
}

async function deleteProduct(id){
 if(!confirm("આ પ્રોડક્ટ Delete કરવી છે?"))return;
 try{
  await db.collection("products").doc(id).delete();
  await loadAll();
 }catch(e){alert(e.message)}
}

async function setOrder(id,status){
 try{
  await db.collection("orders").doc(id).update({status});
  await loadAll();
 }catch(e){alert(e.message)}
}
</script>
</body>
