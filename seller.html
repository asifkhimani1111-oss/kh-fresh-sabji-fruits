<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K H Fresh - Seller Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --meesho: #9F2089; }
    .meesho-bg { background-color: var(--meesho); color: white; }
    .btn-meesho { background-color: var(--meesho); color: white; }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark meesho-bg mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">🏪 K H Fresh સેલર પેનલ</span>
    </div>
  </nav>

  <div class="container">
    <!-- Shop Status Notice -->
    <div class="card mb-4 border-start border-4 border-success shadow-sm">
      <div class="card-body">
        <h5 class="card-title text-success fw-bold">દુકાન સ્ટેટસ: સક્રિય (Active)</h5>
        <p class="mb-0 text-muted">તમારી દુકાનની વેલિડિટી <b>24 દિવસ</b> બાકી છે. (30 દિવસ પછી દુકાન ઓટોમેટિક બંધ થશે)</p>
      </div>
    </div>

    <!-- Add Product Form -->
    <div class="card shadow-sm p-3">
      <h5 class="fw-bold mb-3" style="color: var(--meesho);">નવી પ્રોડક્ટ ઉમેરો</h5>
      <form id="sellerAddForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">પ્રોડક્ટનું નામ</label>
            <input type="text" class="form-control" placeholder="જેમ કે: સફરજન / સાડી" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">કેટેગરી પસંદ કરો</label>
            <select class="form-select">
              <option>🥦 ફળ અને શાકભાજી</option>
              <option>🌾 કરિયાણું (Grocery)</option>
              <option>👗 ફેશન અને કપડાં</option>
              <option>📱 ઇલેક્ટ્રોનિક્સ</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">પ્રાઈસ (₹)</label>
            <input type="number" class="form-control" placeholder="₹ રકમ" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">માપતોલ / સાઇઝ</label>
            <input type="text" class="form-control" placeholder="જેમ કે: Kg / Pcs / S, M, L, XL">
          </div>
          <div class="col-md-4">
            <label class="form-label">કલર / પેટર્ન (જો હોય તો)</label>
            <input type="text" class="form-control" placeholder="જેમ કે: લાલ, પ્રિન્ટેડ">
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-meesho w-100 fw-bold">પ્રોડક્ટ પબ્લિશ કરો</button>
          </div>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
