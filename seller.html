
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh & Fashion - Seller</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f8f2;margin:0;padding:15px;color:#203326}
main{max-width:600px;margin:auto}
section{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
h2,h3{color:#168343}
input,select,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#168343;color:white;border:0;font-weight:bold}
.secondary{background:#555}
#appPanel{display:none}
.note{font-size:14px;color:#555}
</style>
</head>
<body>
<main>
<section>
<h2>K.H Fresh & Fashion</h2>
<h3>દુકાનદાર Login / Registration</h3>

<input id="email" type="email" placeholder="Email લખો">
<input id="password" type="password" placeholder="Password (ઓછામાં ઓછા 6 અક્ષર)">

<button id="registerBtn">નવું એકાઉન્ટ બનાવો</button>
<button id="loginBtn" class="secondary">Login કરો</button>
<button id="logoutBtn" class="secondary" style="display:none">Logout</button>
<p id="status" class="note">Login અથવા નવું એકાઉન્ટ બનાવો.</p>
</section>

<div id="appPanel">
<section>
<h3>🏪 મારી દુકાન</h3>
<input id="shopName" placeholder="દુકાનનું નામ">
<input id="shopWhatsApp" placeholder="WhatsApp નંબર, દેશના કોડ સાથે">
<button id="saveShopBtn">દુકાન બનાવો / સાચવો</button>
<p id="shopStatus" class="note"></p>
</section>

<section>
<h3>📦 નવી વસ્તુ ઉમેરો</h3>
<input id="productName" placeholder="વસ્તુનું નામ">
<select id="category">
<option value="શાકભાજી">શાકભાજી</option>
<option value="ફળો">ફળો</option>
<option value="Ice Cream & Cold Drink">Ice Cream & Cold Drink</option>
<option value="Mithai & Namkeen">Mithai & Namkeen</option>
<option value="Women / Ladies">Women / Ladies</option>
<option value="Men / Gents">Men / Gents</option>
<option value="Big Boy">Big Boy</option>
<option value="Big Girl">Big Girl</option>
<option value="Children">Children</option>
<option value="Baby Boy">Baby Boy</option>
<option value="Baby Girl">Baby Girl</option>
<option value="કરિયાણું">કરિયાણું</option>
<option value="જનરલ સ્ટોર">જનરલ સ્ટોર</option>
</select>
<input id="price" type="number" min="0" step="0.01" placeholder="ભાવ ₹">
<input id="unit" placeholder="એકમ: નંગ, કિલો, મીટર વગેરે">
<input id="imageUrl" type="url" placeholder="ફોટાની Image URL (વૈકલ્પિક)">
<input id="sizes" placeholder="સાઇઝ: S,M,L,XL (વૈકલ્પિક)">
<input id="colors" placeholder="કલર: Red,Blue,Black (વૈકલ્પિક)">
<button id="addProductBtn">પ્રોડક્ટ ઉમેરો</button>
<p id="productStatus" class="note"></p>
</section>

<section>
<h3>મારી દુકાનની વસ્તુઓ</h3>
<div id="myProducts">Login કર્યા પછી વસ્તુઓ અહીં દેખાશે.</div>
</section>
</div>
</main>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth, createUserWithEmailAndPassword,
 signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore, collection, addDoc, getDocs, query, where,
 doc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
 authDomain: "kh-fresh-sabji-fruits.firebaseapp.com",
 projectId: "kh-fresh-sabji-fruits",
 storageBucket: "kh-fresh-sabji-fruits.firebasestorage.app",
 messagingSenderId: "815611229461",
 appId: "1:815611229461:web:ca713dc978e0997930251c",
 measurementId: "G-HBL4EVF1MN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let currentUser = null;
let currentShop = null;

function status(id, message) {
 $(id).textContent = message;
}

async function runSafely(action) {
 try {
  await action();
 } catch (e) {
  console.error(e);
  alert("Error: " + e.message);
 }
}

$("registerBtn").onclick = () => runSafely(async () => {
 const email = $("email").value.trim();
 const password = $("password").value;
 if (!email || password.length < 6) {
  alert("Email ભરો અને ઓછામાં ઓછા 6 અક્ષરનો Password આપો.");
  return;
 }
 await createUserWithEmailAndPassword(auth, email, password);
 status("status", "એકાઉન્ટ બની ગયું. હવે દુકાનની માહિતી ભરો.");
});

$("loginBtn").onclick = () => runSafely(async () => {
 await signInWithEmailAndPassword(
  auth, $("email").value.trim(), $("password").value
 );
 status("status", "Login સફળ થયું.");
});

$("logoutBtn").onclick = () => runSafely(async () => {
 await signOut(auth);
});

onAuthStateChanged(auth, async user => {
 currentUser = user;
 $("appPanel").style.display = user ? "block" : "none";
 $("logoutBtn").style.display = user ? "block" : "none";
 status("status", user ? "Login: " + user.email : "હજુ Login નથી.");

 currentShop = null;
 if (user) await loadMyShop();
});

async function loadMyShop() {
 const q = query(
  collection(db, "shops"),
  where("ownerUid", "==", currentUser.uid)
 );
 const snap = await getDocs(q);

 if (!snap.empty) {
  const s = snap.docs[0];
  currentShop = {id: s.id, ...s.data()};
  $("shopName").value = currentShop.name || "";
  $("shopWhatsApp").value = currentShop.whatsapp || "";
  status("shopStatus", "તમારી દુકાન મળી ગઈ.");
  await loadMyProducts();
 } else {
  status("shopStatus", "હજુ દુકાન નથી. દુકાનનું નામ ભરીને બનાવો.");
  $("myProducts").textContent = "દુકાન બનાવ્યા પછી વસ્તુઓ ઉમેરી શકશો.";
 }
}

$("saveShopBtn").onclick = () => runSafely(async () => {
 if (!currentUser) throw new Error("પહેલાં Login કરો.");
 const name = $("shopName").value.trim();
 const whatsapp = $("shopWhatsApp").value.trim();

 if (!name || !whatsapp) {
  alert("દુકાનનું નામ અને WhatsApp નંબર ભરો.");
  return;
 }

 if (currentShop) {
  await setDoc(doc(db, "shops", currentShop.id), {
   name, whatsapp, ownerUid: currentUser.uid,
   updatedAt: serverTimestamp()
  }, {merge:true});
 } else {
  const ref = doc(collection(db, "shops"));
  await setDoc(ref, {
   name, whatsapp, ownerUid: currentUser.uid,
   createdAt: serverTimestamp()
  });
  currentShop = {id: ref.id, name, whatsapp};
 }

 status("shopStatus", "દુકાનની માહિતી સાચવાઈ ગઈ.");
 await loadMyProducts();
});

$("addProductBtn").onclick = () => runSafely(async () => {
 if (!currentUser) throw new Error("પહેલાં Login કરો.");
 if (!currentShop) throw new Error("પહેલાં તમારી દુકાન બનાવો.");

 const name = $("productName").value.trim();
 const price = Number($("price").value);
 const unit = $("unit").value.trim();

 if (!name || !unit || $("price").value === "" ||
     !Number.isFinite(price) || price < 0) {
  alert("વસ્તુનું નામ, યોગ્ય ભાવ અને એકમ ભરો.");
  return;
 }

 await addDoc(collection(db, "products"), {
  name,
  price,
  unit,
  category: $("category").value,
  imageUrl: $("imageUrl").value.trim(),
  sizes: $("sizes").value.trim(),
  colors: $("colors").value.trim(),
  shopId: currentShop.id,
  ownerUid: currentUser.uid,
  active: true,
  createdAt: serverTimestamp()
 });

 status("productStatus", "પ્રોડક્ટ ઉમેરાઈ ગઈ.");
 $("productName").value = "";
 $("price").value = "";
 $("unit").value = "";
 $("imageUrl").value = "";
 $("sizes").value = "";
 $("colors").value = "";
 await loadMyProducts();
});

async function loadMyProducts() {
 if (!currentUser || !currentShop) return;

 const q = query(
  collection(db, "products"),
  where("shopId", "==", currentShop.id)
 );
 const snap = await getDocs(q);
 const host = $("myProducts");
 host.replaceChildren();

 if (snap.empty) {
  host.textContent = "હજુ કોઈ વસ્તુ ઉમેરાઈ નથી.";
  return;
 }

 snap.forEach(d => {
  const p = d.data();
  const row = document.createElement("p");
  row.textContent = `${p.name || "વસ્તુ"} — ₹${p.price} / ${p.unit || ""}`;
  host.append(row);
 });
}
</script>
</body>
</html>
