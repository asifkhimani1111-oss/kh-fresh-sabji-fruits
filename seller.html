
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K H Fresh - Seller</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8fb;font-family:Arial;color:#333}
header{background:#e91e63;color:white;padding:18px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:650px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:13px;margin:15px 0}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
button{background:#e91e63;color:white;border:0;padding:12px 18px;border-radius:8px}
a{color:#ad1457;margin:8px}
</style>
</head>
<body>
<header>🌸 K H Fresh - Seller Panel</header>
<main>
<p><a href="index.html">ગ્રાહક પેનલ</a> | <a href="admin.html">એડમિન પેનલ</a></p>
<div class="card">
<h2>દુકાનદાર એકાઉન્ટ</h2>
<input id="name" placeholder="દુકાનદારનું નામ">
<input id="shop" placeholder="દુકાનનું નામ">
<input id="phone" placeholder="મોબાઇલ નંબર">
<input id="email" type="email" placeholder="ઈમેલ">
<input id="password" type="password" placeholder="પાસવર્ડ">
<button onclick="register()">એકાઉન્ટ બનાવો</button>
</div>
<div class="card">
<h2>દુકાનમાં પ્રોડક્ટ ઉમેરો</h2>
<input id="product" placeholder="પ્રોડક્ટનું નામ">
<input id="price" type="number" placeholder="ભાવ">
<input id="photo" type="file" accept="image/*">
<button onclick="addProduct()">પ્રોડક્ટ ઉમેરો</button>
<p id="message"></p>
</div>
</main>
<script>
function register(){
document.getElementById('message').innerText=
'સેલર એકાઉન્ટ માટે ડેટાબેઝ જોડાણ જરૂરી છે.';
}
function addProduct(){
document.getElementById('message').innerText=
'પ્રોડક્ટ સેવ કરવા માટે ડેટાબેઝ જોડાણ જરૂરી છે.';
}
</script>
</body>
</html>
