
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.H Fresh - Seller Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;font-family:Arial,sans-serif;color:#202820}
header{background:#087b43;color:white;padding:20px;text-align:center}
main{max-width:650px;margin:18px auto;padding:12px}
.card{background:white;padding:18px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
h2{font-size:20px;margin-top:0;color:#087b43}
input,select,textarea{width:100%;padding:13px;margin:7px 0 13px;border:1px solid #ccc;border-radius:9px;font-size:16px;background:white}
button{width:100%;padding:14px;background:#087b43;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;margin-top:7px}
button:disabled{opacity:.6}
.note{background:#e8f5ec;padding:12px;border-radius:9px;font-size:14px}
.preview{width:100%;max-height:220px;object-fit:contain;display:none;margin:8px 0;border-radius:10px}
#message{padding:12px;border-radius:9px;display:none;margin-bottom:15px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<header>
  <h1>K.H Fresh</h1>
  <div>દુકાનદાર પેનલ - તમારી દુકાન જાતે ઉમેરો</div>
</header>

<main>
<div id="message"></div>

<div class="card">
<h2>1. તમારી દુકાન ઉમેરો</h2>
<form id="shopForm">
<label>દુકાનનું નામ *</label>
<input id="shopName" required placeholder="દુકાનનું નામ">

<label>માલિકનું નામ *</label>
<input id="ownerName" required placeholder="માલિકનું નામ">

<label>મોબાઇલ નંબર *</label>
<input id="phone" required type="tel" placeholder="મોબાઇલ નંબર">

<label>WhatsApp નંબર</label>
<input id="whatsapp" type="tel" placeholder="WhatsApp નંબર">

<label>દુકાનનું સરનામું *</label>
<textarea id="address" required placeholder="પૂરું સરનામું"></textarea>

<label>દુકાનનો ફોટો (કેમેરા અથવા ગેલેરી)</label>
<input id="shopPhoto" type="file" accept="image/*">
<img id="shopPreview" class="preview" alt="દુકાનનો ફોટો">

<button id="shopButton" type="submit">દુકાનની અરજી મોકલો</button>
</form>
<p class="small">તમારી અરજી Admin મંજૂર કરશે ત્યાર પછી પ્રોડક્ટ ઉમેરી શકશો.</p>
</div>

<div class="card">
<h2>2. પ્રોડક્ટ ઉમેરો</h2>
<form id="productForm">
<label>દુકાન અરજી ID *</label>
<input id="shopId" required placeholder="દુકાનની અરજી પછી મળેલો ID">

<label>પ્રોડક્ટનું નામ *</label>
<input id="productName" required placeholder="પ્રોડક્ટનું નામ">

<label>કેટેગરી *</label>
<input id="category" required placeholder="જેમ કે કપડાં, શાકભાજી, ફળો">

<label>ભાવ *</label>
<input id="price" type="number" min="0" step="0.01" required placeholder="પ્રોડક્ટનો ભાવ">

<label>માપ / યુનિટ</label>
<input id="unit" placeholder="કિલો, નંગ, પીસ, લીટર, મીટર વગેરે">

<label>સાઇઝ</label>
<input id="size" placeholder="S, M, L, XL અથવા અન્ય">

<label>કલર</label>
<input id="color" placeholder="પ્રોડક્ટનો રંગ">

<label>ડિઝાઇન / વિગતો</label>
<input id="design" placeholder="ડિઝાઇન અથવા અન્ય વિગતો">

<label>સ્ટોક</label>
<input id="stock" type="number" min="0" placeholder="સ્ટોકની સંખ્યા">

<label>પ્રોડક્ટનો ફોટો (કેમેરા અથવા ગેલેરી)</label>
<input id="productPhoto" type="file" accept="image/*">
<img id="productPreview" class="preview" alt="પ્રોડક્ટનો ફોટો">

<button id="productButton" type="submit">પ્રોડક્ટની અરજી મોકલો</button>
</form>
</div>

<div class="note">
<strong>મહત્વપૂર્ણ:</strong> દુકાન અને પ્રોડક્ટની અરજી Admin મંજૂર કર્યા પછી જ ગ્રાહકોને દેખાશે. અરજી ID સાચવી રાખજો.
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGSZ7QcASC_sUV6f7NDJrMbn0Ae-f9pR8",
  authDomain: "kh-fresh-sabji-fruits.firebaseapp.com",
  projectId: "kh-fresh-sabji-fruits",
  storageBucket: "kh-fresh-sabji-fruits.firebasestorage.app",
  messagingSenderId: "815611229461",
  appId: "1:815611229461:web:ca713dc978e0997930251c",
  measurementId: "G-HBL4EVF1MN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Cloudinary સેટિંગ
const CLOUDINARY_NAME = "irdsjwvm";
const CLOUDINARY_UPLOAD_PRESET = "khfresh";

const $ = id => document.getElementById(id);

function showMessage(message, success=false) {
  const box = $("message");
  box.style.display = "block";
  box.style.background = success ? "#d9f7df" : "#ffe4e4";
  box.style.color = success ? "#075b2b" : "#a00000";
  box.textContent = message;
  box.scrollIntoView({behavior:"smooth",block:"center"});
}

function preview(inputId, imageId) {
  $(inputId).addEventListener("change", () => {
    const file = $(inputId).files[0];
    const img = $(imageId);
    if (!file) {
      img.style.display = "none";
      return;
    }
    if (!file.type.startsWith("image/")) {
      showMessage("કૃપા કરીને ફોટો પસંદ કરો.");
      $(inputId).value = "";
      return;
    }
    img.src = URL.createObjectURL(file);
    img.style.display = "block";
  });
}

preview("shopPhoto","shopPreview");
preview("productPhoto","productPreview");

async function uploadImage(file) {
  if (!file) return "";

  if (CLOUDINARY_UPLOAD_PRESET === "YOUR_UNSIGNED_PRESET") {
    throw new Error("Cloudinary Upload Preset સેટ કરવાનું બાકી છે.");
  }

  const data = new FormData();
  data.append("file", file);
  data.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const response = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_NAME}/image/upload`,
    {method:"POST",body:data}
  );

  const result = await response.json();

  if (!response.ok || !result.secure_url) {
    throw new Error(result.error?.message || "ફોટો અપલોડ થયો નથી.");
  }

  return result.secure_url;
}

// દુકાન અરજી
$("shopForm").addEventListener("submit", async e => {
  e.preventDefault();
  const button = $("shopButton");
  button.disabled = true;
  button.textContent = "અરજી મોકલાઈ રહી છે...";

  try {
    const file = $("shopPhoto").files[0];
    const shopImageUrl = await uploadImage(file);

    const ref = await addDoc(collection(db,"shopApplications"), {
      shopName: $("shopName").value.trim(),
      ownerName: $("ownerName").value.trim(),
      phone: $("phone").value.trim(),
      whatsapp: $("whatsapp").value.trim(),
      address: $("address").value.trim(),
      shopImageUrl,
      status: "pending",
      createdAt: serverTimestamp()
    });

    showMessage(
      "દુકાનની અરજી સફળતાપૂર્વક મોકલાઈ! તમારી અરજી ID: " + ref.id +
      " — આ ID સાચવી રાખજો.",
      true
    );
    $("shopId").value = ref.id;
    $("shopForm").reset();
    $("shopPreview").style.display = "none";
  } catch (error) {
    showMessage("અરજી મોકલવામાં સમસ્યા: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "દુકાનની અરજી મોકલો";
  }
});

// પ્રોડક્ટ અરજી
$("productForm").addEventListener("submit", async e => {
  e.preventDefault();
  const button = $("productButton");
  button.disabled = true;
  button.textContent = "પ્રોડક્ટ મોકલાઈ રહી છે...";

  try {
    const shopId = $("shopId").value.trim();
    const shopSnap = await getDoc(doc(db,"shopApplications",shopId));

    if (!shopSnap.exists()) {
      throw new Error("દુકાન અરજી ID મળ્યો નથી.");
    }
    if (shopSnap.data().status !== "approved") {
      throw new Error("તમારી દુકાન Admin દ્વારા મંજૂર થયા પછી પ્રોડક્ટ ઉમેરી શકશો.");
    }

    const file = $("productPhoto").files[0];
    const imageUrl = await uploadImage(file);

    await addDoc(collection(db,"productApplications"), {
      shopApplicationId: shopId,
      shopName: shopSnap.data().shopName,
      name: $("productName").value.trim(),
      category: $("category").value.trim(),
      price: Number($("price").value),
      unit: $("unit").value.trim(),
      size: $("size").value.trim(),
      color: $("color").value.trim(),
      design: $("design").value.trim(),
      stock: Number($("stock").value || 0),
      imageUrl,
      status: "pending",
      createdAt: serverTimestamp()
    });

    showMessage("પ્રોડક્ટની અરજી સફળતાપૂર્વક મોકલાઈ! Admin મંજૂરી આપશે.",true);
    const savedShopId = shopId;
    $("productForm").reset();
    $("shopId").value = savedShopId;
    $("productPreview").style.display = "none";
  } catch (error) {
    showMessage("પ્રોડક્ટ મોકલવામાં સમસ્યા: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "પ્રોડક્ટની અરજી મોકલો";
  }
});
</script>
</body>
</html>
