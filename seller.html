<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K.H Fresh & Fashion - Seller</title>
  <link rel="stylesheet" href="seller.css">
</head>
<body>

  <header class="top-header">
    <h2>K.H Fresh & Fashion</h2>
    <nav>
      <a href="index.html">Customer Page</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main class="seller-container">

    <section id="authSection" class="seller-card">
      <h2>Seller Account</h2>

      <div id="registerBox">
        <h3>નવું સેલર એકાઉન્ટ બનાવો</h3>

        <label>તમારું નામ</label>
        <input type="text" id="sellerName" placeholder="તમારું નામ">

        <label>મોબાઇલ નંબર</label>
        <input type="tel" id="sellerPhone" placeholder="મોબાઇલ નંબર">

        <label>Email</label>
        <input type="email" id="sellerEmail" placeholder="Email">

        <label>Password</label>
        <input type="password" id="sellerPassword" placeholder="ઓછામાં ઓછા 6 અક્ષર">

        <button id="registerBtn">રજિસ્ટર કરો</button>
      </div>

      <hr>

      <div id="loginBox">
        <h3>સેલર લોગિન</h3>

        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Email">

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Password">

        <button id="loginBtn">લોગિન કરો</button>
      </div>

      <p id="authMessage" class="message"></p>
    </section>

    <section id="sellerDashboard" class="seller-card hidden">

      <div class="dashboard-heading">
        <div>
          <h2>સેલર ડેશબોર્ડ</h2>
          <p id="welcomeSeller"></p>
        </div>
        <button id="logoutBtn" class="logout-btn">લોગઆઉટ</button>
      </div>

      <hr>

      <section id="shopFormSection">
        <h3>તમારી દુકાનની માહિતી</h3>

        <label>દુકાનનું નામ</label>
        <input type="text" id="myShopName" placeholder="દુકાનનું નામ">

        <label>માલિકનું નામ</label>
        <input type="text" id="myShopOwner" placeholder="માલિકનું નામ">

        <label>ગામ / વિસ્તાર</label>
        <input type="text" id="myShopArea" placeholder="ગામ અથવા વિસ્તાર">

        <label>મોબાઇલ નંબર</label>
        <input type="tel" id="myShopPhone" placeholder="મોબાઇલ નંબર">

        <label>WhatsApp નંબર</label>
        <input type="tel" id="myShopWhatsapp" placeholder="WhatsApp નંબર">

        <label>દુકાનનો ફોટો પસંદ કરો</label>
        <input type="file" id="myShopImage" accept="image/*">
        <img id="shopImagePreview" class="image-preview hidden" alt="Shop preview">

        <label>ઓર્ડરનો નિયમ</label>
        <select id="myShopRule">
          <option value="none">કોઈ લઘુત્તમ ઓર્ડર નહીં</option>
          <option value="kg2">ઓછામાં ઓછા 2 કિલો</option>
          <option value="amount500">ઓછામાં ઓછા ₹500</option>
          <option value="custom">કસ્ટમ નિયમ</option>
        </select>

        <label>કસ્ટમ લઘુત્તમ રકમ (₹)</label>
        <input type="number" id="myShopMinimum" min="0" placeholder="જરૂર હોય તો રકમ લખો">

        <button id="saveShopBtn">દુકાનની માહિતી સાચવો</button>
      </section>

      <hr>

      <section id="productFormSection">
        <h3>નવો પ્રોડક્ટ ઉમેરો</h3>

        <label>પ્રોડક્ટનું નામ</label>
        <input type="text" id="productName" placeholder="પ્રોડક્ટનું નામ">

        <label>કેટેગરી</label>
        <input type="text" id="productCategory" placeholder="ફળ, શાકભાજી, કરિયાણા વગેરે">

        <label>કિંમત (₹)</label>
        <input type="number" id="productPrice" min="0" placeholder="કિંમત">

        <label>એકમ</label>
        <select id="productUnit">
          <option value="kg">કિલો</option>
          <option value="g">ગ્રામ</option>
          <option value="liter">લિટર</option>
          <option value="ml">મિલીલીટર</option>
          <option value="meter">મીટર</option>
          <option value="inch">ઇંચ</option>
          <option value="piece">નંગ</option>
          <option value="pack">પેકેટ</option>
          <option value="size">સાઇઝ</option>
          <option value="custom">અન્ય</option>
        </select>

        <label>પ્રોડક્ટનો ફોટો પસંદ કરો</label>
        <input type="file" id="productImage" accept="image/*">
        <img id="productImagePreview" class="image-preview hidden" alt="Product preview">

        <button id="saveProductBtn">પ્રોડક્ટ ઉમેરો</button>
      </section>

      <hr>

      <section>
        <h3>મારી દુકાનના પ્રોડક્ટ્સ</h3>
        <div id="myProductList"></div>
      </section>

      <hr>

      <section>
        <h3>મારા ઓર્ડર</h3>
        <div id="myOrderList"></div>
      </section>

      <p id="sellerMessage" class="message"></p>

    </section>

  </main>

  <footer>
    <p>© K.H Fresh & Fashion</p>
  </footer>

  <script type="module" src="seller.js"></script>
</body>
</html>
